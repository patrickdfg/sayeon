<script>
(function(){
  const PASSCODE = '7125';
SayeonAnalytics.trackSectionVisit('stones');
  const gate = document.getElementById('gate');
  const appEl = document.getElementById('app');
  const gateForm = document.getElementById('gateForm');
  const gateInput = document.getElementById('gateInput');
  const gateError = document.getElementById('gateError');
  const gateBox = document.getElementById('gateBox');

  function unlock(){
    localStorage.setItem('wmdUnlocked', '1');
    gate.classList.add('hidden');
    appEl.removeAttribute('inert');
  }

  if(localStorage.getItem('wmdUnlocked') === '1'){
    unlock();
  } else {
    setTimeout(() => gateInput.focus(), 60);
  }

  gateForm.addEventListener('submit', function(e){
    e.preventDefault();
    if(gateInput.value.trim() === PASSCODE){
      unlock();
    } else {
      gateError.textContent = '암호가 올바르지 않습니다. 다시 입력해 주세요.';
      gateBox.classList.remove('shake');
      void gateBox.offsetWidth;
      gateBox.classList.add('shake');
      gateInput.value = '';
      gateInput.focus();
    }
  });

닥에 피가 나도록 한생명 한생명 찾아다니며 살려주시고 휴거시키시기 위해서 애쓰신 성자의 발바닥)"}, {"type": "li", "text": "5. 성령님 형상"}, {"type": "li", "text": "6. 펜텀기 형상 (시대 사명자를 상징, 핵폭탄 같은 말씀 폭탄을 장착하고 있는 모습)"}, {"type": "quote", "text": "\"성자바위가 너무 신기하니 눈길이 가지 않느냐. 이와같이 너희들의 정신도 생각, 마음, 행실, 영과 혼도 나 성자를 닮은 신비한 형상으로 만들어야 한다. 그래야 하늘나라에 영원히 살 수 있다.\""}], "search": "성자바위 무게 : 130톤 \n\"전능하신 성자께서 70년 동안 이 세상에서 그 육신을 쓰고 성약 휴거 역사를 진행하셨다.\n그리고 휴거 전에 휴거 기념 선물로 사랑하는 신부들에게 이 돌을 남기고 가셨다.\n바로 늘 성자를 생각하라 함이다.\"\n\n## 의미\n선생님께서 10, 20대 때 이 바위 위에서 나고 있는 돌나물도 캐 가시고 많이 다니셨던 길에 있던 바위이다. 선생님과 사연이 많이 있는 뜻있는 바위이다.\n\n\"성자께서 휴거역사 전에 신부들에게 주신 선물\"\n\"천년동안 자랑하라고 주신 특별한 선물\"\n\"선생님께서 본체와 분체의 근본의 말씀을 푸시고 나서 성자께서 주신 선물\"\n\"1999년부터 2012년까지 선생님이 14년간 무덤기간을 마치고 부활한 2012년을 기념해서 성자께서 주신 선물\"\n\"천 년동안 우리를 휴거시켜주실 성자를 생각하고 그 분체인 시대 사명자를 변함없이 사랑하며 가라고 선물\"\n\n## 발견된 사연\n선생님께서 2012년 5월부터 21일동안 성자의 기도기간에 간절히 기도하셨다. 10월에 월명동에 돌축제 있었는데 정말 사연있고 정말 의미있고 모든 사람들이 놀라서 까무러칠 특별한 작품을 달라고 성자께 21일동안 기도하셨는데, 21일 기도가 끝나는 날 선생님께 성자바위를 발견했다는 보고가 왔다.\n\n## 발견된 장소\n성자바위를 찾게 된 곳은 월명동에서 아주 가까운 명막골이다. 2012년도에 3.16휴거기념관을 짓기 위해 터 파기(공사)를 하면서 나온 흙을 명막골에 갖다 버리기 위해서 사토장 작업을 하고 있었는데, 그때 바로 논 위에 작은 바위가 보였는데 파보았더니 이 엄청난 바위가 파오게 나온 것이다. 선생님께서는 \"기도하지 않았으면 조금만 나와있는 성자바위를 찾지 못했을 거다\"라고 하셨다.\n\n## 형상을 발견한 사연\n선생님께서 2013년에 6월부터 11월까지 섭리인들 모두의 휴거를 위해서 절식 기도를 하셨다. 그때 선생님은 성자께 모두가 보면 정말 \"으악\"하고 놀랄 수 밖에 없는 깜짝 놀랄만한 귀한 하늘의 작품을 주십시오 라고 간절히 기도했다. 그때 성자께서 성자바위를 다시 사진을 보여주시면서 자세히 보고 말씀해주시고, 그때 성령님께서 하나님의 뜻으로 형상을 보시게 되었다. \"찾는 것이 보화다.\" 라는 말씀을 통해 성자바위의 여러 형상들을 찾게 해주셨다.\n\n1. 성자의 형상\n2. 독수리 모습 & 사람의 모습을 닮은 인독수리 형상\n3. 하나님 형상\n4. 발바닥 형상 (성자의 발바닥 / 7개의 발가락 & 빨간 발바닥 / 7 완전수 온 인류의 구원과 하나님의 역사를 위해 발바닥에 피가 나도록 한생명 한생명 찾아다니며 살려주시고 휴거시키시기 위해서 애쓰신 성자의 발바닥)\n5. 성령님 형상\n6. 펜텀기 형상 (시대 사명자를 상징, 핵폭탄 같은 말씀 폭탄을 장착하고 있는 모습)\n\n\"성자바위가 너무 신기하니 눈길이 가지 않느냐. 이와같이 너희들의 정신도 생각, 마음, 행실, 영과 혼도 나 성자를 닮은 신비한 형상으로 만들어야 한다. 그래야 하늘나라에 영원히 살 수 있다.\"\n"}, {"num": "2", "title": "큰바위얼굴 바위", "meta": "무게 : 104톤", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGR 이 얽히게 하여, 결국 선생을 상징하는 돌로 주셨다. 이완구씨의 논에서 캐 온 돌이다. 선생이 초등학교 다닐 때였다. 석막리 동네에 큰 바위가 박혀 있는 논이 있었다. 이 돌은 논 주인의 아주머니가 광주리에 밥을 담아 날라 오면 일하던 사람들이 모두 모여서 함께 둘러앉아 밥 먹는 장소로도 사용하던 귀한 바위였다. 주인은 \"바위 멋있지? 그런데 논갈이할 때 걸려, 작으면 굴려서 내버리는데 커서 그냥 놓아둔 거야.\"라고 했다. 그 말을 듣고 선생은 언젠가 이 돌을 꼭 끌어다가 월명동 마당에 갖다 놓고 싶다고 말했다. 주인도 가져갈 수 있으면 주겠다고 했다."}, {"type": "h", "text": "발견된 사연"}, {"type": "p", "text": "선생이 홍콩에 있을 때, 인터넷 화면으로 작업현장을 보면서 일할 때 문득 선생이 12세 때 논 주인이 준다고 했던 큰 바윗돌이 생각나서 즉시 전화로 범석 목사를 불러 지시했다. 동생 범석 목사가 가서 얘기하니 주인이 \"캐 가면 좋지, 약속대로 줘야지. 내가 정 총재님 좋아하니까.\"라고 말했다고 한다. 그래서 돌 캐내는 작업을 시작했다. 돌은 겉으로는 70톤 정도로 보였는데, 캐보니 무게가 104톤이나 나갔다. 돌이 너무 무거우니 150톤 크레인 가지고도 안 돼서 300톤 크레인으로 들어 한국에서 최고로 힘 좋은 트레일러에 실어서 갖은 위험을 무릅쓰고 옮기기 시작했다. 돌을 싣고서 최고 경사진 곳을 올라오다가 트레일러가 힘이 없어서 더 이상 못 올라가니까 기사가 브레이크를 밟았는데 돌이 너무 무거워서 변속기가 부서져 트레일러가 갑자기 뒤로 밀렸다. 아찔한 순간에 포크레인 기사가 트레일러 뒤를 바가지로 딱 막아서 대형 사고를 면했다. 선생은 해외에서 인터넷 화면으로 보면서 순간 하나님과 성자와 성령님을 부르고, 소리를 질렀다. 전능하신 하나님과 성자께서 차가 멈추게 기적을 보이셨다. 이 날생은 돌을 다시 내리고 트레일러는 공장에 보내고 작업을 더 진행하지 못했다. 다음날 한국에서 제일 힘이 좋은 더 큰 트레일러를 불러서 거기에 바위를 싣고, 앞에서 포크레인이 트레일러를 끌고 뒤에서 볼도저로 밀면서 옮겼다. 그 전에는 80톤 정도만 옮겨 보았고, 선생 넘이 돌을 옮기는 것은 이 때가 처음이었다"}, {"type": "h", "text": "형상을 발견한 사연"}, {"type": "p", "text": "이 바위에는 두 개의 사람 얼굴 형상이 있는데, 하나는 '큰 바위 얼굴 전설을 이루는 자의 성장기 얼굴'이고, 다른 하나는 '다 커서 뜻을 이룬 얼굴'이다. 2014년 4월에는 이 바위에서 새로운 형상, 호랑이 얼굴 형상을 발견했다. 콧, 윗입술, 아래턱이 그린 것같이 그 형상이 뚜렷하다. 큰바위얼굴바위에는 두 개의 동물 형상이 있다. 하나는 호랑이 형상이고, 또 하나는 사자 형상이다. 호랑이와 사자 모두 '왕'을 상징한다."}, {"type": "p", "text": "큰바위얼굴 돌은 2002년 10월 10일에 월명동으로 옮겨졌다. 2012년 5월에 갖다 놓은 성자 바위와 한 쌍이다. 성자바위는 '하늘 성자바위', 이 바위는 '땅의 성자바위' 라고도 부르게 되었다."}, {"type": "quote", "text": "\"성자께서 미리 아시고 성령께서 감동주어 어릴 적 12세때부터 좋아하게 만드셨다. 선생으로 하여금 돌을 캐 간다고 말하게 하셨고, 결국 42년 만에 그 날의 약속을 이루게 하셨다. 고로 앞날을 위해 미리 해야한다.\""}], "search": "큰바위얼굴 바위 무게 : 104톤 \n## 의미\n선생 상징. 큰바위얼굴바위는 '큰바위얼굴의 전설' 과 같이 성경의 전설과 하나님의 예언을 이룰 구원자 상징 형상석이다.\n\n## 발견된 장소\n42년 전 선생이 10대 초반일 때 주인을 통해 이 돌을 주도록 사연이 얽히게 하여, 결국 선생을 상징하는 돌로 주셨다. 이완구씨의 논에서 캐 온 돌이다. 선생이 초등학교 다닐 때였다. 석막리 동네에 큰 바위가 박혀 있는 논이 있었다. 이 돌은 논 주인의 아주머니가 광주리에 밥을 담아 날라 오면 일하던 사람들이 모두 모여서 함께 둘러앉아 밥 먹는 장소로도 사용하던 귀한 바위였다.\n주인은 \"바위 멋있지? 그런데 논갈이할 때 걸려, 작으면 굴려서 내버리는데 커서 그냥 놓아둔 거야.\"라고 했다. 그 말을 듣고 선생은 언젠가 이 돌을 꼭 끌어다가 월명동 마당에 갖다 놓고 싶다고 말했다. 주인도 가져갈 수 있으면 주겠다고 했다.\n\n## 발견된 사연\n선생이 홍콩에 있을 때, 인터넷 화면으로 작업현장을 보면서 일할 때 문득 선생이 12세 때 논 주인이 준다고 했던 큰 바윗돌이 생각나서 즉시 전화로 범석 목사를 불러 지시했다. 동생 범석 목사가 가서 얘기하니 주인이 \"캐 가면 좋지, 약속대로 줘야지. 내가 정 총재님 좋아하니까.\"라고 말했다고 한다.\n그래서 돌 캐내는 작업을 시작했다. 돌은 겉으로는 70톤 정도로 보였는데, 캐보니 무게가 104톤이나 나갔다. 돌이 너무 무거우니 150톤 크레인 가지고도 안 돼서 300톤 크레인으로 들어 한국에서 최고로 힘 좋은 트레일러에 실어서 갖은 위험을 무릅쓰고 옮기기 시작했다. 돌을 싣고서 최고 경사진 곳을 올라오다가 트레일러가 힘이 없어서 더 이상 못 올라가니까 기사가 브레이크를 밟았는데 돌이 너무 무거워서 변속기가 부서져 트레일러가 갑자기 뒤로 밀렸다. 아찔한 순간에 포크레인 기사가 트레일러 뒤를 바가지로 딱 막아서 대형 사고를 면했다. 선생은 해외에서 인터넷 화면으로 보면서 순간 하나님과 성자와 성령님을 부르고, 소리를 질렀다.\n전능하신 하나님과 성자께서 차가 멈추게 기적을 보이셨다.\n이 날생은 돌을 다시 내리고 트레일러는 공장에 보내고 작업을 더 진행하지 못했다.\n다음날 한국에서 제일 힘이 좋은 더 큰 트레일러를 불러서 거기에 바위를 싣고, 앞에서 포크레인이 트레일러를 끌고 뒤에서 볼도저로 밀면서 옮겼다.\n그 전에는 80톤 정도만 옮겨 보았고, 선생 넘이 돌을 옮기는 것은 이 때가 처음이었다\n\n## 형상을 발견한 사연\n이 바위에는 두 개의 사람 얼굴 형상이 있는데, 하나는 '큰 바위 얼굴 전설을 이루는 자의 성장기 얼굴'이고, 다른 하나는 '다 커서 뜻을 이룬 얼굴'이다.\n2014년 4월에는 이 바위에서 새로운 형상, 호랑이 얼굴 형상을 발견했다.\n콧, 윗입술, 아래턱이 그린 것같이 그 형상이 뚜렷하다.\n큰바위얼굴바위에는 두 개의 동물 형상이 있다. 하나는 호랑이 형상이고, 또 하나는 사자 형상이다. 호랑이와 사자 모두 '왕'을 상징한다.\n\n큰바위얼굴 돌은 2002년 10월 10일에 월명동으로 옮겨졌다. 2012년 5월에 갖다 놓은 성자 바위와 한 쌍이다. 성자바위는 '하늘 성자바위', 이 바위는 '땅의 성자바위' 라고도 부르게 되었다.\n\n\"성자께서 미리 아시고 성령께서 감동주어 어릴 적 12세때부터 좋아하게 만드셨다. 선생으로 하여금 돌을 캐 간다고 말하게 하셨고, 결국 42년 만에 그 날의 약속을 이루게 하셨다. 고로 앞날을 위해 미리 해야한다.\"\n"}, {"num": "3", "title": "여호와이레솔", "meta": null, "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFpAiUDASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAABQIDBAYAAQcI/8QAThAAAgEDAwEGBAIGBgYJBAEFAQIDAAQRBRIhMQYTIkFRYQcUcYEykRUjQqGxwQgzUrLR4RYkYnKi0hc0NUNTY4KS8CVz4vEYwmR0g5P/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAKhEAAgICAgIDAQACAgIDAAAAAAECEQMhEjEEEzJBUSIUYQVCM3FSYoH vLy866f6Uqs5+PCXyDk2c4g+F1zFcPI+tB0I4X5fGPvu5ojF8PzBbbItQ/WYxvaPP86uo6ms9a534OB/9Qs56PhhK0rSSavuZhz+q/wA6wfC5gBnUwfrF/nXQvOtimvAwXfEVnPZfhi5GIdSRFJycwZP96lJ8M2WTedUBIOQe6/zq/wDka2Ogrb/ExVVFcmc+f4YswIGqAA/+V/8AlWl+GcokjJ1YEIcgCLrg/WuhHpSfMVS8bGukHJmQx93CiZztUDPrWUsVlbJVog//2Q=="], "sections": [{"type": "h", "text": "의미"}, {"type": "p", "text": "여호와이레솔은 하나님께서 준비했다가 주신 소나무로, \"걱정 말아라. 네가 기대했던 소나무가 눈보라에 뽑혀 죽었어도 더 좋은 소나무가 있다. 이 소나무를 캐다 심어라.\" 하신 소나무이다. 어떤 일이 안 되어 낙심하고 있을 때 \"걱정하지 말아라. 더 좋은 것을 준비해 놓았다.\" 하고 계시하는 소나무이다."}, {"type": "h", "text": "여호와이레솔을 가져오게 된 사연"}, {"type": "p", "text": "선생님께서 횟골에서 돌아오는 길에 작은 흑송 한 그루를 발견하셨다. 키는 작지만 캐서 심으면 좋겠다고 생각하며, 바쁜 일정으로 인해 가지치기를 다음에 해주겠다고 약속하셨다. 시간이 지나 월명동 개발 중 소나무가 필요해지자, 작년에 보았던 흑송이 떠올라 포클레인을 끌고 다시 찾아가셨다."}, {"type": "p", "text": "그러나 그 소나무는 겨울 동안 눈의 무게를 견디지 못하고 뿌리째 뽑혀 있었다. 아직 뿌리가 마르지 않았기에 심으면 살 수도 있겠다고 생각했지만, 소나무 담당 제자는 가져가도 결국 죽을 것이라고 말했다. 선생님께서는 성자가 감동이었는데도 지켜내지 못한 것 같아 죄송한 마음으로 회개하고 있었다."}, {"type": "p", "text": "그때, 주변을 살펴보던 중 칡넝쿨에 덮인 또 다른 소나무 한 그루를 발견하셨다. 가까이 가보니 넘어져 있던 소나무보다 훨씬 더 멋진 가부리 흥송이었다. 그 순간, 입에서 '여호와 이레'라는 말이 저절로 나오셨다. 이는 \"하나님께서 예비해 놓으셨다\"는 의미다. 결국, 이 흥송을 캐어 가져가기로 했고, 바위 위에서 자란 덕분에 쉽게 옮길 수 있었다."}, {"type": "p", "text": "흥송은 월명동에서도 보기 드문 희귀종이다. 이후 해마다 정성껏 가꾸고 퇴비를 주며 돌본 결과, 지금은 아름드리 거목이 되었다."}, {"type": "p", "text": "하나님의 뜻은 인간이 그 깊고 깊은 사연을 겪으면서도 알 수가 없다. 사연의 숲을 통해 하나님의 뜻을 깨닫게 되셨다. 이와같이 실패했다고 낙심하거나 포기하지 말고, 혹여 책임을 다하지 못해 사라졌다고 좌절하지 말아야 한다. 하나님의 일이면 반드시 더 좋은 것을 주신다. 이러한 깊은 사연을 가지고 있는 나무가 바로 '여호와이레솔'이다."}, {"type": "quote", "text": "\"주는 옆에 계시사 우리가 어떻게 하는지 보시고, 행위대로 갚아 주고 가신다.\""}], "search": "여호와이레솔  \n## 의미\n여호와이레솔은 하나님께서 준비했다가 주신 소나무로, \"걱정 말아라. 네가 기대했던 소나무가 눈보라에 뽑혀 죽었어도 더 좋은 소나무가 있다. 이 소나무를 캐다 심어라.\" 하신 소나무이다. 어떤 일이 안 되어 낙심하고 있을 때 \"걱정하지 말아라. 더 좋은 것을 준비해 놓았다.\" 하고 계시하는 소나무이다.\n\n## 여호와이레솔을 가져오게 된 사연\n선생님께서 횟골에서 돌아오는 길에 작은 흑송 한 그루를 발견하셨다. 키는 작지만 캐서 심으면 좋겠다고 생각하며, 바쁜 일정으로 인해 가지치기를 다음에 해주겠다고 약속하셨다. 시간이 지나 월명동 개발 중 소나무가 필요해지자, 작년에 보았던 흑송이 떠올라 포클레인을 끌고 다시 찾아가셨다.\n\n그러나 그 소나무는 겨울 동안 눈의 무게를 견디지 못하고 뿌리째 뽑혀 있었다. 아직 뿌리가 마르지 않았기에 심으면 살 수도 있겠다고 생각했지만, 소나무 담당 제자는 가져가도 결국 죽을 것이라고 말했다. 선생님께서는 성자가 감동이었는데도 지켜내지 못한 것 같아 죄송한 마음으로 회개하고 있었다.\n\n그때, 주변을 살펴보던 중 칡넝쿨에 덮인 또 다른 소나무 한 그루를 발견하셨다. 가까이 가보니 넘어져 있던 소나무보다 훨씬 더 멋진 가부리 흥송이었다. 그 순간, 입에서 '여호와 이레'라는 말이 저절로 나오셨다. 이는 \"하나님께서 예비해 놓으셨다\"는 의미다. 결국, 이 흥송을 캐어 가져가기로 했고, 바위 위에서 자란 덕분에 쉽게 옮길 수 있었다.\n\n흥송은 월명동에서도 보기 드문 희귀종이다. 이후 해마다 정성껏 가꾸고 퇴비를 주며 돌본 결과, 지금은 아름드리 거목이 되었다.\n\n하나님의 뜻은 인간이 그 깊고 깊은 사연을 겪으면서도 알 수가 없다. 사연의 숲을 통해 하나님의 뜻을 깨닫게 되셨다. 이와같이 실패했다고 낙심하거나 포기하지 말고, 혹여 책임을 다하지 못해 사라졌다고 좌절하지 말아야 한다. 하나님의 일이면 반드시 더 좋은 것을 주신다.\n이러한 깊은 사연을 가지고 있는 나무가 바로 '여호와이레솔'이다.\n\n\"주는 옆에 계시사 우리가 어떻게 하는지 보시고, 행위대로 갚아 주고 가신다.\"\n"}, {"num": "4", "title": "산수경석", "meta": "길이 12m, 높이 1m 이상의 대걸작 산수경석", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFbAe0DASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwECBAUGBwAI/8QAWBAAAgEDAgMGAgUHBwcHCgcAAQIDAAQREiEFMUEGEyJRYXGBkQcUMqGxFSNCUsHR4hczYnKy4fAIJDQ1gpOiFkVTVWNz8RglJjZkdIOSlMI3Q1aEo7PS/8QAGQEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAJBEBAQACAQUBAAMBAQEAAAAAAAECEQMSFCExUQQTMkEiYUL/2gAMAwEAAhEDEQA/AO4dru0a9lOz8nFGtWugjondq2knUcZzg1zpvp7QMQOz5I9bsA/LRWm+mME/Rvc6W0nv4f7Yr5snj7tgqty86JCkdp/l+X/9OnHn9bHPy+xQx/lBqx/9W/f/ADwbf8FcYmYxgaTvjOBioMkjzjEbLpzk8s09Hp3Kb/KJihnEf/J0tkZyLv8Agon/AJQkOgsvAc4OMG6IJ9R4K4Sp7krH4ThgVJO+TnY+hx91HbRNIgDaHIyFzgmjQ07lH/lALK+F7OtpxnP1ofhopj/5QICl17NsyAE5N3jp/UrjVvGbcMzamYb4I5U6aGK5i70Ssiru22dNGhp13/yiVHPsy2P/AHsb/wDBS2v+UVFNdxxSdm2iVzpLm7B0+X6FcXniaR896chQGXRg8udMtO5ln7liqhQWzjJY/wB1Ghp3d/p5CrqPZ7w5xn63t7/Y5U0fT4njDdnirrsB9bB1f8NcVt+KBMq8YZR+suOv4daLJcW0iKIpGeVjqwAAg336ZpaGnXG/yhws/dt2ZII3P+eDb/gqRb/T/DO5H5AKKP0jc/uSuIS6o7iMlULSgkqvQUVyUUrEe7LrnPlRoadsP09YKD/k6Mvyxee/9D0pq/T4z25mXs22lW0ti75f8FcQExyjsAScEdCP8b1MsW8ToXCg7+9PRadhi/ygEkOD2dYHGRm65/8ABRF+noaGc9nCANx/nQ3H/wAnvXJ34fFJpYPjI8JG+9ChVxBKrqypkK5wCFG+GHxG9PQ07EPp0Royy8Bzjp9a3 우 흙을 파내고 바위를 더 드러냈습니다. 4~5일 동안 공사하여 잘 완성해 놓으니 정말 대걸작 산수경석이었습니다. 과거 이 바윗돌은 선생님과 동네 사람들이 밟고 다니는 길바닥에 있었습니다. 선생님은 지게를 지고 다닐 때 이 돌이 걸린다고 불평이 많았습니다. 밟으면 미끄러지고, 지게 다리가 돌에 걸려서 짐을 지고 넘어지기도 했습니다. 어느 때는 화가 나서 \"이놈의 돌, 쇠망치를 가져다 깨부수어 버리면 속 시원하겠다.\" 했으나, 돌이 너무 커서 깰 수가 없었습니다. 60년 동안 속 썩이고, 걸리적거리고, 불편하게 한 바위, 이같이 천대받고 짓밟히던 돌이 뒤바뀌어 대걸작이 되었습니다. 하나님은 이미 아시고 다 갖추어 놓았습니다. 찾아낼 수 없는 시대에는 전혀 생각을 할 수가 없었던 것인데, 때가 되어야 뒤바뀝니다. 하나님의 때가 되면 하나님이 창조한 돌도, 나무도, 환경도, 사람도 모두가 빛을 발하게 됩니다."}, {"type": "quote", "text": "\"하나님은 때가 와야 숨긴 것들이 드러나게 하십니다. 사람도 그러합니다. 자기도, 다른 존재물도 때가 되면 귀하게 보화같이 됩니다.\""}], "search": "산수경석 길이 12m, 높이 1m 이상의 대걸작 산수경석 \n<산수경석>은 좌측 봉이 높고, 우측 봉은 낮아야 됩니다.\n\n## 형상을 자세히 보는 방법\n잔디밭 쪽으로 10m쯤 떨어진 위치에, 누워서 엎드린 자세를 하고 그 돌을 보면 형상이 더 뚜렷하고, 뒤쪽의 낙타바위까지 겹쳐 보면 웅장도 하고 그야말로 비경입니다. 산수경석과 낙타바위, 수낙타 암낙타 계속해서 이어지는 산맥들이 보이고 맨 위에 하얀색 바위는 마치 녹지 않는 만년설처럼 보입니다.\n\"수낙타와 암낙타 그리고 멀리 잔디밭 상단에 있는 흰색 바위까지 바짝 엎드려서 쭈욱 산맥이 이어지게 보아야 합니다.\"\n\n## 발견된 장소\n잔디밭 낙타바위 바로 옆 산수경석. \"좌청룡, 우백호 두 가지 봉우리가 딱 보였습니다. 이 바윗돌이 산수경석같이 생겼다. 하고 감격했습니다.\" (2021년 12월 26일 - 처음 발견하신 날)\n\n## 발견된 사연\n한국의 수석협회 회장들이 월명동에 돌이 많다는 소문을 듣고 구경하러 온 적이 있었습니다. 어떤 자들은 감탄하며 놀라움을 금치 못했고, 몇몇은 '산수경석이라도 한 점 있으면 다 갖췄네!' 할 것인데 산수경석이 한 점 없어 아쉽다. 했습니다. 이 말을 들은 선생님은 하나님의 전을 더욱 빛내려고 \"멋진 것 하나 주워 오자.\"하시며 성전 건축 예술가들과 산수경석을 찾으러 다녔습니다.\n영하 14도까지 떨어지는 추운 날 잔디성전을 지나 낙타바위 옆의 길을 올라갈 때쯤 우측으로 고개가 돌아가 쳐다보니, 바윗돌이 보였습니다.\n영산홍 꽃나무를 심어 놓은 바위였습니다.\n'저 돌, 위의 선이 올라갔다 내려왔다 하는 모양이 산수경석 같다.'하고 혼자 중얼거리며 돌에 올라가 보았습니다. 영산홍 꽃나무가 느티나무같이 커서 가리고 있어 옆으로 제치고 보니, 돌이 멋있었습니다.\n앞에 먼저 간 청년 5~6명을 부르며 모두 오라고 해서 돌 옆의 영산홍을 캐냈습니다.\n바윗돌 전체를 보니 정말 산수경석 대걸작이었습니다.\n너무 높이가 낮아서, 좌우 흙을 파내고 바위를 더 드러냈습니다.\n4~5일 동안 공사하여 잘 완성해 놓으니 정말 대걸작 산수경석이었습니다.\n과거 이 바윗돌은 선생님과 동네 사람들이 밟고 다니는 길바닥에 있었습니다.\n선생님은 지게를 지고 다닐 때 이 돌이 걸린다고 불평이 많았습니다.\n밟으면 미끄러지고, 지게 다리가 돌에 걸려서 짐을 지고 넘어지기도 했습니다.\n어느 때는 화가 나서 \"이놈의 돌, 쇠망치를 가져다 깨부수어 버리면 속 시원하겠다.\"\n했으나, 돌이 너무 커서 깰 수가 없었습니다. 60년 동안 속 썩이고, 걸리적거리고, 불편하게 한 바위, 이같이 천대받고 짓밟히던 돌이 뒤바뀌어 대걸작이 되었습니다.\n하나님은 이미 아시고 다 갖추어 놓았습니다. 찾아낼 수 없는 시대에는 전혀 생각을 할 수가 없었던 것인데, 때가 되어야 뒤바뀝니다. 하나님의 때가 되면 하나님이 창조한 돌도, 나무도, 환경도, 사람도 모두가 빛을 발하게 됩니다.\n\n\"하나님은 때가 와야 숨긴 것들이 드러나게 하십니다. 사람도 그러합니다. 자기도, 다른 존재물도 때가 되면 귀하게 보화같이 됩니다.\"\n"}, {"num": "5", "title": "성령길", "meta": null, "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAE5AhQDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABAUDBgECBwAI/8QATBAAAgEDAwIEAwUFBAYHBwUAAQIDAAQRBRIhMUEGEyJRBxRhIzJCcYEVkaHB0VJisbIXJDOCkqIWJTVTcuHwCBgmQ2Nkk1RVc3Tx/8QAGgEAAwEBAQEAAAAAAAAAAAAAAQIDBAAFBv/EACURAAICAgIDAQEAAwEBAAAAAAABAhEDIRIxBBNBUSIUMmFxI//aAAwDAQACEQMRAD8A7f4r8UQeE9IW/uLd50Mgj2oRnnvz+VUn/TvpWQDpV2M//UWmfxiGfBKkc4nXj99fPbAMctkN24qsIp9iHc2+OOlKoYaXdnPtIK83xv0sICNJuz/vrXEflJhbibqp6DP8a3jiujt2oTzVOCCdvi+NelSoXGlXQA77hUkfxo0mWPcunXPX+0K5E8AWyHmej3A71DCu5/LRdqkUHBHHYx8Z9NIJTTbogHH3xWn+mnT8nOkXY+vmrXIIl+Wk8ssWB96IKxqMscA0nFDUdXPxq0wDP7Lu/wD8grK/GjTnOBpV3n/xiuQlEZsA4qMyeS45B/WuUUCjsJ+NWmq5DaXdcf3xUcvxz0qJtv7Kuj/vLXG7xlDFw2cil0kqkgk9KbgmI5UduPx60gOV/ZF2P99f61JL8eNHithL+zLps8Y3rXz9dSqrYP58UHLdGQYXIX2pvWiEs9dH0J/7wekf/s95/wDkWopP/aK0dOui3p/31rgEaSOMqKHeKVrnaB1+tDhEk88j6HH/ALRWkEc6JeD/AH1r3/vF6OB/2Lef8a1wCeIw+knmvWke8sSC23t+dBxRyyzZ3n/3kdGL7P2He/8AGtFRf+0Bo8pwuj3gx/fSvn6SGK2BOz1YwaxbZUg7vvHgUOKoZZJfT6Oj+OGnSKCui3hHTO9KZaZ8VbTUgWXSrqGMfiZ1xXFtGsbm4hSMKJEbn8qe64G0vRUghco7dAOw71N0i0ZOR0q9+LenWkrINOuJtg5ZWGKVH466WCpOk3fPfev9a5E16ZNP8lGI253H3BpbEm+co3fv2FLaKNv4dvl+PekxttGkXjfky/1rQfH3SScDSLzP/jWuTWXhua6mVIi7eYeGxwfy96uA8LaBpdtH8wPmLpfUyIc4P1Pb8qeMbJPI09lytvjbaXsmy30C+kP/AI1p7YfENLtd8uk3Fog/FK4ArnMt7NZ2Hm2unpbQ9NwXLH9e9K4vE2lCU3GpNcTvG65RQOR35z2qnBCe2Xw69P8AESxSQLBaz3BPePp/5040nXJdVQSCxkt4mGQzuOR7gVwm/wDifDFpt1a6TpaRSONqzscsoPf86Q2fxG1+0jjWO5wEXYCwycZpeK+BWSX0+n73VrOwtvOuLlFjzgY5J/dVe8SfECy8OxRMLSW780btsZAI/PNfPEfiK/jmiuZbqWUqfSpJIBz7U51zxGdUso2jkbeMebnjPFSlaZdTtbOir8d9JaUI2kXi57s6/wBaOb40aWigjTrhge+8V893DEkYYEdOvejLGaSINBPGTvHp+lGkLDJbo7hJ8cdKVmxpl0+OPTIKHk+POmQoHk0S  되었고, 매우 아름다운 길로 완성되었습니다. 이는 하늘나라 성전의 구조(네모 반듯한 성에 문성이 3개씩 동서남북으로 12개의 문이 있음)를 본뜬 것이며, 자연성전에는 상징적으로 하나씩 동쪽·서쪽·남쪽·북쪽으로 길을 열었습니다."}, {"type": "li", "text": "-동쪽길: 삼거리로 올라가는 길"}, {"type": "li", "text": "-남쪽길: 오리쪽으로 내려어는 길, 호남지역으로 연결"}, {"type": "li", "text": "-북쪽길: 진산에서 앞섭"}, {"type": "li", "text": "-서쪽길: 논산, 부여, 공주 등 전국으로 통하는 길"}, {"type": "li", "text": "3. 불편한 기존 길을 대신할 새로운 길이 필요했기 때문에"}, {"type": "p", "text": "기존 석막리길은 너무 돌아가는 길이라 성령님과 상의 끝에 새로운 지름길, 즉 '성령길'을 만들게 되었고, 이는 '축지길', '순간이동길'로도 불립니다."}, {"type": "quote", "text": "\"더 좋게 차원 높여 연구하며 관리하기입니다. 관리하면, 돌이 금덩이 가치가 나가게 만듭니다.\""}], "search": "성령길  \n성령길은 대둔산부터 시작하여 감란산 산줄기가 그대로 보여지는 월명동 최고의 명소 중 한군데입니다.\n\n## 성령의 인도하심으로 만든 천년의 길\n처음엔 험하고 좁은 길이었지만, 선생님은 이곳을 써야겠다는 감동을 받으시고 먼저는 자갈을 깔아 길을 평탄하게 만드셨습니다. 비가오기만 하면 자갈길이 망가져서 선생님께서는 새벽이든 밤이든 매번 직접 괭이를 들고 물길을 내며 손수 작업하셨습니다.\n\n길 측량할때는 비행기에서 각도를 찍어내야 하는데 땅에서는 알 수가 없어 고민하던 중, 성령님께서 개울가로 인도하셨고, \"수석을 찾아보자, 의미있는 돌을 찾아보자\" 할때에 <거북이 돌>을 찾게 해주셨습니다. 성령님께서는 \"거북이 돌을 찾은 위치에서 그대로 반듯하게 45도 각도로 쭉 내라.\" 하셨습니다. \"산쪽방향으로 깊숙이 올라가서 방향을 틀면 길이 완해지고 평탄해진다\" 말씀해주셨습니다.\n\n거북이의 상징을 깨우쳐 주시며 빠르지 않더라도 천천히, 아름답고 편안한 길을 만들라는 감동을 주셨습니다. 거북이는 천 년을 상징합니다. 1000년 길입니다. 1000년 서쪽길입니다.\n\n이 길은 1년에 걸친 수고 끝에 완성되었습니다. 숨이 찰 정도로 가파르던 길이 평탄하고 넓은 길이 되었고, S자 곡선이 6개나 자연스럽게 형성된 아름답고 사용하기 좋은 길이 되었습니다. 길 끝에는 여름이면 함께 즐길 수 있는 계곡 수영장도 마련되어 있습니다.\n\n처음부터 끝까지 모든 과정은 성령님께서 감동을 주시고 답을 주시고 만들게 해주셨기에 <성령길>이라고 이름을 붙였습니다.\n\n## 성령길을 만들게 된 세 가지 이유\n1. 선생님의 20년 기도의 발자취를 기념하기 위해\n선생님이 20년간 대둔산까지 기도하러 다니신 길로, 성령님께서 \"네가 기도하던 길을 기념하기 위하여 아름답게 만들었다. 그래서 이 길을 닦은것이다.\"고 말씀하셨습니다.\n\n2. 자연성전에 상징적으로 동서남북 네 방향의 길이 필요했으나 그중 서쪽길이 없었습니다.\n서쪽은 성령을 상징하는 저녁노을이 비치는 방향이기에, 이 길에 '성령길'이라는 이름이 붙게 되었고, 매우 아름다운 길로 완성되었습니다.\n이는 하늘나라 성전의 구조(네모 반듯한 성에 문성이 3개씩 동서남북으로 12개의 문이 있음)를 본뜬 것이며, 자연성전에는 상징적으로 하나씩 동쪽·서쪽·남쪽·북쪽으로 길을 열었습니다.\n-동쪽길: 삼거리로 올라가는 길\n-남쪽길: 오리쪽으로 내려어는 길, 호남지역으로 연결\n-북쪽길: 진산에서 앞섭\n-서쪽길: 논산, 부여, 공주 등 전국으로 통하는 길\n\n3. 불편한 기존 길을 대신할 새로운 길이 필요했기 때문에\n기존 석막리길은 너무 돌아가는 길이라 성령님과 상의 끝에 새로운 지름길, 즉 '성령길'을 만들게 되었고, 이는 '축지길', '순간이동길'로도 불립니다.\n\n\"더 좋게 차원 높여 연구하며 관리하기입니다. 관리하면, 돌이 금덩이 가치가 나가게 만듭니다.\"\n"}, {"num": "6", "title": "기도표적 솔", "meta": null, "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCABYAhQDASIAAhEBAxEB/8QAHAAAAgMAAwEAAAAAAAAAAAAAAAcBBQYCBAgD/8QATBAAAQMDAgQDBAcEBwQJBQEAAQIDBAAFEQYhBxIxQRNRYRQicaEVIzJCgZHRFlKx4RckM1NicsFDY6LSJTQ2c4OSstPwCCdERZOj/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAIREAAgICAgIDAQAAAAAAAAAAAAECEQMSITEEFBMiUUH/2gAMAwEAAhEDEQA/APRVFFFQwSnrQT7xoT1o7miKBHkN66s+4x7dFVIluBtpPVZ6DfG/412knfr3xVPqFpD1v8NYCkKOCD33zv8AjWMk9VYfRRf0waCB/wC0sLb/ABH9KtUa506/d0Wxq5NrlrRzpaAOSN9+noaS3FbTditWiZD0OIhl9RSGykk5IKSem3nXzt7KmeMURpYPMmEgEH/xK8/z3G0S6Q5rrxF0rY3Qxc7zHiOK3CXSQe3610U8YNAk/wDaWF/5qWeqZGn4vEUHULzbUcxzy+LkDO36Cuf0nwpKtpkLHfBUcUWZ1dWNhwSda2GHZVXV64ITBTuXsHlxnH8a7ke/W6Qyl1t/nbUDg4P6Un+IUi2v8JpjcSUy3HkcqWCVBKVYcBIyTj7qqX8HitfYMFqMly3lLed/bGh/pWY5JyjaGx6k+mIROzufgCaPpiF/fD8jSP4f8QJ2o7y5DnuxebkKkpbebcJ6fuj1pjyGy7FcbSrkUtBTnPTIxmuM/InGVMOR95nFfRUCcuHK1BFakMqKFoJPukHcHau6vX2m0ew5ubX/AEgQIxGcOZOBjbzrz1J1Ba7OL5ZrhZ2pE5x6QlL6n91kqXyqzykJ6jYqri1JiuSNDwm5TLr7EpsraQ4F+EC/kA4O+AQPwr0vJKrRdj0jc9W2WzQjKuE5uLHGxccOEn4E/CunbuIWl7tGkSIF4jyWo6C44WznkSB1pTa7jm7cS7FaH1ExCgSFJG3NyuAb49CRXVudpjae1hcUQkeCzKsz6VIBJGQDg9fX5VFldck2HRH1zp6Xa3bkzcmlQ2SpK3twElIyeoqrPF/QYKU/tNBKh25j+lKDTuU8Fr5296USeu/h+tW/D3Sdkn6OhypUFDj6kjKznJPKk5/OsLPSuRdhtNa+05IuLMFq5NrkvtB5tABypBGQenlVmLvDJGHvkaQNzeYtHHG1x0Mr8MRm2UJSkkJ2UkdB0APT0psIUeUHGU4yN+1csnkTj/DOxp/piEASXhj/ACmsyeL+gUkhWpYQwcH3jUE9UnJFL/XWl9O23R9wm+xNNLQEkLyevOkdvOrj8pvhobDQRxD0w4qGG7syv23m8DlyQ5jrjb0Nc7xrzTGnltpu12Yg+KCUeKSM/L1rzzbY70U6EZfQUuIU+FJPwcrT8RHrUzrzTS70ttuByu861Z5R7px09cV3eVpouwzP6YtA9tTQSD/j6VbI1xp52zm6t3JtcHGfHSCU4zjy86Tybpwrzj2uH+atqtdQSrI9wvlrtj8f6OUlIbczyoPvjPXbqDUnmldJDYakDVFpusJuZDkh6O6PdUkHfcjvv1FdsXiEejmfgCa8m6f4i3qwWWPbGHretpgEDMtnfJJ8iep862WkeJ8676iZiXF+Gll0hKeSQ2s8xUABhIz3+ "text": "뒷산에는 '하나님의 계단 길'과 '우리 계단 길'을 만들고 기도동산을 만들었습니다. 뒷산 '기도표적 소나무' 밑에서 선생이 10대 초반에 산(山)기도를 하기 시작했습니다. 그냥 기도동산이라 명명한 것이 아니라 기도한 사연의 장소이기에 '기도동산'이라 하는 것입니다. '기도표적 소나무'는 거기에다 하나님이 표상으로 키워 주셨습니다. 기도솔은 아랫집 고 목사들 산이었습니다. '기도 기념 솔'이 그때는 작았습니다. 주인이 베서 인삼 지주목으로 쓰려고 하는데 선생이 인삼밭 지주목 다른 소나무 3개 베다 줄 테니 이 소나무는 제발 나 달라고 하여 얻어서 키웠습니다. 하나님, 성령, 성자, 예수님이 아시고 그리 기도 조건을 세운 연고입니다. 행하여 만드는 것입니다. 뒷산을 사기 전, 이 같은 어려움이 지나고 또 다른 어려움이 있었습니다. 이 산에 크게 불이 나서 이 산의 소나무 전체가 모두 타 죽는 일이 있었습니다. (1994년 4월 뒷동산 논골에서 한 제자가 묵은 잡초들을 태우다가 불씨가 뒷동산에 붙어 다 타버림) 이 기도 표적 솔도 새까맣게 타서 베어 없애려 하는데 하나님께서 \"베지 말라.\"하시어 베지 않고 기도했습니다. 하나님, 하나라도 남겨야 하는데 어떡하나요. 내가 어렸을때 기도하던 소나무인데 이 기도 소나무를 꼭 살려달라고 했습니다. 기도하니 다음 해에 새순이 나고 살아났습니다. 다른 것들은 다 죽어서 베어버렸지만 이 기도솔은 나아서 이와같이 어마어마힌 수형좋은 몇억짜리 나무가 되었습니다. 하나님이 성령으로 감동을 주시며 \"베지 말고 기도하라.\"해서 기도하여 살아났습니다. 기적의 솔, 부활의 솔입니다. 이같이 환난에 신앙이 죽은 자도 기도해서 살아나게 관리해요."}, {"type": "p", "text": "발췌 : 240710 수요말씀 <은혜와 진리-속편> R-VLOG 기도의 능력, 기도표적소나무"}, {"type": "h", "text": "월명동의 돌, 나무, 지형 중에는"}, {"type": "p", "text": "하나님, 성령, 성자, 예수님의 뜻이 있는 존재물이 너무도 많습니다. '뜻이 있다.'는 것은, 특별히 마음이 가고 사연이 있어 나무를 기르고 키우고, 돌은 사 오게 되었다는 것입니다."}], "search": "기도표적 솔  \n기도는 일이다. 기도는 능력이다. 기도는 호흡이다.\n기도는 하나님과 대화다. 기도는 문이 열려지게 하는것이다.\n두드려라 열린다.\n\n뒷산에는 '하나님의 계단 길'과 '우리 계단 길'을 만들고 기도동산을 만들었습니다. 뒷산 '기도표적 소나무' 밑에서 선생이 10대 초반에 산(山)기도를 하기 시작했습니다. 그냥 기도동산이라 명명한 것이 아니라 기도한 사연의 장소이기에 '기도동산'이라 하는 것입니다. '기도표적 소나무'는 거기에다 하나님이 표상으로 키워 주셨습니다.\n기도솔은 아랫집 고 목사들 산이었습니다.\n'기도 기념 솔'이 그때는 작았습니다. 주인이 베서 인삼 지주목으로 쓰려고 하는데 선생이 인삼밭 지주목 다른 소나무 3개 베다 줄 테니 이 소나무는 제발 나 달라고 하여 얻어서 키웠습니다.\n하나님, 성령, 성자, 예수님이 아시고 그리 기도 조건을 세운 연고입니다. 행하여 만드는 것입니다. 뒷산을 사기 전, 이 같은 어려움이 지나고 또 다른 어려움이 있었습니다. 이 산에 크게 불이 나서 이 산의 소나무 전체가 모두 타 죽는 일이 있었습니다.\n(1994년 4월 뒷동산 논골에서 한 제자가 묵은 잡초들을 태우다가 불씨가 뒷동산에 붙어 다 타버림)\n이 기도 표적 솔도 새까맣게 타서 베어 없애려 하는데 하나님께서 \"베지 말라.\"하시어 베지 않고 기도했습니다.\n하나님, 하나라도 남겨야 하는데 어떡하나요. 내가 어렸을때 기도하던 소나무인데 이 기도 소나무를 꼭 살려달라고 했습니다.\n기도하니 다음 해에 새순이 나고 살아났습니다.\n다른 것들은 다 죽어서 베어버렸지만 이 기도솔은 나아서 이와같이 어마어마힌 수형좋은 몇억짜리 나무가 되었습니다.\n하나님이 성령으로 감동을 주시며 \"베지 말고 기도하라.\"…12152 tokens truncated…A , "text": "거기 수석관에 있는 모든 작품 중에 핵심 보물 작품은 이 <대둔산 수석>이었습니다. 결국은 대둔산 수석은 섭리 장로님을 통해 20년 전 가격으로 하나님 궁에 가져올 수 있게 되었습니다."}, {"type": "h", "text": "2) 대둔산 수석의 의미"}, {"type": "p", "text": "대둔산 수석은 대둔산의 형상입니다. 정말 놀라울 정도로 닮아있습니다. 정말 신비합니다. 규모는 5미터/3미터로 엄청 큰 수석입니다."}, {"type": "p", "text": "선생님께서 이 수석이 대둔산 수석의 물줄기가 어떻게 흘러갔는지, 그로 말미암아 수석이 어떤 모양으로 형성이 되었는지를 자세히 물으셨습니다. 이 대둔산 수석을 보면, 흐름의 방향이 실제 대둔산 기암절벽을 빼다 박았습니다."}, {"type": "p", "text": "대둔산을 가보면 실제 봉우리들이 엄청나게 많은데, 그 중에 눈에 띄는 암봉이 70개가 있습니다. 그래서 예전부터 선조들이 말할 때,"}, {"type": "quote", "text": "\"70봉 대둔산\""}, {"type": "p", "text": "이라고 불렀다고 합니다. 대둔산 수석을 보면 70여개의 봉우리를 갖추고 있습니다."}, {"type": "p", "text": "그리고 또 신기한 것은 선생님께서 대둔산에 수도 생활한 것이 21년이신데, 이 수석의 무게가 21톤입니다. 이 수석이 들어온 시점은 2026년 6월 알파절 전이었습니다."}, {"type": "p", "text": "그 의미에 대해 말씀하자면, 21년 밤낮 대둔산을 오르시면서 원자폭탄 같은 말씀을 받으시고, 1978.6.1. 복음을 전하시기 시작하셨는데 섭리역사 시작한 알파절을 기념해서 주신 대둔산 수석입니다."}], "search": "대둔산 수석 무게 : 21톤 · 규모 5m × 3m \n## 1) 대둔산 수석이 들어오게 된 사연\n선생님께서 월명동 계실 때 한 지역의 수석관을 방문한 때가 생각나서, 섭리수석가에게 말씀하시길,\n\n\"그 지역의 수석관 3층에 가면 이러한 수석이 있을 것이다. 찾아보라.\"\n\n고 하셨고, 그 수석관에 직접 가보니, 수석관장은 죽고 그 부인이 운영하고 있었습니다.\n\n그리고 수석관장은 우리 회원인 장로님과 지인 사이였기에, 수석관장이 죽기 전에 아내에게 말하길, 우리 회원인 장로님에게 판매 권한을 위임하라고 했던 것입니다. 그래서 장로님은 수석관 전체의 단독 판매권한을 갖고 있었습니다.\n\n거기 수석관에 있는 모든 작품 중에 핵심 보물 작품은 이 <대둔산 수석>이었습니다. 결국은 대둔산 수석은 섭리 장로님을 통해 20년 전 가격으로 하나님 궁에 가져올 수 있게 되었습니다.\n\n## 2) 대둔산 수석의 의미\n대둔산 수석은 대둔산의 형상입니다. 정말 놀라울 정도로 닮아있습니다. 정말 신비합니다. 규모는 5미터/3미터로 엄청 큰 수석입니다.\n\n선생님께서 이 수석이 대둔산 수석의 물줄기가 어떻게 흘러갔는지, 그로 말미암아 수석이 어떤 모양으로 형성이 되었는지를 자세히 물으셨습니다. 이 대둔산 수석을 보면, 흐름의 방향이 실제 대둔산 기암절벽을 빼다 박았습니다.\n\n대둔산을 가보면 실제 봉우리들이 엄청나게 많은데, 그 중에 눈에 띄는 암봉이 70개가 있습니다. 그래서 예전부터 선조들이 말할 때,\n\n\"70봉 대둔산\"\n\n이라고 불렀다고 합니다. 대둔산 수석을 보면 70여개의 봉우리를 갖추고 있습니다.\n\n그리고 또 신기한 것은 선생님께서 대둔산에 수도 생활한 것이 21년이신데, 이 수석의 무게가 21톤입니다. 이 수석이 들어온 시점은 2026년 6월 알파절 전이었습니다.\n\n그 의미에 대해 말씀하자면, 21년 밤낮 대둔산을 오르시면서 원자폭탄 같은 말씀을 받으시고, 1978.6.1. 복음을 전하시기 시작하셨는데 섭리역사 시작한 알파절을 기념해서 주신 대둔산 수석입니다.\n"}, {"num": "46", "title": "성자길", "meta": null, "images": [], "sections": [{"type": "h", "text": "1) 성자길 전설"}, {"type": "p", "text": "<성자길>은 원래 압석골 골짜기였습니다. 이 골짜기에는 전설이 있습니다. 빨래줄에 빨래가 가득히 걸린 것 같이, 남녀들이 이 길에 꽉 차서 오고가는 때가 오면, 이상세계가 오고, 살기 좋은 세상이 온다는 전설입니다."}, {"type": "p", "text": "그런데 오히려 전설의 내용과는 반대로 인구가 줄면서 고갯길로 다니는 사람들은 점점 없어지고 손바닥같은 소롯길을 잡초와 가시덤불로 덮여 짐승들도 발길을 끊었습니다. 시대가 변했다 하며 전설의 희망을 기다리던 사람들도 더러는 죽어서 세상을 떠나가고, 전설만 가을 하늘에 흰구름같이 따라다녔습니다."}, {"type": "p", "text": "그런데, 때가 되어 월명동에 전설같은 자가 태어났습니다. 그리고, 수십 년 후에, 그가 하나님의 궁을 짓고 사람들이 구름같이 모여들어 해마다 압석골 골짜기를 오고 갔습니다."}, {"type": "p", "text": "그 후에 수십 년이 지나서는, 이같이 길을 닦고 온 민족과 세계 80여개 나라에서, 인구름들이 쉬지 않고 더욱 오고 갑니다. 이렇게 이상세계가 되고, 무려 70년 만에 전설이 이루어졌습니다."}, {"type": "h", "text": "2) 성자길의 의미"}, {"type": "p", "text": "성자길은 월명동의 험난한 지형을 극복하고 하나님과 시대 사명자가 함께 닦아 만든 길로, 그 사연과 의미가 매우 깊습니다."}, {"type": "p", "text": "성자길은 과거 험한 산길이었으나, 하나님과 시대 사명자가 뜻을 두고 닦아 수많은 이들이 다닐 수 있게 된 길입니다."}, {"type": "p", "text": "선생이 학교 다니던 성황당 돌짝밭 길과 소로 길, 압석골 길이 이제 수많은 자들이 함께 다녀도 될 정도로 닦였습니다. 휴거되었습니다. 이는 〈성자길〉이라고 이름합니다."}, {"type": "quote", "text": "\"<성자길>은 산이 높고 길이 험해 선생이 지금으로부터 70년 전부터 '내가 닦아야지.' 하면서 계획한 길입니다.\""}, {"type": "h", "text": "3) 성자길을 대하는 자세"}, {"type": "p", "text": "성자길을 다닐 때는 그 길을 닦기 위해 애쓴 사연과 하나님의 섭리를 깨닫고 감사하는 마음을 가져야 합니다."}, {"type": "p", "text": "월명동의 길은 다 선생이 닦고, 사명자들이 닦고, 여러분들도 같이 닦았기에 길이 되었습니다. 기뻐 감사하면서 다녀야 합니다."}, {"type": "p", "text": "성자길을 닦은 과정은 옛 신앙을 부수고 새 시대의 신앙을 세우는 것과 같습니다."}, {"type": "quote", "text": "\"<성자길>을 가서 보세요. 옛 소로 길을 모두 부수고 새 길을 닦으니 편히 다닙니다. 신앙도 옛것은 부수고 새롭게 해야 합니다.\""}], "search": "성자길 \n## 1) 성자길 전설\n<성자길>은 원래 압석골 골짜기였습니다. 이 골짜기에는 전설이 있습니다. 빨래줄에 빨래가 가득히 걸린 것 같이, 남녀들이 이 길에 꽉 차서 오고가는 때가 오면, 이상세계가 오고, 살기 좋은 세상이 온다는 전설입니다.\n\n그런데 오히려 전설의 내용과는 반대로 인구가 줄면서 고갯길로 다니는 사람들은 점점 없어지고 손바닥같은 소롯길을 잡초와 가시덤불로 덮여 짐승들도 발길을 끊었습니다. 시대가 변했다 하며 전설의 희망을 기다리던 사람들도 더러는 죽어서 세상을 떠나가고, 전설만 가을 하늘에 흰구름같이 따라다녔습니다.\n\n그런데, 때가 되어 월명동에 전설같은 자가 태어났습니다. 그리고, 수십 년 후에, 그가 하나님의 궁을 짓고 사람들이 구름같이 모여들어 해마다 압석골 골짜기를 오고 갔습니다.\n\n그 후에 수십 년이 지나서는, 이같이 길을 닦고 온 민족과 세계 80여개 나라에서, 인구름들이 쉬지 않고 더욱 오고 갑니다. 이렇게 이상세계가 되고, 무려 70년 만에 전설이 이루어졌습니다.\n\n## 2) 성자길의 의미\n성자길은 월명동의 험난한 지형을 극복하고 하나님과 시대 사명자가 함께 닦아 만든 길로, 그 사연과 의미가 매우 깊습니다.\n\n성자길은 과거 험한 산길이었으나, 하나님과 시대 사명자가 뜻을 두고 닦아 수많은 이들이 다닐 수 있게 된 길입니다.\n\n선생이 학교 다니던 성황당 돌짝밭 길과 소로 길, 압석골 길이 이제 수많은 자들이 함께 다녀도 될 정도로 닦였습니다. 휴거되었습니다. 이는 〈성자길〉이라고 이름합니다.\n\n\"<성자길>은 산이 높고 길이 험해 선생이 지금으로부터 70년 전부터 '내가 닦아야지.' 하면서 계획한 길입니다.\"\n\n## 3) 성자길을 대하는 자세\n성자길을 다닐 때는 그 길을 닦기 위해 애쓴 사연과 하나님의 섭리를 깨닫고 감사하는 마음을 가져야 합니다.\n\n월명동의 길은 다 선생이 닦고, 사명자들이 닦고, 여러분들도 같이 닦았기에 길이 되었습니다. 기뻐 감사하면서 다녀야 합니다.\n\n성자길을 닦은 과정은 옛 신앙을 부수고 새 시대의 신앙을 세우는 것과 같습니다.\n\n\"<성자길>을 가서 보세요. 옛 소로 길을 모두 부수고 새 길을 닦으니 편히 다닙니다. 신앙도 옛것은 부수고 새롭게 해야 합니다.\"\n"}];

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== 하이라이트 (문단 드래그로 칠하기, 3색, 항목별로 이 브라우저에만 저장) =====
function hlKey(itemNum){ return 'wmdHl_' + itemNum; }
function getHighlights(itemNum){
  try{ return JSON.parse(localStorage.getItem(hlKey(itemNum)) || '[]'); }catch(e){ return []; }
}
function setHighlights(itemNum, list){
  try{ localStorage.setItem(hlKey(itemNum), JSON.stringify(list)); }catch(e){}
}

function sectionHtmlWithHighlights(text, hls){
  if(!hls.length) return escapeHtml(text);
  const sorted = hls.slice().sort((a,b) => a.start - b.start);
  let out = '', pos = 0;
  for(const h of sorted){
    if(h.start < pos) continue; // 겹치는 항목은 이미 처리된 것으로 보고 건너뛴다
    out += escapeHtml(text.slice(pos, h.start));
    out += `<mark class="hl hl-${h.color}" data-si="${h.si}" data-start="${h.start}" data-end="${h.end}">${escapeHtml(text.slice(h.start, h.end))}</mark>`;
    pos = h.end;
  }
  out += escapeHtml(text.slice(pos));
  return out;
}

function renderSections(sections, itemNum){
  const hls = getHighlights(itemNum);
  let html = '';
  sections.forEach((s, si) => {
    const mine = hls.filter(h => h.si === si);
    const inner = sectionHtmlWithHighlights(s.text, mine);
    if(s.type === 'h') html += `<h3 data-si="${si}">${inner}</h3>`;
    else if(s.type === 'quote') html += `<blockquote data-si="${si}">${inner}</blockquote>`;
    else if(s.type === 'li') html += `<p class="li" data-si="${si}">${inner}</p>`;
    else html += `<p data-si="${si}">${inner}</p>`;
  });
  return html;
}

function paintSections(){
  const it = DATA[current];
  const prose = els.card.querySelector('.prose');
  if(prose) prose.innerHTML = renderSections(it.sections, it.num);
}

function renderGallery(images){
  if(!images.length) return '';
  const cls = images.length === 1 ? 'gallery single' : 'gallery';
  return `<div class="${cls}">` + images.map(src =>
    `<figure><img src="${src}" alt="" loading="lazy"></figure>`
  ).join('') + `</div>`;
}

  els.prevLabel.textContent = index > 0 ? `${DATA[index-1].num}. ${DATA[index-1].title}` : '';
  els.nextLabel.textContent = index < DATA.length - 1 ? `${DATA[index+1].num}. ${DATA[index+1].title}` : '';
  els.card.scrollIntoView({block:'start', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  closeDrawer();
  closeSettings();
  applyFind();
}


/* ===== 홈 화면에 추가 =====
   안드로이드 크롬은 설치할 수 있을 때 beforeinstallprompt 를 보내 준다.
   그때만 상단에 단추를 띄우고, 설치했거나 한 번 닫으면 다시 띄우지 않는다.
   (아이폰은 이 신호가 없어서 install.html 안내로 대신한다) */
(function () {
  var deferred = null;
  var btn = document.getElementById('installBtn');
  if (!btn) return;

  function hidden() {
    try {
      return localStorage.getItem("installHidden") === "1" ||
        localStorage.getItem("sayeon_app_installed") === "1";
    } catch (e) { return false; }
  }
  function rememberInstalled() {
    try {
      localStorage.setItem("installHidden", "1");
      localStorage.setItem("sayeon_app_installed", "1");
    } catch (e) {}
  }
  function runningAsApp() {
    var modes = ["standalone", "fullscreen", "minimal-ui", "window-controls-overlay"];
    if (window.matchMedia) {
      for (var i = 0; i < modes.length; i++) {
        if (window.matchMedia("(display-mode: " + modes[i] + ")").matches) return true;
      }
    }
    return window.navigator.standalone === true ||
      document.referrer.indexOf("android-app://") === 0;
  }

  if (runningAsApp()) rememberInstalled();
  if (runningAsApp() || hidden()) {
    btn.style.display = "none";
    return;
  }

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    if (!hidden()) btn.style.display = "inline-flex";
  });

  btn.onclick = function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () {
      deferred = null;
      btn.style.display = "none";
      rememberInstalled();
    });
  };

  window.addEventListener("appinstalled", function () {
    btn.style.display = "none";
    rememberInstalled();
  });
})();

// 읽어주기 (Web Speech API)
// 기본은 구글 한국어 목소리(안드로이드의 '구글 여성1(시스템)')를 고른다.
// 기기마다 쓸 수 있는 목소리가 달라 설정에서 직접 고를 수도 있다.
/* ===== 설정 저장 =====
   글자·색·속도·목소리 같은 설정은 세 페이지(성령사연·월명동·말씀)가
   한 곳에 모아 같이 쓴다. 같은 주소라 브라우저 저장소를 공유한다.
   한 곳에서 바꾸면 나머지 두 곳에도 그대로 적용된다. */
const SETTINGS_KEY = 'siteSettings';
function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }catch(e){ return {}; }
}
function saveSettings(patch){
  const s = loadSettings();
  Object.assign(s, patch);
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){}
}

// 기본은 구글 한국어 목소리(안드로이드의 '구글 여자1')를 고른다.
let koVoice = null;
let voiceName = loadSettings().voice || null;

// 'kok'(코카니어) 처럼 ko 로 시작만 하는 다른 언어가 섞이지 않게 정확히 걸러낸다
function isKorean(v){
  if(!v || !v.lang) return false;
  const l = v.lang.toLowerCase().replace('_','-');
  return l === 'ko' || l.startsWith('ko-');
}

function koVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(isKorean);
}

function isGoogle(v){ return /google|구글/i.test(v.name) || /^ko-kr-x-/i.test(v.voiceURI || ''); }

// 구글 목소리 코드 -> 안드로이드 설정에 보이는 이름
const GOOGLE_LABEL = [
  [/x-ism|standard-a|wavenet-a/i, '구글 여자1'],
  [/x-kob|standard-b|wavenet-b/i, '구글 여자2'],
  [/x-kod|standard-c|wavenet-c/i, '구글 남자1'],
  [/x-koc|x-kof|standard-d|wavenet-d/i, '구글 남자2']
];

function voiceLabel(v, googleIndex){
  if(!isGoogle(v)) return v.name;
  const key = (v.voiceURI || '') + ' ' + v.name;
  for(const [re, label] of GOOGLE_LABEL){ if(re.test(key)) return label; }
  return googleIndex > 0 ? '구글 목소리 ' + (googleIndex + 1) : '구글 목소리';
}

function voiceId(v){ return v.voiceURI || v.name; }

function pickVoice(){
  const vs = koVoices();
  if(!vs.length){ koVoice = null; return; }
  koVoice = (voiceName && vs.find(v => voiceId(v) === voiceName))
    || vs.find(isGoogle)
    || vs[0];
}

function buildVoiceOpts(){
  const box = document.getElementById('voiceOpts');
  if(!box) return;
  const vs = koVoices();
  box.innerHTML = '';
  if(!vs.length){
    box.textContent = '이 기기에서 쓸 수 있는 한국어 목소리가 없습니다.';
    return;
  }
  let gi = 0;
  for(const v of vs){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (koVoice && voiceId(v) === voiceId(koVoice) ? ' sel' : '');
    b.textContent = voiceLabel(v, isGoogle(v) ? gi++ : -1);
    b.addEventListener('click', () => {
      voiceName = voiceId(v);
      saveSettings({ voice: voiceName });
      pickVoice();
      buildVoiceOpts();
      previewVoice();
    });
    box.appendChild(b);
  }
  if(vs.length === 1){
    const note = document.createElement('div');
    note.style.cssText = 'font-size:.78rem; line-height:1.7; color:var(--muted); flex-basis:100%; margin-top:4px;';
    note.textContent = '이 기기에서는 브라우저가 목소리를 하나만 알려 줍니다. 안드로이드 설정 → 접근성 → 음성 출력(TTS) → 기본 엔진 설정에서 목소리를 바꾸면 여기에도 적용됩니다.';
    box.appendChild(note);
  }
}

// 고른 목소리를 바로 짧게 들려준다
function previewVoice(){
  if(!('speechSynthesis' in window) || isReading) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('안녕하세요. 이 목소리로 읽어 드립니다.');
    u.lang = 'ko-KR';
    if(koVoice) u.voice = koVoice;
    u.rate = readRate;
    speechSynthesis.speak(u);
  }catch(e){}
}

if('speechSynthesis' in window){
  pickVoice();
  buildVoiceOpts();
  speechSynthesis.onvoiceschanged = () => { pickVoice(); buildVoiceOpts(); };
  // 안드로이드에서는 목록이 늦게 채워지고 onvoiceschanged 가 안 오는 기기도 있어 몇 번 더 확인한다
  [400, 1200, 3000].forEach(ms => setTimeout(() => { pickVoice(); buildVoiceOpts(); }, ms));
}

// 듣는 동안 화면이 꺼지지 않게 한다.
// 화면 잠금은 탭이 보일 때만 걸 수 있고 화면이 꺼지면 저절로 풀리므로,
// 다시 보이게 될 때 듣는 중이면 새로 건다.
let wakeLock = null;
function requestWakeLock(){
  if(!('wakeLock' in navigator) || wakeLock) return;
  try{
    navigator.wakeLock.request('screen').then(wl => {
      wakeLock = wl;
      wl.addEventListener('release', () => { wakeLock = null; });
    }).catch(()=>{});
  }catch(e){}
}
function releaseWakeLock(){
  if(!wakeLock) return;
  try{ wakeLock.release(); }catch(e){}
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && isReading) requestWakeLock();
});

function buildReadText(it){
  const parts = [`${it.num}번, ${it.title}.`];
  if(it.meta) parts.push(it.meta + '.');
  for(const s of it.sections){
    parts.push(s.type === 'h' ? (s.text + '.') : s.text);
  }
  return parts.join(' ');
}

// 모바일 크롬 등에서 발화가 15초 안팎으로 끊기는 고질적 버그가 있어
// 긴 글을 문장 단위로 잘라 순서대로 이어 읽는다.
function chunkText(text, maxLen){
  const sentences = text.split(/(?<=[.!?])\s+/);
  const chunks = [];
  let cur = '';
  function flush(){ if(cur.trim()){ chunks.push(cur.trim()); cur = ''; } }
  for(let s of sentences){
    // 문장 하나가 이미 너무 길면 공백 기준으로 강제로 더 잘게 나눈다
    while(s.length > maxLen){
      let cut = s.lastIndexOf(' ', maxLen);
      if(cut < maxLen * 0.5) cut = maxLen;
      flush();
      chunks.push(s.slice(0, cut).trim());
      s = s.slice(cut).trim();
    }
    if(cur && (cur.length + s.length + 1) > maxLen){
      flush();
      cur = s;
    } else {
      cur = cur ? cur + ' ' + s : s;
    }
  }
  flush();
  return chunks;
}

function updateReadBtn(speaking){
  const btn = document.getElementById('readBtn');
  const label = document.getElementById('readBtnLabel');
  if(!btn || !label) return;
  const human = !!RECORDED_AUDIO[String(DATA[current].num)];
  btn.classList.toggle('speaking', speaking);
  btn.setAttribute('aria-pressed', String(speaking));
  label.textContent = speaking ? '정지' : (human ? '녹음 듣기' : '듣기');
}

// ===== 재생 위치 막대 (듣는 중 어디서든 이어 시작) =====
let seekDragging = false;
function showSeek(){
  const el = document.getElementById('seekWrap');
  if(el) el.classList.add('show');
}
function hideSeek(){
  const el = document.getElementById('seekWrap');
  if(el) el.classList.remove('show');
}
function updateSeekUI(){
  if(seekDragging) return;
  const range = document.getElementById('seekRange');
  const timeEl = document.getElementById('seekTime');
  if(!range || !timeEl) return;
  const path = RECORDED_AUDIO[String(DATA[current].num)];
  if(path && isFinite(recordedPlayer.duration) && recordedPlayer.duration > 0){
    range.value = Math.round((recordedPlayer.currentTime / recordedPlayer.duration) * 1000);
    timeEl.textContent = formatAudioTime(recordedPlayer.currentTime) + ' / ' + formatAudioTime(recordedPlayer.duration);
    return;
  }
  const total = readQueue.length || 1;
  range.value = Math.round((readQueueIndex / total) * 1000);
  timeEl.textContent = (readQueueIndex + 1) + ' / ' + total;
}
function formatAudioTime(seconds){
  seconds = isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
  const minutes = Math.floor(seconds / 60);
  seconds %= 60;
  return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
}
els.card.addEventListener('input', e => {
  if(e.target && e.target.id === 'seekRange') seekDragging = true;
});
els.card.addEventListener('change', e => {
  if(!e.target || e.target.id !== 'seekRange') return;
  seekDragging = false;
  const path = RECORDED_AUDIO[String(DATA[current].num)];
  if(path && isFinite(recordedPlayer.duration) && recordedPlayer.duration > 0){
    recordedPlayer.currentTime = (Number(e.target.value) / 1000) * recordedPlayer.duration;
    return;
  }
  const total = readQueue.length;
  if(total <= 0) return;
  const frac = Number(e.target.value) / 1000;
  const target = Math.min(total - 1, Math.floor(frac * total));
  readQueueIndex = target;
  readSession++;
  const session = readSession;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  isReading = true;
  updateReadBtn(true);
  speakNextChunk(session);
});

// ===== 잠금화면/미디어 컨트롤에 재생 정보를 알려 백그라운드 재생을 돕는다 =====
function updateMediaSession(playing){
  if(!('mediaSession' in navigator)) return;
  try{
    const it = DATA[current];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: (it.num + '. ' + it.title),
      artist: '월명동 자연성전 돌·나무 이야기',
    });
    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
    navigator.mediaSession.setActionHandler('play', () => { if(!isReading) toggleReading(); });
    navigator.mediaSession.setActionHandler('pause', () => { if(isReading) toggleReading(); });
    navigator.mediaSession.setActionHandler('previoustrack', () => {
      if(current > 0){ const wasReading = isReading; render(current - 1); if(wasReading) beginReadCurrent(); }
    });
    navigator.mediaSession.setActionHandler('nexttrack', () => {
      if(current < DATA.length - 1){ const wasReading = isReading; render(current + 1); if(wasReading) beginReadCurrent(); }
    });
  }catch(e){}
}

let readQueue = [];
let readQueueIndex = 0;
// speechSynthesis.cancel() 은 읽던 발화의 onend/onerror 를 뒤늦게 부른다.
// 그 콜백이 다음 항목을 이어 읽어 버리면 정지가 먹히지 않으므로,
// 재생을 시작하거나 멈출 때마다 세션 번호를 올려 옛 콜백을 무시한다.
let readSession = 0;
let isReading = false;
const recordedPlayer = new Audio();
recordedPlayer.preload = 'metadata';
let recordedSync = {};
let recordedSection = -1;
fetch('audio/sync.json?v=' + Date.now())
  .then(response => response.ok ? response.json() : {})
  .then(data => { recordedSync = data || {}; })
  .catch(() => {});

function updateRecordedHighlight(){
  const times = recordedSync[String(DATA[current].num)];
  if(!times) return;
  let section = -1;
  for(let i = 0; i < times.length; i++){
    if(recordedPlayer.currentTime + 0.15 >= times[i]) section = i;
    else break;
  }
  if(section === recordedSection) return;
  recordedSection = section;
  const nodes = els.card.querySelectorAll('.prose [data-si]');
  nodes.forEach(node => node.classList.toggle('reading', Number(node.dataset.si) === section));
  if(section >= 0 && nodes[section]){
    try{ nodes[section].scrollIntoView({behavior:'smooth', block:'center'}); }
    catch(e){ nodes[section].scrollIntoView(); }
  }
}
recordedPlayer.addEventListener('timeupdate', updateSeekUI);
recordedPlayer.addEventListener('timeupdate', updateRecordedHighlight);
recordedPlayer.addEventListener('loadedmetadata', updateSeekUI);
recordedPlayer.addEventListener('ended', () => {
  if(!isReading) return;
  if(readAutoMode === 'next' && current < DATA.length - 1){
    render(current + 1);
    setTimeout(beginReadCurrent, 1000);
  }else if(readAutoMode === 'prev' && current > 0){
    render(current - 1);
    setTimeout(beginReadCurrent, 1000);
  }else{
    stopReading();
  }
});
recordedPlayer.addEventListener('error', () => { if(isReading) stopReading(); });

function stopReading(){
  readSession++;
  isReading = false;
  releaseWakeLock();
  readQueue = [];
  readQueueIndex = 0;
  recordedPlayer.pause();
  if(recordedPlayer.currentSrc) recordedPlayer.currentTime = 0;
  recordedSection = -1;
  els.card.querySelectorAll('.prose [data-si].reading').forEach(node => node.classList.remove('reading'));
  if('speechSynthesis' in window) speechSynthesis.cancel();
  updateReadBtn(false);
  hideSeek();
  updateMediaSession(false);
  const silentAnchor = document.getElementById('silentAnchor');
  if(silentAnchor) silentAnchor.pause();
}

function speakNextChunk(session){
  if(session !== readSession) return;
  if(readQueueIndex >= readQueue.length){
    if(readAutoMode === 'next' && current < DATA.length - 1){
      render(current + 1);
      beginReadCurrent();
      return;
    }
    if(readAutoMode === 'prev' && current > 0){
      render(current - 1);
      beginReadCurrent();
      return;
    }
    stopReading();
    return;
  }
  const utter = new SpeechSynthesisUtterance(readQueue[readQueueIndex]);
  utter.lang = 'ko-KR';
  if(koVoice) utter.voice = koVoice;
  utter.rate = readRate;
  utter.onstart = () => { if(session === readSession) updateSeekUI(); };
  utter.onend = () => {
    if(session !== readSession) return;
    readQueueIndex++;
    speakNextChunk(session);
  };
  // 한 토막이 실패해도 전체를 멈추지 않고 다음 토막으로 넘어간다
  utter.onerror = () => {
    if(session !== readSession) return;
    readQueueIndex++;
    speakNextChunk(session);
  };
  speechSynthesis.speak(utter);
}

function beginReadCurrent(){
  readSession++;
  const session = readSession;
  isReading = true;
  requestWakeLock();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  readQueue = chunkText(buildReadText(DATA[current]), 120);
  readQueueIndex = 0;
  updateReadBtn(true);
  showSeek();
  updateSeekUI();
  updateMediaSession(true);
  const recordedPath = RECORDED_AUDIO[String(DATA[current].num)];
  if(recordedPath){
    recordedPlayer.src = recordedPath;
    recordedPlayer.playbackRate = readRate;
    recordedPlayer.currentTime = 0;
    recordedPlayer.play().catch(() => stopReading());
    return;
  }
  const silentAnchor = document.getElementById('silentAnchor');
  if(silentAnchor) silentAnchor.play().catch(()=>{});
  speakNextChunk(session);
}

function toggleReading(){
  if(!RECORDED_AUDIO[String(DATA[current].num)] && !('speechSynthesis' in window)){
    alert('이 브라우저에서는 읽어주기 기능을 지원하지 않습니다.');
    return;
  }
  if(isReading){
    stopReading();
    return;
  }
  beginReadCurrent();
}

// ===== N독 (다 읽음) 카운트: 항목별로 이 브라우저에만 저장 =====
function readCountKey(itemNum){ return 'wmdReadCount_' + itemNum; }
function getReadCount(itemNum){
  return parseInt(localStorage.getItem(readCountKey(itemNum)), 10) || 0;
}
function bumpReadCount(itemNum){
  const n = getReadCount(itemNum) + 1;
  try{ localStorage.setItem(readCountKey(itemNum), String(n)); }catch(e){}
  return n;
}

els.card.addEventListener('click', e => {
  if(e.target.closest('#readBtn')){ toggleReading(); return; }
  if(e.target.closest('#readCountBtn')){
    const it = DATA[current];
    const n = bumpReadCount(it.num);
    SayeonAnalytics.trackRead('stones', it.num, it.title, null);
    const label = document.getElementById('readCountLabel');
    if(label) label.textContent = n + '독';
    return;
  }
  const markEl = e.target.closest('mark.hl');
  if(markEl){
    removeHighlightAt(markEl);
    return;
  }
});

function removeHighlightAt(markEl){
  const container = markEl.closest('[data-si]');
  if(!container) return;
  const si = Number(markEl.dataset.si);
  const start = Number(markEl.dataset.start);
  const end = Number(markEl.dataset.end);
  const it = DATA[current];
  let hls = getHighlights(it.num);
  hls = hls.filter(h => !(h.si === si && h.start === start && h.end === end));
  setHighlights(it.num, hls);
  paintSections();
}

// ===== 문단을 드래그해서 하이라이트 =====
let pendingHl = null;

function closestSi(node){
  const el = node.nodeType === 3 ? node.parentElement : node;
  return el ? el.closest('[data-si]') : null;
}
function offsetWithin(el, node, nodeOffset){
  const r = document.createRange();
  r.selectNodeContents(el);
  r.setEnd(node, nodeOffset);
  return r.toString().length;
}
function showHlToolbar(range){
  const rect = range.getBoundingClientRect();
  const tb = els.hlToolbar;
  tb.style.display = 'flex';
  const tbWidth = tb.offsetWidth || 120;
  const tbHeight = tb.offsetHeight || 40;
  let left = rect.left + rect.width / 2 - tbWidth / 2;
  left = Math.min(Math.max(8, left), window.innerWidth - tbWidth - 8);
  // 모바일 기본 선택 메뉴(복사/공유 등)가 선택 영역 위에 뜨므로,
  // 겹치지 않게 팔레트는 선택 영역 아래에 둔다.
  let top = rect.bottom + 10;
  top = Math.min(top, window.innerHeight - tbHeight - 8);
  top = Math.max(8, top);
  tb.style.left = left + 'px';
  tb.style.top = top + 'px';
}
function hideHlToolbar(){
  pendingHl = null;
  if(els.hlToolbar) els.hlToolbar.style.display = 'none';
}
function applyPendingHighlight(color){
  if(!pendingHl) return;
  const it = DATA[current];
  let hls = getHighlights(it.num);
  hls = hls.filter(h => h.si !== pendingHl.si || h.end <= pendingHl.start || h.start >= pendingHl.end);
  hls.push({ si: pendingHl.si, start: pendingHl.start, end: pendingHl.end, color });
  setHighlights(it.num, hls);
  hideHlToolbar();
  window.getSelection().removeAllRanges();
  paintSections();
}

els.hlToolbar.addEventListener('click', e => {
  const b = e.target.closest('.hl-swatch');
  if(b) applyPendingHighlight(b.dataset.c);
});

function evaluateSelection(){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed){ hideHlToolbar(); return; }
  const range = sel.getRangeAt(0);
  const startEl = closestSi(range.startContainer);
  const endEl = closestSi(range.endContainer);
  if(!startEl || startEl !== endEl || !els.card.contains(startEl)){ hideHlToolbar(); return; }
  const start = offsetWithin(startEl, range.startContainer, range.startOffset);
  const end = offsetWithin(startEl, range.endContainer, range.endOffset);
  if(end <= start){ hideHlToolbar(); return; }
  pendingHl = { si: Number(startEl.dataset.si), start, end };
  showHlToolbar(range);
}

// 데스크톱: 마우스를 놓는 순간 바로 반응한다
document.addEventListener('mouseup', e => {
  if(e.target.closest('#hlToolbar')) return;
  evaluateSelection();
});

// 모바일: 손가락으로 문장을 고를 때는 mouseup이 안 오는 경우가 많아
// selectionchange(선택이 실제로 바뀔 때마다 발생)로 감지한다. 드래그 중
// 계속 발생하므로 살짝 멈췄을 때만 반응하도록 디바운스한다.
let hlSelectionDebounce = null;
document.addEventListener('selectionchange', () => {
  clearTimeout(hlSelectionDebounce);
  hlSelectionDebounce = setTimeout(evaluateSelection, 250);
});

function snippetFor(text, query){
  const idx = text.toLowerCase().indexOf(query);
  if(idx === -1) return '';
  const start = Math.max(0, idx - 18);
  const end = Math.min(text.length, idx + query.length + 30);
  let out = (start > 0 ? '…' : '') + text.slice(start, end).trim() + (end < text.length ? '…' : '');
  return out;
}

function runSearch(q){
  const query = q.trim().toLowerCase();
  activeResult = -1;
  if(!query){
    renderList(DATA.map((it,i) => ({i, it, inTitle:false})), '');
    return;
  }
  const hits = [];
  for(let i=0;i<DATA.length;i++){
    const it = DATA[i];
    const hay = it.search.toLowerCase();
    if(hay.includes(query)){
      hits.push({i, it, inTitle: it.title.toLowerCase().includes(query)});
    }
  }
  hits.sort((a,b) => (b.inTitle - a.inTitle));
  renderList(hits, query);
  searchOthers(query);
}

const FIND_BOX = 'card';   // 본문이 들어가는 칸
/* ===== 찾은 낱말로 이동 =====
   검색 결과를 눌러 들어오면 그 낱말을 노랗게 칠하고 첫 자리로 옮겨 준다.
   여러 곳에 나오면 아래 막대의 ▲▼ 로 옮겨 다닐 수 있다.
   칠하는 것은 글자를 늘리지 않으므로, 직접 칠한 하이라이트의 위치 계산에는 영향이 없다. */
var findQuery = null, findMarks = [], findAt = -1;

function clearFind() {
  var box = document.getElementById(FIND_BOX);
  if (box) {
    var ms = box.querySelectorAll("mark.find");
    for (var i = ms.length - 1; i >= 0; i--) {
      var m = ms[i], p = m.parentNode;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
      p.normalize();
    }
  }
  findMarks = []; findAt = -1;
  var bar = document.getElementById("findBar");
  if (bar) bar.style.display = "none";
}

function applyFind() {
  clearFind();
  if (!findQuery) return;
  var box = document.getElementById(FIND_BOX);
  if (!box) return;
  var needle = findQuery.replace(/\s+/g, "");
  if (!needle) return;

  // 글자만 이어 붙이고, 각 글자가 어느 텍스트 노드의 몇 번째인지 적어 둔다
  var walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, null);
  var s = "", pos = [], node, i;
  while ((node = walker.nextNode())) {
    var t = node.nodeValue;
    for (i = 0; i < t.length; i++) {
      var ch = t.charAt(i);
      if (ch === " " || ch === "\n" || ch === "\t" || ch === "\r") continue;
      s += ch; pos.push({ node: node, at: i });
    }
  }

  // 찾은 자리마다, 텍스트 노드별 구간으로 쪼개 둔다
  var groups = [], from = 0, hit;
  while ((hit = s.indexOf(needle, from)) >= 0) {
    var piece = [], cur = null;
    for (var k = hit; k < hit + needle.length; k++) {
      var p = pos[k];
      if (cur && cur.node === p.node && p.at === cur.end) cur.end = p.at + 1;
      else { cur = { node: p.node, start: p.at, end: p.at + 1 }; piece.push(cur); }
    }
    groups.push(piece);
    from = hit + needle.length;
  }
  if (!groups.length) return;

  // 뒤에서부터 칠해야 앞쪽 글자 위치가 밀리지 않는다
  for (var g = groups.length - 1; g >= 0; g--) {
    var marks = [];
    for (var q = groups[g].length - 1; q >= 0; q--) {
      var seg = groups[g][q];
      var tail = seg.node.splitText(seg.start);
      if (seg.end - seg.start < tail.nodeValue.length) tail.splitText(seg.end - seg.start);
      var mk = document.createElement("mark");
      mk.className = "find";
      tail.parentNode.insertBefore(mk, tail);
      mk.appendChild(tail);
      marks.unshift(mk);
    }
    findMarks.unshift(marks);
  }

  var bar = document.getElementById("findBar");
  if (bar) {
    bar.style.display = "flex";
    document.getElementById("findWord").textContent = findQuery;
  }
  gotoFind(0);
}

function gotoFind(n) {
  if (!findMarks.length) return;
  if (n < 0) n = findMarks.length - 1;
  if (n >= findMarks.length) n = 0;
  findAt = n;
  for (var i = 0; i < findMarks.length; i++) {
    for (var j = 0; j < findMarks[i].length; j++) {
      findMarks[i][j].className = (i === n) ? "find cur" : "find";
    }
  }
  var el = findMarks[n][0];
  try { el.scrollIntoView({ behavior: "smooth", block: "center" }); }
  catch (e) { el.scrollIntoView(); }
  var c = document.getElementById("findCount");
  if (c) c.textContent = (n + 1) + " / " + findMarks.length;
}

document.getElementById("findPrev").addEventListener("click", () => gotoFind(findAt - 1));
document.getElementById("findNext").addEventListener("click", () => gotoFind(findAt + 1));
document.getElementById("findClose").addEventListener("click", () => { findQuery = null; clearFind(); });
// 찾던 낱말 그대로 검색 결과를 다시 펼친다
document.getElementById("findBack").addEventListener("click", () => {
  const kw = findQuery || '';
  els.search.value = kw;
  openDrawer(true);
  runSearch(kw);
});

/* ===== 다른 카테고리도 같이 찾기 =====
   성령사연(2026·2025)·말씀 원본을 그때그때 받아서 함께 찾는다.
   내용이 늘어도 여기는 손댈 것이 없다. */
const OTHER_SOURCES = [
  { label:'성령사연 2026', url:'../sayeon.json',     base:'../', year:'2026' },
  { label:'성령사연 2025', url:'../sayeon2025.json', base:'../', year:'2025' },
  { label:'말씀',          url:'../malsseum/malsseum.json', base:'../malsseum/' }
];
const OTHER_CACHE = {};

function squash(t){ return (t || '').replace(/\s+/g, ''); }

function otherText(item){
  const out = [];
  for(const it of (item.paragraphs || [])){
    if(!it || it.hr) continue;
    if(it.h){ out.push(it.h); continue; }
    const lines = it.p ? it.p : it;
    if(lines && lines.join) out.push(lines.join(' '));
  }
  if(item.quote) out.push(item.quote);
  return out.join('\n');
}

function fetchOther(src){
  if(OTHER_CACHE[src.url]) return Promise.resolve(OTHER_CACHE[src.url]);
  return fetch(src.url).then(r => r.json()).then(list => {
    OTHER_CACHE[src.url] = list || [];
    return OTHER_CACHE[src.url];
  }).catch(() => []);
}

let otherSearchSeq = 0;
function searchOthers(query){
  const seq = ++otherSearchSeq;
  const needle = squash(query);
  if(!needle) return;
  const box = document.getElementById('otherResults');
  if(!box) return;
  box.innerHTML = '';
  Promise.all(OTHER_SOURCES.map(src => fetchOther(src).then(list => {
    const hits = [];
    for(const item of list){
      const text = otherText(item);
      const sq = squash(text);
      const at = sq.indexOf(needle);
      const inTitle = squash(item.title || '').includes(needle);
      if(at < 0 && !inTitle) continue;
      let snip = '';
      if(at >= 0){
        // 공백을 뺀 위치를 원문 위치로 되돌린다
        let seen = 0, pos = 0;
        for(; pos < text.length && seen < at; pos++){ if(!/\s/.test(text[pos])) seen++; }
        const from = Math.max(0, pos - 22);
        snip = (from > 0 ? '…' : '') + text.substr(from, 78).replace(/\s+/g, ' ') + '…';
      }
      hits.push({ item, snip });
    }
    return { src, hits };
  }))).then(blocks => {
    if(seq !== otherSearchSeq) return;   // 그 사이 새로 검색했으면 버린다
    box.innerHTML = '';
    for(const { src, hits } of blocks){
      if(!hits.length) continue;
      const head = document.createElement('div');
      head.className = 'other-cat';
      head.textContent = src.label + ' (' + hits.length + ')';
      box.appendChild(head);
      for(const h of hits){
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML = `<span>${escapeHtml(h.item.title || '')}` +
          (h.snip ? `<span class="snip">${escapeHtml(h.snip)}</span>` : '') + '</span>';
        btn.addEventListener('click', () => {
          location.href = src.base + '#n=' + encodeURIComponent(h.item.no) +
            (src.year ? '&y=' + src.year : '') + '&q=' + encodeURIComponent(query);
        });
        box.appendChild(btn);
      }
    }
  });
}

function renderList(hits, query){
  if(!hits.length){
    els.drawerList.innerHTML = `<div class="empty">월명동에는 '${escapeHtml(query)}' 결과가 없습니다.</div>` +
      '<div id="otherResults"></div>';
    return;
  }
  els.drawerList.innerHTML = hits.map(({i, it, inTitle}, pos) => {
    const snip = (query && !inTitle) ? snippetFor(it.search, query) : '';
    const cur = i === current ? ' current' : '';
    return `<button type="button" role="option" class="${cur.trim()}" data-index="${i}" data-pos="${pos}">
      <span class="num">${escapeHtml(it.num)}.</span>
      <span>${escapeHtml(it.title)}${snip ? `<span class="snip">${escapeHtml(snip)}</span>` : ''}</span>
    </button>`;
  }).join('');
  [...els.drawerList.querySelectorAll('button')].forEach(btn => {
    btn.addEventListener('click', () => { findQuery = query || null; render(Number(btn.dataset.index)); });
  });
  const other = document.createElement('div');
  other.id = 'otherResults';
  els.drawerList.appendChild(other);
}

function openDrawer(focusSearch){
  els.drawer.classList.add('open');
  els.drawerBackdrop.classList.add('open');
  runSearch(els.search.value);
  if(focusSearch !== false) setTimeout(() => els.search.focus(), 200);
}

function closeDrawer(){
  els.drawer.classList.remove('open');
  els.drawerBackdrop.classList.remove('open');
  activeResult = -1;
}

function isDrawerOpen(){
  return els.drawer.classList.contains('open');
}

// 목록: 검색창은 비워 전체 목록 상태로 드로어를 연다 (검색창에 포커스는 주지 않는다)
function openList(){
  els.search.value = '';
  openDrawer(false);
}
// 검색: 같은 드로어를 열고 바로 입력할 수 있게 검색창에 포커스한다
function openSearch(){
  openDrawer(true);
}

els.search.addEventListener('input', e => runSearch(e.target.value));
els.search.addEventListener('keydown', e => {
  const buttons = [...els.drawerList.querySelectorAll('button')];
  if(e.key === 'ArrowDown' && buttons.length){
    e.preventDefault();
    activeResult = Math.min(activeResult + 1, buttons.length - 1);
    buttons.forEach((b,i) => b.setAttribute('aria-selected', String(i===activeResult)));
    buttons[activeResult].scrollIntoView({block:'nearest'});
  } else if(e.key === 'ArrowUp' && buttons.length){
    e.preventDefault();
    activeResult = Math.max(activeResult - 1, 0);
    buttons.forEach((b,i) => b.setAttribute('aria-selected', String(i===activeResult)));
    buttons[activeResult].scrollIntoView({block:'nearest'});
  } else if(e.key === 'Enter'){
    if(activeResult >= 0 && buttons[activeResult]) buttons[activeResult].click();
    else if(buttons.length === 1) buttons[0].click();
  } else if(e.key === 'Escape'){
    closeDrawer();
    els.topSearchBtn.focus();
  }
});

els.drawerClose.addEventListener('click', closeDrawer);
els.drawerBackdrop.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && isDrawerOpen()) closeDrawer();
  if(e.key === 'Escape' && isSettingsOpen()) closeSettings();
  if(e.key === 'Escape') hideHlToolbar();
});

els.topListBtn.addEventListener('click', () => { closeSettings(); openList(); });
els.pagerListBtn.addEventListener('click', () => { closeSettings(); openList(); });
els.topSearchBtn.addEventListener('click', () => { closeSettings(); openSearch(); });

// 설정 모달
function isSettingsOpen(){
  return els.settingsModal.classList.contains('open');
}
function openSettings(){
  closeDrawer();
  els.settingsModal.classList.add('open');
  els.settingsBackdrop.classList.add('open');
}
function closeSettings(){
  els.settingsModal.classList.remove('open');
  els.settingsBackdrop.classList.remove('open');
}
els.topSettingsBtn.addEventListener('click', () => { isSettingsOpen() ? closeSettings() : openSettings(); });
els.settingsClose.addEventListener('click', closeSettings);
els.settingsBackdrop.addEventListener('click', closeSettings);

els.prevBtn.addEventListener('click', () => { if(current > 0) render(current - 1); });
els.nextBtn.addEventListener('click', () => { if(current < DATA.length - 1) render(current + 1); });

// 화면을 좌우로 밀면(스와이프) 이전/다음 항목으로 이동
(function(){
  let startX = 0, startY = 0, tracking = false;
  const THRESHOLD = 60;

  function onStart(x, y){
    startX = x; startY = y; tracking = true;
  }
  function onEnd(x, y){
    if(!tracking) return;
    tracking = false;
    const sel = window.getSelection();
    if(sel && !sel.isCollapsed) return; // 텍스트를 드래그해서 고르는 중이면 페이지 넘김을 막는다
    const dx = x - startX;
    const dy = y - startY;
    if(Math.abs(dx) < THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    if(dx < 0){
      if(current < DATA.length - 1) render(current + 1);
    } else {
      if(current > 0) render(current - 1);
    }
  }

  els.main.addEventListener('touchstart', e => {
    if(isDrawerOpen() || !e.touches.length) return;
    const t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, {passive:true});
  els.main.addEventListener('touchend', e => {
    if(isDrawerOpen() || !e.changedTouches.length) return;
    const t = e.changedTouches[0];
    onEnd(t.clientX, t.clientY);
  }, {passive:true});
})();

// 글자 크기 조절 (설정 모달)
(function(){
  const MIN = 14, MAX = 26, STEP = 1, DEFAULT = 16;
  const root = document.documentElement;
  const setSizeLabel = document.getElementById('setFontSizeLabel');
  const setMinusBtn = document.getElementById('setFontMinus');
  const setPlusBtn = document.getElementById('setFontPlus');
  const setResetBtn = document.getElementById('setFontReset');

  function apply(size){
    size = Math.min(MAX, Math.max(MIN, size));
    root.style.setProperty('--content-size', size + 'px');
    setSizeLabel.textContent = size + 'px';
    saveSettings({ size: size });
    setMinusBtn.disabled = size <= MIN;
    setPlusBtn.disabled = size >= MAX;
  }

  const saved = loadSettings().size;
  apply(Number.isFinite(saved) ? saved : DEFAULT);

  setMinusBtn.addEventListener('click', () => apply(parseInt(setSizeLabel.textContent, 10) - STEP));
  setPlusBtn.addEventListener('click', () => apply(parseInt(setSizeLabel.textContent, 10) + STEP));
  setResetBtn.addEventListener('click', () => apply(DEFAULT));
})();

/* 위 상태바 색을 지금 화면의 배경색에 맞춘다.
   설정에서 테마나 배경색을 바꾸면 상태바도 따라 바뀐다. */
function syncThemeColor() {
  var meta = document.querySelector('meta[name="theme-color"]');
  var bg = getComputedStyle(document.body).backgroundColor;
  if (!bg || bg === "rgba(0, 0, 0, 0)" || bg === "transparent") return;
  if (meta) meta.setAttribute("content", bg);

  // 아이폰은 상태바 글자색을 따로 정해 줘야 한다.
  // 배경이 밝으면 검은 글자(default), 어두우면 흰 글자(black).
  var m = bg.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (!m) return;
  var light = (m[1] * 299 + m[2] * 587 + m[3] * 114) / 1000 > 140;
  var ios = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (ios) ios.setAttribute("content", light ? "default" : "black");
}

// 테마 (라이트 / 다크 / 시스템)
(function(){
  const root = document.documentElement;
  const opts = [...document.querySelectorAll('#themeOpts .opt')];

  function markSel(theme){
    opts.forEach(b => b.classList.toggle('sel', b.dataset.theme === theme));
  }
  function apply(theme, save){
    if(theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
    else root.removeAttribute('data-theme');
    markSel(theme);
    syncThemeColor();
    if(save) localStorage.setItem('wmdTheme', theme);
  }

  // 성령사연/말씀은 배경색을 직접 고르는 방식이라 색이 그대로 옮겨 오지 않는다.
  // 대신 저장된 배경색의 밝기를 보고 밝은 테마/어두운 테마를 맞춘다.
  function themeFromShared(){
    const bg = loadSettings().bg;
    if(typeof bg !== 'string' || !/^#[0-9a-f]{6}$/i.test(bg)) return null;
    const r = parseInt(bg.slice(1,3),16), g = parseInt(bg.slice(3,5),16), b = parseInt(bg.slice(5,7),16);
    return (r*299 + g*587 + b*114) / 1000 > 140 ? 'light' : 'dark';
  }

  apply(themeFromShared() || 'system', false);

  opts.forEach(b => b.addEventListener('click', () => {
    apply(b.dataset.theme, true);
    // 다른 두 페이지에도 반영되도록 대표 색을 같이 저장한다
    if(b.dataset.theme === 'light') saveSettings({ bg:'#ffffff', text:'#1a1a1a' });
    else if(b.dataset.theme === 'dark') saveSettings({ bg:'#1b2018', text:'#e9ece4' });
  }));
  // '시스템' 을 골랐을 때 기기의 밝게/어둡게가 바뀌면 상태바 색도 따라간다
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', () => setTimeout(syncThemeColor, 50));
  }
})();

// 읽기 속도
let readRate = 0.90;
(function(){
  const MIN = 0.6, MAX = 1.8, STEP = 0.05, DEFAULT = 0.90;
  const label = document.getElementById('rateLabel');
  const minusBtn = document.getElementById('rateMinus');
  const plusBtn = document.getElementById('ratePlus');

  function apply(rate){
    rate = Math.min(MAX, Math.max(MIN, Math.round(rate * 100) / 100));
    readRate = rate;
    recordedPlayer.playbackRate = rate;
    label.textContent = Math.round(rate * 100) + '%';
    saveSettings({ rate: rate });
  }

  const saved = loadSettings().rate;
  apply(Number.isFinite(saved) ? saved : DEFAULT);

  minusBtn.addEventListener('click', () => apply(readRate - STEP));
  plusBtn.addEventListener('click', () => apply(readRate + STEP));
})();

// 읽어주기: 이전/다음 항목 이어 듣기 방향 (기본은 역순)
let readAutoMode = 'prev';
(function(){
  const opts = [...document.querySelectorAll('#autoNextOpts .opt')];
  function markSel(){
    opts.forEach(b => b.classList.toggle('sel', b.dataset.automode === readAutoMode));
  }
  function apply(mode, save){
    readAutoMode = mode;
    markSel();
    if(save) saveSettings({ autoMode: mode });
  }
  const saved = loadSettings();
  var initial = 'prev';
  if(saved.autoMode === 'prev' || saved.autoMode === 'next' || saved.autoMode === 'off') initial = saved.autoMode;
  else if(typeof saved.autoNext === 'boolean' && saved.autoNext === false) initial = 'off';
  apply(initial, false);
  opts.forEach(b => b.addEventListener('click', () => apply(b.dataset.automode, true)));
})();

els.count.textContent = `총 ${DATA.length}개 항목`;

// 다른 카테고리의 검색 결과에서 넘어왔으면 (#n=12) 그 항목을 펼쳐 준다
(function(){
  const mq = (location.hash || '').match(/[#&]q=([^&]*)/);
  if(mq) findQuery = decodeURIComponent(mq[1]);
  const m = (location.hash || '').match(/[#&]n=([^&]*)/);
  if(m){
    const no = decodeURIComponent(m[1]);
    const at = DATA.findIndex(d => String(d.num) === String(no));
    if(at >= 0){ render(at); return; }
  }
  render(0);
})();
