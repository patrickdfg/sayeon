<!DOCTYPE html>
<!-- 성령 사연 뷰어 — 사연 154편을 카드로 넘겨 보며 읽고 듣고, 글꼴·여백·테마를 설정할 수 있는 단일 HTML 문서 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 성령 사연</title>
<style>
  :root {
    --bg: #1b2018;
    --text: #e9ece4;
    --green: #93c4a5;
    --gold: #e6d5a0;
    --panel: rgba(140,150,130,.14);
    --size: 16px;
    --lh: 1.95;
    --pad: 18px;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
    padding-bottom: 60px;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 22px var(--pad) 40px; }
  .dim { opacity: .6; }

  h1.head { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .headrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }

  /* 성령사연 / 월명동사연 / 말씀 이동 탭 */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .tab {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--panel); color: var(--text);
    border: 0; border-radius: 999px; padding: 10px 18px;
    font-size: 15px; font-family: inherit; text-decoration: none;
    min-height: 44px; cursor: pointer;
  }
  .tab.on { background: var(--green); color: #14180f; font-weight: 700; cursor: default; }

  .topbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .topbtn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); color: var(--text); border: 0;
    border-radius: 999px; padding: 10px 18px;
    font-size: 15px; font-family: inherit; cursor: pointer; min-height: 44px;
    text-decoration: none;
  }

  .total { opacity: .6; font-size: 15px; margin: 16px 0 10px; }
  hr.sep { border: 0; border-top: 1px solid; opacity: .18; margin: 0 0 22px; }

  .card-head {
    background: var(--green); color: #14180f;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 14px 16px; border-radius: 4px;
  }
  .card-head .t {
    font-size: 21px; font-weight: 600; flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-head-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .speakbtn {
    background: rgba(20,24,15,.14); color: #14180f; border: 0;
    border-radius: 999px; padding: 8px 14px; font-size: 15px;
    font-family: inherit; cursor: pointer; white-space: nowrap; min-height: 40px;
    flex-shrink: 0;
  }
  .speakbtn.on { background: #14180f; color: var(--green); }
  .speakbtn.human { background: var(--gold); color: #2a2200; }
  .speakbtn.human.on { background: #2a2200; color: var(--gold); }
  .speakbtn.readcount.done { background: #14180f; color: var(--green); }
  @media (max-width: 420px) {
    .card-head { gap: 6px; padding: 12px 12px; }
    .card-head .t { font-size: 17px; }
    .speakbtn { padding: 7px 10px; font-size: 12px; min-height: 34px; }
    .card-head-actions { gap: 5px; }
  }
  .seekwrap { display: none; align-items: center; gap: 10px; padding: 10px 16px 0; }
  .seekwrap.show { display: flex; }
  .seekwrap input[type=range] { flex: 1; accent-color: var(--green); height: 4px; cursor: pointer; }
  .seektime { font-size: 12px; opacity: .65; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .card-body { padding: 20px 2px 24px; }
  .sub { opacity: .6; font-style: italic; font-size: 15px; margin-bottom: 14px; line-height: 1.7; }
  .linkbtn {
    display: inline-block; background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 11px 16px; margin-bottom: 18px;
    font-size: 15px; text-decoration: none;
  }

  .para { font-size: var(--size); line-height: var(--lh); margin: 0 0 1.5em; white-space: pre-wrap; }
  .phead {
    font-size: var(--size); font-weight: 700; color: var(--green);
    margin: 0 0 1em; line-height: var(--lh);
  }
  .hrline { border: 0; border-top: 1px solid; opacity: .2; margin: 6px 0 22px; }
  .para.reading { background: rgba(147,196,165,.28); border-radius: 4px; }
  .empty { opacity: .6; font-size: 15px; line-height: 2; text-align: center; padding: 30px 0; }

  .quote {
    background: var(--panel); border-radius: 8px;
    padding: 20px 18px; margin: 26px 0 6px;
    color: var(--text); font-weight: 700; text-align: center;
    font-size: var(--size); line-height: var(--lh);
  }

  /* 하이라이트 (문단을 드래그해서 칠하고, 칠한 부분을 다시 누르면 지워진다) */
  mark.hl{ cursor:pointer; border-radius:3px; padding:.05em .1em; color:#2a2823; }
  mark.hl-1{ background:#ffe08a; }
  mark.hl-2{ background:#9fe0b8; }
  mark.hl-3{ background:#a7c8f5; }
  .hl-toolbar{
    position:fixed; z-index:120; display:none; align-items:center; gap:6px;
    background:var(--bg); border:1px solid var(--panel); border-radius:999px;
    padding:6px; box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .hl-swatch{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--bg);
    box-shadow:0 0 0 1px rgba(255,255,255,.25); cursor:pointer; padding:0;
  }
  .hl-swatch.hl-1{background:#ffe08a;}
  .hl-swatch.hl-2{background:#9fe0b8;}
  .hl-swatch.hl-3{background:#a7c8f5;}
  .hl-swatch:hover{transform:scale(1.1);}

  .nav { display: flex; gap: 12px; margin-top: 26px; }
  .navbtn {
    flex: 1; min-height: 78px; background: var(--panel); border: 0;
    border-radius: 8px; padding: 12px 14px; color: var(--text);
    font-family: inherit; cursor: pointer;
  }
  .navbtn .k { display: block; opacity: .6; font-size: 14px; margin-bottom: 4px; }
  .navbtn .v { display: block; font-size: 17px; word-break: keep-all; }
  .navbtn.left { text-align: left; }
  .navbtn.right { text-align: right; }
  .navbtn.mid { flex: 0 0 84px; text-align: center; font-size: 15px; }
  .navbtn:disabled { opacity: .3; cursor: default; }

  footer { opacity: .6; font-size: 14px; text-align: center; margin-top: 30px; }
  .warn { color: #d8b45f; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

  /* 공통 모달 */
  .modal {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    background: var(--bg); z-index: 30; display: none;
    padding: 18px 16px 40px; overflow-y: auto; color: var(--text);
  }
  .modal.open { display: block; }
  .modal .inner { max-width: 780px; margin: 0 auto; }
  .modal .top { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
  .modal .top h2 { font-size: 20px; margin: 0; flex: 1; }
  .closebtn {
    background: var(--green); color: #14180f; border: 0; border-radius: 8px;
    padding: 0 16px; font-size: 16px; cursor: pointer; min-height: 46px; font-family: inherit;
  }

  /* 설정 */
  .set { margin-bottom: 22px; }
  .set > .name { font-size: 15px; opacity: .7; margin-bottom: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .opt {
    background: var(--panel); color: var(--text); border: 0; border-radius: 8px;
    padding: 10px 14px; font-size: 15px; font-family: inherit; cursor: pointer; min-height: 44px;
  }
  .opt.sel { background: var(--green); color: #14180f; font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .rnd {
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--panel); color: var(--text); font-size: 20px; cursor: pointer;
  }
  .val { color: var(--text); font-weight: 700; font-size: 16px; min-width: 62px; text-align: center; }
  .colorrow { display: flex; align-items: center; gap: 12px; }
  .colorrow input[type=color] {
    width: 62px; height: 44px; border: 0; background: var(--panel);
    border-radius: 8px; padding: 4px; cursor: pointer;
  }
  .colorrow .hex { font-size: 15px; opacity: .7; }

  /* 검색 */
  #q {
    flex: 1; background: var(--panel); color: var(--text); border: 0;
    border-radius: 8px; padding: 12px 14px; font-size: 16px;
    font-family: inherit; min-height: 46px;
  }
  .hit {
    display: block; width: 100%; text-align: left; background: var(--panel);
    border: 0; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
    color: var(--text); font-family: inherit; font-size: 15px; cursor: pointer;
  }
  /* 검색해서 찾은 낱말 */
  mark.find { background: #ffd54a; color: #2a2823; border-radius: 2px; padding: 0; }
  mark.find.cur { background: #ff9330; box-shadow: 0 0 0 2px rgba(255,147,48,.45); }
  .findbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px;
    z-index: 40; display: none; align-items: center; gap: 6px;
    background: var(--bg); border: 1px solid var(--panel); border-radius: 999px;
    padding: 6px 8px 6px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    max-width: calc(100% - 24px);
  }
  .findbar .w {
    font-weight: 700; color: var(--green); max-width: 32vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px;
  }
  .findbar .c { opacity: .6; font-size: 13px; white-space: nowrap; }
  .findbar button {
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: var(--panel); color: var(--text);
    font-size: 15px; cursor: pointer; font-family: inherit; flex: 0 0 auto;
  }
  .searchsum { opacity: .6; font-size: 14px; margin: 0 0 12px; }
  .searchcat {
    font-size: 14px; font-weight: 700; color: var(--green);
    margin: 18px 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid; border-color: rgba(147,196,165,.3);
  }
  .hit b { color: var(--green); }
  .hit .snip { display: block; opacity: .6; font-size: 14px; margin-top: 4px; line-height: 1.6; }

  /* 잠금화면 */
  .lock {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .lock.hidden { display: none; }
  .lockbox { width: 100%; max-width: 300px; text-align: center; }
  .locktitle { font-size: 18px; margin-bottom: 18px; }
  .lockbox input {
    width: 100%; background: var(--panel); color: var(--text); border: 0;
    border-radius: 8px; padding: 14px; font-size: 22px; text-align: center;
    letter-spacing: .4em; font-family: inherit; margin-bottom: 12px;
  }
  .lockbtn {
    width: 100%; background: var(--green); color: #14180f; border: 0;
    border-radius: 8px; padding: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; min-height: 46px;
  }
  .lockwarn { color: #d8837f; font-size: 14px; margin-top: 12px; display: none; }
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lockbox">
    <div class="locktitle">비밀번호를 입력하세요</div>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button class="lockbtn" id="pwok">확인</button>
    <div class="lockwarn" id="pwwarn">비밀번호가 틀렸습니다.</div>
  </div>
</div>

<div class="wrap" id="wrap">
  <nav class="tabs">
    <span class="tab on" aria-current="page">성령사연</span>
    <a class="tab" href="stones/">월명동사연</a>
    <a class="tab" href="malsseum/">말씀</a>
  </nav>
  <nav class="tabs" id="yearTabs">
    <button type="button" class="tab on" id="yearBtn2026" data-year="2026">2026</button>
    <button type="button" class="tab" id="yearBtn2025" data-year="2025">2025</button>
  </nav>
  <div class="headrow">
    <h1 class="head" id="pageHead">2026년 성령 사연</h1>
  </div>
  <div class="topbar">
    <button class="topbtn" id="openlist">📋 목록</button>
    <button class="topbtn" id="opensettings">⚙ 설정</button>
    <button class="topbtn" id="opensearch">🔍 검색</button>
  </div>

  <div class="total" id="total"></div>
  <hr class="sep">

  <div class="card">
    <div class="card-head">
      <div class="t"><span id="ctitle"></span></div>
      <div class="card-head-actions">
        <button class="speakbtn readcount" id="readCountBtn" type="button" aria-label="다 읽었으면 눌러서 기록">다 읽음</button>
        <button class="speakbtn" id="speak">🔊 듣기</button>
      </div>
    </div>
    <div class="seekwrap" id="seekWrap">
      <input type="range" id="seekRange" min="0" max="1000" value="0" step="1" aria-label="재생 위치">
      <span class="seektime" id="seekTime"></span>
    </div>
    <div class="card-body">
      <div class="sub" id="csub"></div>
      <a class="linkbtn" id="clink" target="_blank" rel="noopener" style="display:none"></a>
      <div id="body"></div>
    </div>
  </div>

  <div class="nav">
    <button class="navbtn left" id="prev"><span class="k">이전</span><span class="v" id="prevT"></span></button>
    <button class="navbtn mid" id="navlist">목록</button>
    <button class="navbtn right" id="next"><span class="k">다음</span><span class="v" id="nextT"></span></button>
  </div>

  <footer>성령의 사연 자료실</footer>
  <div class="warn" id="warn">이 브라우저에서는 읽어주기를 지원하지 않습니다.</div>
</div>


<div class="findbar" id="findBar">
  <span class="w" id="findWord"></span>
  <span class="c" id="findCount"></span>
  <button id="findBack" aria-label="검색 결과로 돌아가기">↩</button>
  <button id="findPrev" aria-label="이전 낱말">▲</button>
  <button id="findNext" aria-label="다음 낱말">▼</button>
  <button id="findClose" aria-label="찾기 끝내기">✕</button>
</div>

<audio id="player"></audio>

<audio id="silentAnchor" loop playsinline preload="auto" src="data:audio/wav;base64,UklGRmQfAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAfAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA <script>
/* ===== 사연 데이터 =====
   내용은 같은 폴더의 sayeon.json 파일에 들어 있습니다.
   편을 추가하려면 sayeon.json 만 고치면 됩니다. 이 파일은 건드릴 필요 없습니다.
   형식:
   {
     "no": 155,
     "title": "성령 사연 155",
     "subtitle": "(성령님 말씀)",
     "paragraphs": [
       ["한 문단의 첫 줄", "둘째 줄"],
       { "h": "<소제목>" },
       { "hr": true },
       ["다음 문단"]
     ],
     "quote": "강조 박스에 넣을 문장 (없으면 생략)",
     "link": { "label": "영상 보기", "url": "https://..." }
   }
*/
var SAYEON = [];
var YEAR_URLS = { "2026": "sayeon.json", "2025": "sayeon2025.json" };
var currentYear = "2026";
var DATA_URL = YEAR_URLS[currentYear];
// 다른 페이지 검색 결과에서 #y=2025 로 넘어오면 그 해 자료로 시작한다
(function () {
  var m = (location.hash || "").match(/[#&]y=(\d{4})/);
  if (m && YEAR_URLS[m[1]]) { currentYear = m[1]; DATA_URL = YEAR_URLS[currentYear]; }
})();

/* ===== 설정 ===== */
var FONTS = [
  { k: "고딕", v: '"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' },
  { k: "명조", v: '"Nanum Myeongjo", "Batang", "AppleMyungjo", serif' },
  { k: "돋움", v: '"Dotum", "Apple SD Gothic Neo", sans-serif' },
  { k: "굴림", v: '"Gulim", "Apple SD Gothic Neo", sans-serif' }
];
var THEMES = [
  { k: "어두운 초록", bg: "#1b2018", text: "#e9ece4" },
  { k: "검정", bg: "#000000", text: "#e6e6e6" },
  { k: "남색", bg: "#0b1a3a", text: "#eaf1ff" },
  { k: "세피아", bg: "#f3e9d2", text: "#3a2f1b" },
  { k: "흰색", bg: "#ffffff", text: "#1a1a1a" }
];
var DEF = { size: 16, lh: 1.95, pad: 18, font: 0, bg: "#1b2018", text: "#e9ece4", autoMode: "prev", rate: 0.90 };
var cfg = { size: DEF.size, lh: DEF.lh, pad: DEF.pad, font: DEF.font, bg: DEF.bg, text: DEF.text, autoMode: DEF.autoMode, rate: DEF.rate };

function $(id) { return document.getElementById(id); }

/* ===== 설정 저장 =====
   글자·색·속도·목소리 같은 설정은 세 페이지(성령사연·월명동·말씀)가
   한 곳에 모아 같이 쓴다. 같은 주소라 브라우저 저장소를 공유한다.
   한 곳에서 바꾸면 나머지 두 곳에도 그대로 적용된다. */
var SETTINGS_KEY = "siteSettings";
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveSettings(patch) {
  var s = loadSettings(), k;
  for (k in patch) { if (Object.prototype.hasOwnProperty.call(patch, k)) s[k] = patch[k]; }
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}
// 저장해 둔 설정을 cfg 로 불러온다
function loadCfg() {
  var s = loadSettings();
  if (typeof s.size === "number") cfg.size = s.size;
  if (typeof s.lh === "number") cfg.lh = s.lh;
  if (typeof s.pad === "number") cfg.pad = s.pad;
  if (typeof s.font === "number" && FONTS[s.font]) cfg.font = s.font;
  if (typeof s.bg === "string") cfg.bg = s.bg;
  if (typeof s.text === "string") cfg.text = s.text;
  if (s.autoMode === "prev" || s.autoMode === "next" || s.autoMode === "off") {
    cfg.autoMode = s.autoMode;
  } else if (typeof s.autoNext === "boolean" && s.autoNext === false) {
    cfg.autoMode = "off"; // 예전 설정(끄기)만 그대로 이어받고, 나머지는 새 기본값(역순)을 쓴다
  }
  if (typeof s.rate === "number" && s.rate >= 0.5 && s.rate <= 2.0) cfg.rate = s.rate;
  if (typeof s.voice === "string") voiceName = s.voice;
}
function storeCfg() {
  saveSettings({
    size: cfg.size, lh: cfg.lh, pad: cfg.pad, font: cfg.font,
    bg: cfg.bg, text: cfg.text, autoMode: cfg.autoMode, rate: cfg.rate
  });
}
function setVar(n, v) { document.documentElement.style.setProperty(n, v); }

function applyCfg() {
  setVar("--size", cfg.size + "px");
  setVar("--lh", String(cfg.lh));
  setVar("--pad", cfg.pad + "px");
  setVar("--font", FONTS[cfg.font].v);
  setVar("--bg", cfg.bg);
  setVar("--text", cfg.text);
  $("fsVal").textContent = cfg.size + "px";
  $("lhVal").textContent = cfg.lh.toFixed(2);
  $("rateVal").textContent = Math.round(cfg.rate * 100) + "%";
  $("padVal").textContent = cfg.pad + "px";
  $("cText").value = cfg.text;
  $("cBg").value = cfg.bg;
  $("cTextHex").textContent = cfg.text;
  $("cBgHex").textContent = cfg.bg;
  markSel("fontOpts", cfg.font);
  markSel("themeOpts", themeIndex());
  markSel("autoOpts", cfg.autoMode === "prev" ? 0 : cfg.autoMode === "next" ? 1 : 2);
  storeCfg();
}

function themeIndex() {
  for (var i = 0; i < THEMES.length; i++) {
    if (THEMES[i].bg === cfg.bg && THEMES[i].text === cfg.text) return i;
  }
  return -1;
}

function markSel(boxId, sel) {
  var bs = $(boxId).getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].className = (i === sel) ? "opt sel" : "opt";
  }
}

function buildOpts() {
  var i, b;
  for (i = 0; i < FONTS.length; i++) {
    b = document.createElement("button");
    b.className = "opt";
    b.textContent = FONTS[i].k;
    b.style.fontFamily = FONTS[i].v;
    (function (n) { b.onclick = function () { cfg.font = n; applyCfg(); }; })(i);
    $("fontOpts").appendChild(b);
  }
  for (i = 0; i < THEMES.length; i++) {
    b = document.createElement("button");
    b.className = "opt";
    b.textContent = THEMES[i].k;
    (function (n) {
      b.onclick = function () { cfg.bg = THEMES[n].bg; cfg.text = THEMES[n].text; applyCfg(); };
    })(i);
    $("themeOpts").appendChild(b);
  }
}

/* ===== 하이라이트 (편별로 이 브라우저에만 저장, 3색) ===== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
/* ===== N독 (다 읽음) 카운트: 편별로 이 브라우저에만 저장 ===== */
function readCountKey(epNum) { return "sayeonReadCount_" + currentYear + "_" + epNum; }
function getReadCount(epNum) {
  return parseInt(localStorage.getItem(readCountKey(epNum)), 10) || 0;
}
function bumpReadCount(epNum) {
  var n = getReadCount(epNum) + 1;
  try { localStorage.setItem(readCountKey(epNum), String(n)); } catch (e) {}
  return n;
}

function hlKey(epNum) { return "sayeonHl_" + currentYear + "_" + epNum; }
function getHighlights(epNum) {
  try { return JSON.parse(localStorage.getItem(hlKey(epNum)) || "[]"); } catch (e) { return []; }
}
function setHighlights(epNum, list) {
  try { localStorage.setItem(hlKey(epNum), JSON.stringify(list)); } catch (e) {}
}
// 한 줄(제목/인용문)짜리 텍스트에 하이라이트를 입혀 HTML 문자열로 만든다
function renderTextWithHighlights(text, hls) {
  if (!hls.length) return escapeHtml(text);
  var sorted = hls.slice().sort(function (a, b) { return a.start - b.start; });
  var out = "", pos = 0;
  for (var i = 0; i < sorted.length; i++) {
    var h = sorted[i];
    if (h.start < pos) continue;
    out += escapeHtml(text.slice(pos, h.start));
    out += '<mark class="hl hl-' + h.color + '" data-pi="' + h.pi + '" data-start="' + h.start + '" data-end="' + h.end + '">' +
      escapeHtml(text.slice(h.start, h.end)) + '</mark>';
    pos = h.end;
  }
  out += escapeHtml(text.slice(pos));
  return out;
}
// 줄바꿈(<br>)이 있는 문단: 오프셋은 줄들을 이어붙인(구분자 없는) 기준이며,
// <br>은 글자를 차지하지 않는다는 점(브라우저의 Range 계산과 동일)을 그대로 따른다.
function renderLinesWithHighlights(lines, hls) {
  var sorted = hls.slice().sort(function (a, b) { return a.start - b.start; });
  var htmlParts = [], pos = 0;
  for (var li = 0; li < lines.length; li++) {
    if (li > 0) htmlParts.push("<br>");
    var lineText = lines[li];
    var lineStart = pos, lineEnd = pos + lineText.length;
    var out = "", cur = lineStart;
    for (var i = 0; i < sorted.length; i++) {
      var h = sorted[i];
      if (h.end <= lineStart || h.start >= lineEnd) continue;
      var s = Math.max(h.start, lineStart), e = Math.min(h.end, lineEnd);
      if (s < cur) continue;
      out += escapeHtml(lineText.slice(cur - lineStart, s - lineStart));
      out += '<mark class="hl hl-' + h.color + '" data-pi="' + h.pi + '" data-start="' + h.start + '" data-end="' + h.end + '">' +
        escapeHtml(lineText.slice(s - lineStart, e - lineStart)) + '</mark>';
      cur = e;
    }
    out += escapeHtml(lineText.slice(cur - lineStart));
    htmlParts.push(out);
    pos = lineEnd;
  }
  return htmlParts.join("");
}
function paintHighlights() {
  var s = SAYEON[idx];
  var epNum = numOf(s, idx);
  var hls = getHighlights(epNum);
  var els = document.querySelectorAll("#body [data-pi]");
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    var pi = Number(el.getAttribute("data-pi"));
    var mine = hls.filter(function (h) { return h.pi === pi; });
    if (el.className === "quote") {
      el.innerHTML = renderTextWithHighlights('"' + s.quote + '"', mine);
    } else if (el.className === "phead") {
      var item = s.paragraphs[pi];
      el.innerHTML = renderTextWithHighlights(item.h, mine);
    } else {
      el.innerHTML = renderLinesWithHighlights(s.paragraphs[pi], mine);
    }
  }
  applyFind();
}
function removeHighlightAt(markEl) {
  var container = markEl.closest("[data-pi]");
  if (!container) return;
  var pi = Number(markEl.getAttribute("data-pi"));
  var start = Number(markEl.getAttribute("data-start"));
  var end = Number(markEl.getAttribute("data-end"));
  var s = SAYEON[idx];
  var epNum = numOf(s, idx);
  var hls = getHighlights(epNum).filter(function (h) {
    return !(h.pi === pi && h.start === start && h.end === end);
  });
  setHighlights(epNum, hls);
  paintHighlights();
}
var pendingHl = null;
function closestPi(node) {
  var el = node.nodeType === 3 ? node.parentElement : node;
  return el ? el.closest("[data-pi]") : null;
}
function offsetWithin(el, node, nodeOffset) {
  var r = document.createRange();
  r.selectNodeContents(el);
  r.setEnd(node, nodeOffset);
  return r.toString().length;
}
function showHlToolbar(range) {
  var rect = range.getBoundingClientRect();
  var tb = $("hlToolbar");
  tb.style.display = "flex";
  var tbWidth = tb.offsetWidth || 120;
  var tbHeight = tb.offsetHeight || 40;
  var left = rect.left + rect.width / 2 - tbWidth / 2;
  left = Math.min(Math.max(8, left), window.innerWidth - tbWidth - 8);
  var top = rect.bottom + 10;
  top = Math.min(top, window.innerHeight - tbHeight - 8);
  top = Math.max(8, top);
  tb.style.left = left + "px";
  tb.style.top = top + "px";
}
function hideHlToolbar() {
  pendingHl = null;
  if ($("hlToolbar")) $("hlToolbar").style.display = "none";
}
function applyPendingHighlight(color) {
  if (!pendingHl) return;
  var s = SAYEON[idx];
  var epNum = numOf(s, idx);
  var hls = getHighlights(epNum).filter(function (h) {
    return h.pi !== pendingHl.pi || h.end <= pendingHl.start || h.start >= pendingHl.end;
  });
  hls.push({ pi: pendingHl.pi, start: pendingHl.start, end: pendingHl.end, color: color });
  setHighlights(epNum, hls);
  hideHlToolbar();
  window.getSelection().removeAllRanges();
  paintHighlights();
}
function evaluateSelection() {
  var sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { hideHlToolbar(); return; }
  var range = sel.getRangeAt(0);
  var startEl = closestPi(range.startContainer);
  var endEl = closestPi(range.endContainer);
  var bodyEl = $("body");
  if (!startEl || startEl !== endEl || !bodyEl.contains(startEl)) { hideHlToolbar(); return; }
  var start = offsetWithin(startEl, range.startContainer, range.startOffset);
  var end = offsetWithin(startEl, range.endContainer, range.endOffset);
  if (end <= start) { hideHlToolbar(); return; }
  pendingHl = { pi: Number(startEl.getAttribute("data-pi")), start: start, end: end };
  showHlToolbar(range);
}

/* ===== 뷰어 ===== */
var TOTAL = 155;
var idx = 0;

function numOf(s, i) { return (s && s.no) ? s.no : (i + 1); }
function shortTitle(s, i) { return s.short ? s.short : (numOf(s, i) + "편"); }
function fullTitle(s, i) { return s.title || (numOf(s, i) + "편"); }

function render(keepSpeaking) {
  if (!keepSpeaking) stopSpeak();
  var s = SAYEON[idx];
  updateSpeakBtn();
  $("total").textContent = currentYear + "년 · 총 " + SAYEON.length + "개 항목";
  $("ctitle").textContent = s.title || "";
  var sub = $("csub");
  sub.innerHTML = "";
  if (s.subtitle) {
    var subs = (typeof s.subtitle === "string") ? [s.subtitle] : s.subtitle;
    for (var si = 0; si < subs.length; si++) {
      if (si > 0) sub.appendChild(document.createElement("br"));
      sub.appendChild(document.createTextNode(subs[si]));
    }
  }

  var lk = $("clink");
  if (s.link) {
    lk.href = s.link.url;
    lk.textContent = s.link.label || "영상 보기";
    lk.style.display = "inline-block";
  } else {
    lk.style.display = "none";
  }

  hideHlToolbar();
  var epNum = numOf(s, idx);
  var hls = getHighlights(epNum);
  var rc = getReadCount(epNum);
  $("readCountBtn").textContent = rc > 0 ? rc + "독" : "다 읽음";
  $("readCountBtn").classList.toggle("done", rc > 0);
  var body = $("body");
  body.innerHTML = "";

  if (!s.paragraphs || s.paragraphs.length === 0) {
    var d = document.createElement("div");
    d.className = "empty";
    d.textContent = "아직 내용이 입력되지 않았습니다.";
    body.appendChild(d);
  } else {
    for (var pi = 0; pi < s.paragraphs.length; pi++) {
      var item = s.paragraphs[pi];
      if (item && item.hr) {
        body.appendChild(document.createElement("hr")).className = "hrline";
        continue;
      }
      if (item && item.h) {
        var hd = document.createElement("div");
        hd.className = "phead";
        hd.setAttribute("data-pi", pi);
        hd.innerHTML = renderTextWithHighlights(item.h, hls.filter(function(h){ return h.pi === pi; }));
        body.appendChild(hd);
        continue;
      }
      var lines = item;
      var p = document.createElement("p");
      p.className = "para";
      p.setAttribute("data-pi", pi);
      p.innerHTML = renderLinesWithHighlights(lines, hls.filter(function(h){ return h.pi === pi; }));
      body.appendChild(p);
    }
  }

  if (s.quote) {
    var qb = document.createElement("div");
    qb.className = "quote";
    qb.setAttribute("data-pi", -1);
    qb.innerHTML = renderTextWithHighlights('"' + s.quote + '"', hls.filter(function(h){ return h.pi === -1; }));
    body.appendChild(qb);
  }

  var pv = $("prev"), nx = $("next");
  pv.disabled = (idx === 0);
  nx.disabled = (idx === SAYEON.length - 1);
  $("prevT").textContent = pv.disabled ? "" : shortTitle(SAYEON[idx - 1], idx - 1);
  $("nextT").textContent = nx.disabled ? "" : shortTitle(SAYEON[idx + 1], idx + 1);

  window.scrollTo(0, 0);
  applyFind();
}

function go(delta) {
  var n = idx + delta;
  if (n < 0 || n >= SAYEON.length) return;
  idx = n;
  render();
}

/* ===== 읽어주기 ===== */
var synth = window.speechSynthesis;
var queue = [], qi = 0, speaking = false;

if (!synth) { $("speak").disabled = true; $("warn").style.display = "block"; }

/* ===== 목소리 =====
   설정 값은 세 페이지(성령사연·월명동·말씀)가 같이 쓴다. 같은 주소라 저장소를 공유한다.
   기본은 구글 한국어 목소리(안드로이드의 '구글 여자1')를 고른다. */
var voiceName = null;   // 실제 값은 loadCfg() 가 채운다

// 'kok'(코카니어) 처럼 ko 로 시작만 하는 다른 언어가 섞이지 않게 정확히 걸러낸다
function isKorean(v) {
  if (!v || !v.lang) return false;
  var l = v.lang.toLowerCase().replace("_", "-");
  return l === "ko" || l.indexOf("ko-") === 0;
}

function koVoices() {
  if (!synth || !synth.getVoices) return [];
  return synth.getVoices().filter(isKorean);
}

function isGoogle(v) { return /google|구글/i.test(v.name) || /^ko-kr-x-/i.test(v.voiceURI || ""); }

// 구글 목소리 코드 -> 안드로이드 설정에 보이는 이름
var GOOGLE_LABEL = [
  [/x-ism|standard-a|wavenet-a/i, "구글 여자1"],
  [/x-kob|standard-b|wavenet-b/i, "구글 여자2"],
  [/x-kod|standard-c|wavenet-c/i, "구글 남자1"],
  [/x-koc|x-kof|standard-d|wavenet-d/i, "구글 남자2"]
];

function voiceLabel(v, googleIndex) {
  if (!isGoogle(v)) return v.name;
  var key = (v.voiceURI || "") + " " + v.name;
  for (var i = 0; i < GOOGLE_LABEL.length; i++) {
    if (GOOGLE_LABEL[i][0].test(key)) return GOOGLE_LABEL[i][1];
  }
  return googleIndex > 0 ? "구글 목소리 " + (googleIndex + 1) : "구글 목소리";
}

function voiceId(v) { return v.voiceURI || v.name; }

function pickVoice() {
  var vs = koVoices(), i;
  if (!vs.length) return null;
  if (voiceName) {
    for (i = 0; i < vs.length; i++) { if (voiceId(vs[i]) === voiceName) return vs[i]; }
  }
  for (i = 0; i < vs.length; i++) { if (isGoogle(vs[i])) return vs[i]; }
  return vs[0];
}

function buildVoiceOpts() {
  var box = $("voiceOpts");
  if (!box) return;
  var vs = koVoices();
  box.innerHTML = "";
  if (!vs.length) {
    var d = document.createElement("div");
    d.className = "dim";
    d.style.fontSize = "14px";
    d.textContent = "이 기기에서 쓸 수 있는 한국어 목소리가 없습니다.";
    box.appendChild(d);
    return;
  }
  var cur = pickVoice(), gi = 0;
  for (var i = 0; i < vs.length; i++) {
    var v = vs[i];
    var b = document.createElement("button");
    b.className = (cur && voiceId(v) === voiceId(cur)) ? "opt sel" : "opt";
    b.textContent = voiceLabel(v, isGoogle(v) ? gi++ : -1);
    (function (name) {
      b.onclick = function () {
        voiceName = name;
        saveSettings({ voice: name });
        buildVoiceOpts();
        previewVoice();
      };
    })(voiceId(v));
    box.appendChild(b);
  }
  if (vs.length === 1) {
    var note = document.createElement("div");
    note.className = "dim";
    note.style.cssText = "font-size:13px; line-height:1.7; flex-basis:100%; margin-top:4px;";
    note.textContent = "이 기기에서는 브라우저가 목소리를 하나만 알려 줍니다. 안드로이드 설정 → 접근성 → 음성 출력(TTS) → 기본 엔진 설정에서 목소리를 바꾸면 여기에도 적용됩니다.";
    box.appendChild(note);
  }
}

// 고른 목소리를 바로 짧게 들려준다
function previewVoice() {
  if (!synth || speaking) return;
  try {
    synth.cancel();
    var u = new SpeechSynthesisUtterance("안녕하세요. 이 목소리로 읽어 드립니다.");
    u.lang = "ko-KR";
    var v = pickVoice();
    if (v) u.voice = v;
    u.rate = cfg.rate;
    synth.speak(u);
  } catch (e) {}
}

/* ===== 듣는 동안 화면이 꺼지지 않게 =====
   화면 잠금은 탭이 보이는 동안에만 걸 수 있고, 화면이 꺼지면 저절로 풀린다.
   그래서 다시 보이게 될 때 듣는 중이면 잠금을 새로 건다. */
var wakeLock = null;
function requestWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock) return;
  try {
    navigator.wakeLock.request("screen").then(function (wl) {
      wakeLock = wl;
      wl.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  } catch (e) {}
}
function releaseWakeLock() {
  if (!wakeLock) return;
  try { wakeLock.release(); } catch (e) {}
  wakeLock = null;
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && speaking) requestWakeLock();
});

function highlight(pi) {
  var ps = document.querySelectorAll(".para");
  for (var i = 0; i < ps.length; i++) {
    var on = (Number(ps[i].getAttribute("data-pi")) === pi);
    ps[i].className = on ? "para reading" : "para";
    if (on && ps[i].scrollIntoView) {
      try { ps[i].scrollIntoView({ behavior: "smooth", block: "center" }); }
      catch (e) { ps[i].scrollIntoView(); }
    }
  }
}

var player = $("player");

/* ===== 재생 위치 막대 (듣는 중 어디서든 이어 시작) ===== */
var seekWrap = $("seekWrap"), seekRange = $("seekRange"), seekTime = $("seekTime");
var seekDragging = false;
function showSeek() { seekWrap.className = "seekwrap show"; }
function hideSeek() { seekWrap.className = "seekwrap"; }
function fmtTime(t) {
  if (!isFinite(t) || t < 0) t = 0;
  var m = Math.floor(t / 60), sec = Math.floor(t % 60);
  return m + ":" + (sec < 10 ? "0" : "") + sec;
}
function updateSeekAudio() {
  if (seekDragging) return;
  var d = player.duration;
  if (isFinite(d) && d > 0) {
    seekRange.value = Math.round((player.currentTime / d) * 1000);
    seekTime.textContent = fmtTime(player.currentTime) + " / " + fmtTime(d);
  }
}
function updateSeekQueue() {
  if (seekDragging) return;
  var total = queue.length || 1;
  seekRange.value = Math.round((qi / total) * 1000);
  seekTime.textContent = (qi + 1) + " / " + total;
}
player.addEventListener("timeupdate", updateSeekAudio);
player.addEventListener("loadedmetadata", updateSeekAudio);
seekRange.addEventListener("input", function () { seekDragging = true; });
seekRange.addEventListener("change", function () {
  seekDragging = false;
  var frac = Number(seekRange.value) / 1000;
  var s = SAYEON[idx];
  if (s && s.audio) {
    var d = player.duration;
    if (isFinite(d) && d > 0) player.currentTime = frac * d;
  } else if (queue.length) {
    var target = Math.min(queue.length - 1, Math.floor(frac * queue.length));
    qi = target;
    if (synth) synth.cancel();
    if (speaking) speakNext();
  }
});

/* ===== 잠금화면/미디어 컨트롤에 재생 정보를 알려 백그라운드 재생을 돕는다 ===== */
function updateMediaSession(playing) {
  if (!("mediaSession" in navigator)) return;
  try {
    var s = SAYEON[idx];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title || "",
      artist: "2026년 성령 사연"
    });
    navigator.mediaSession.playbackState = playing ? "playing" : "paused";
    navigator.mediaSession.setActionHandler("play", function () { if (!speaking) startSpeak(); });
    navigator.mediaSession.setActionHandler("pause", function () { if (speaking) stopSpeak(); });
    navigator.mediaSession.setActionHandler("previoustrack", function () {
      var was = speaking; go(-1); if (was) startSpeak();
    });
    navigator.mediaSession.setActionHandler("nexttrack", function () {
      var was = speaking; go(1); if (was) startSpeak();
    });
  } catch (e) {}
}

function updateSpeakBtn() {
  var s = SAYEON[idx];
  var human = !!(s && s.audio);
  var btn = $("speak");
  btn.className = "speakbtn" + (human ? " human" : "") + (speaking ? " on" : "");
  btn.textContent = speaking ? "■ 정지" : ((human ? "🎙️" : "🤖") + " 듣기");
}

function advanceOrStop() {
  if (speaking && cfg.autoMode === "next" && idx < SAYEON.length - 1) {
    idx++;
    render(true);
    setTimeout(function () { if (speaking) startSpeak(); }, 1000);
  } else if (speaking && cfg.autoMode === "prev" && idx > 0) {
    idx--;
    render(true);
    setTimeout(function () { if (speaking) startSpeak(); }, 1000);
  } else {
    stopSpeak();
  }
}

/* ===== 육성 낭독에 맞춰 문단 짚어 주기 =====
   녹음마다 '몇 초에 어느 문단을 읽는지'를 audio/sync.json 에 미리 넣어 두었다.
   (녹음을 받아쓴 뒤 원고에 시간을 맞춰 붙여 만든 것이다)
   재생 위치를 보고 지금 읽고 있는 문단을 짚어 주며 따라 내려간다. */
var SYNC = null, syncTimes = null, syncPi = -1;

function loadSync() {
  if (SYNC !== null) return;
  SYNC = {};
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "audio/sync.json", true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    try { SYNC = JSON.parse(xhr.responseText) || {}; } catch (e) { SYNC = {}; }
  };
  try { xhr.send(null); } catch (e) {}
}

function startSyncFollow(s) {
  syncTimes = null;
  syncPi = -1;
}

player.ontimeupdate = function () {
  if (!speaking) return;
  // sync.json 이 늦게 도착할 수 있으므로, 아직 없으면 재생 중에도 다시 찾는다
  if (!syncTimes && SYNC) syncTimes = SYNC[String(numOf(SAYEON[idx], idx))] || null;
  if (!syncTimes) return;
  var t = player.currentTime, pi = -1;
  for (var i = 0; i < syncTimes.length; i++) {
    if (t + 0.15 >= syncTimes[i]) pi = i; else break;
  }
  if (pi >= 0 && pi !== syncPi) { syncPi = pi; highlight(pi); }
};

player.onended = advanceOrStop;
player.onerror = advanceOrStop;

function speakNext() {
  if (qi >= queue.length) { advanceOrStop(); return; }
  var item = queue[qi];
  var u = new SpeechSynthesisUtterance(item.text);
  u.lang = "ko-KR";
  var v = pickVoice();
  if (v) u.voice = v;
  u.rate = cfg.rate;
  u.onstart = function () { highlight(item.pi); updateSeekQueue(); };
  u.onend = function () { qi++; if (speaking) speakNext(); };
  u.onerror = function () { qi++; if (speaking) speakNext(); };
  synth.speak(u);
}

// 육성 녹음이 있는 편도, 이어 들을 때 몇 편인지 알 수 있게
// 제목을 짧게 TTS로 먼저 읽고 나서 실제 녹음을 재생한다
function speakTitleThenPlayAudio(s) {
  var silentAnchor = document.getElementById("silentAnchor");
  if (!synth) { playAudioNow(s); return; }
  var u = new SpeechSynthesisUtterance(s.title);
  u.lang = "ko-KR";
  var v = pickVoice();
  if (v) u.voice = v;
  u.rate = cfg.rate;
  u.onend = function () { if (speaking) playAudioNow(s); };
  u.onerror = function () { if (speaking) playAudioNow(s); };
  synth.cancel();
  synth.speak(u);
}
function playAudioNow(s) {
  var silentAnchor = document.getElementById("silentAnchor");
  if (silentAnchor) silentAnchor.pause();
  startSyncFollow(s);
  player.src = s.audio;
  player.currentTime = 0;
  player.play();
}

function startSpeak() {
  var s = SAYEON[idx];
  speaking = true;
  requestWakeLock();
  updateSpeakBtn();
  showSeek();
  seekTime.textContent = "";
  updateMediaSession(true);

  var silentAnchor = document.getElementById("silentAnchor");
  if (s.audio) {
    // 육성 낭독은 녹음 자체가 "성령 사연 157" 하고 시작하므로 제목을 또 읽지 않는다
    playAudioNow(s);
    return;
  }
  if (silentAnchor) silentAnchor.play().catch(function () {});

  if (!s.paragraphs || !s.paragraphs.length) { speaking = false; return; }
  // 이어 들을 때 몇 편인지 구분되도록 제목을 먼저 읽는다
  queue = [{ pi: -2, text: s.title }];
  for (var i = 0; i < s.paragraphs.length; i++) {
    var it = s.paragraphs[i];
    if (it && it.hr) continue;
    queue.push({ pi: i, text: (it && it.h) ? it.h : it.join(" ") });
  }
  if (s.quote) queue.push({ pi: -1, text: s.quote });
  qi = 0;
  synth.cancel();
  speakNext();
}

function stopSpeak() {
  speaking = false;
  syncTimes = null; syncPi = -1;
  releaseWakeLock();
  if (synth) synth.cancel();
  player.pause();
  var silentAnchorS = document.getElementById("silentAnchor");
  if (silentAnchorS) silentAnchorS.pause();
  queue = []; qi = 0;
  updateSpeakBtn();
  hideSeek();
  updateMediaSession(false);
  var ps = document.querySelectorAll(".para");
  for (var i = 0; i < ps.length; i++) { ps[i].className = "para"; }
}

/* ===== 검색 ===== */
/* 어느 페이지에서든 세 카테고리를 모두 찾는다 */
var SEARCH_SOURCES = [
  { label: "성령사연 2026", kind: "sayeon", url: "sayeon.json", base: "", year: "2026",
    local: function () { return currentYear === "2026" ? SAYEON : null; } },
  { label: "성령사연 2025", kind: "sayeon", url: "sayeon2025.json", base: "", year: "2025",
    local: function () { return currentYear === "2025" ? SAYEON : null; } },
  { label: "월명동사연", kind: "stones", url: "stones/stones-search.json", base: "stones/" },
  { label: "말씀", kind: "sayeon", url: "malsseum/malsseum.json", base: "malsseum/" }
];

// 검색 결과를 눌렀을 때: 같은 페이지면 바로 넘기고, 다른 페이지면 주소로 넘어간다
function gotoHit(src, h) {
  var kw = $("q").value.replace(/^\s+|\s+$/g, "");
  if (src.base === "" && src.year === currentYear) {
    idx = h.idx; findQuery = kw; closeAll(); render(); return;
  }
  if (src.base === "") {           // 같은 성령사연인데 해가 다르다
    pendingJumpNo = h.item.no;
    findQuery = kw;
    closeAll();
    switchYear(src.year);
    return;
  }
  location.href = src.base + "#n=" + encodeURIComponent(h.item.no) +
    (src.year ? "&y=" + src.year : "") + "&q=" + encodeURIComponent(kw);
}


/* 다른 카테고리의 검색 결과에서 넘어왔을 때 (#n=22&y=2025) 그 편을 펼쳐 준다 */
function hashParam(name) {
  var m = (location.hash || "").match(new RegExp("[#&]" + name + "=([^&]*)"));
  return m ? decodeURIComponent(m[1]) : null;
}
var pendingJumpNo = null;   // 연도를 바꿔 다시 읽은 뒤 펼칠 편 번호
function jumpToNo(no) {
  for (var i = 0; i < SAYEON.length; i++) {
    if (String(SAYEON[i].no) === String(no)) { idx = i; return true; }
  }
  return false;
}
function jumpToHashItem() {
  var q = hashParam("q");
  if (q) findQuery = q;
  var no = hashParam("n");
  if (no === null) return false;
  for (var i = 0; i < SAYEON.length; i++) {
    if (String(SAYEON[i].no) === String(no)) { idx = i; return true; }
  }
  return false;
}

var FIND_BOX = "body";   // 본문이 들어가는 칸
/* ===== 찾은 낱말로 이동 =====
   검색 결과를 눌러 들어오면 그 낱말을 노랗게 칠하고 첫 자리로 옮겨 준다.
   여러 곳에 나오면 아래 막대의 ▲▼ 로 옮겨 다닐 수 있다.
   칠하는 것은 글자를 늘리지 않으므로, 직접 칠한 하이라이트의 위치 계산에는 영향이 없다. */
var findQuery = null, findMarks = [], findAt = -1;

function clearFind() {
  var box = document.getElementById(FIND_BOX);
  if (box) {
    var ms = box.querySelectorAll("mark.find");
    for (var i = ms.length - 1; i >= 0; i--) {
      var m = ms[i], p = m.parentNode;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
      p.normalize();
    }
  }
  findMarks = []; findAt = -1;
  var bar = document.getElementById("findBar");
  if (bar) bar.style.display = "none";
}

function applyFind() {
  clearFind();
  if (!findQuery) return;
  var box = document.getElementById(FIND_BOX);
  if (!box) return;
  var needle = findQuery.replace(/\s+/g, "");
  if (!needle) return;

  // 글자만 이어 붙이고, 각 글자가 어느 텍스트 노드의 몇 번째인지 적어 둔다
  var walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, null);
  var s = "", pos = [], node, i;
  while ((node = walker.nextNode())) {
    var t = node.nodeValue;
    for (i = 0; i < t.length; i++) {
      var ch = t.charAt(i);
      if (ch === " " || ch === "\n" || ch === "\t" || ch === "\r") continue;
      s += ch; pos.push({ node: node, at: i });
    }
  }

  // 찾은 자리마다, 텍스트 노드별 구간으로 쪼개 둔다
  var groups = [], from = 0, hit;
  while ((hit = s.indexOf(needle, from)) >= 0) {
    var piece = [], cur = null;
    for (var k = hit; k < hit + needle.length; k++) {
      var p = pos[k];
      if (cur && cur.node === p.node && p.at === cur.end) cur.end = p.at + 1;
      else { cur = { node: p.node, start: p.at, end: p.at + 1 }; piece.push(cur); }
    }
    groups.push(piece);
    from = hit + needle.length;
  }
  if (!groups.length) return;

  // 뒤에서부터 칠해야 앞쪽 글자 위치가 밀리지 않는다
  for (var g = groups.length - 1; g >= 0; g--) {
    var marks = [];
    for (var q = groups[g].length - 1; q >= 0; q--) {
      var seg = groups[g][q];
      var tail = seg.node.splitText(seg.start);
      if (seg.end - seg.start < tail.nodeValue.length) tail.splitText(seg.end - seg.start);
      var mk = document.createElement("mark");
      mk.className = "find";
      tail.parentNode.insertBefore(mk, tail);
      mk.appendChild(tail);
      marks.unshift(mk);
    }
    findMarks.unshift(marks);
  }

  var bar = document.getElementById("findBar");
  if (bar) {
    bar.style.display = "flex";
    document.getElementById("findWord").textContent = findQuery;
  }
  gotoFind(0);
}

function gotoFind(n) {
  if (!findMarks.length) return;
  if (n < 0) n = findMarks.length - 1;
  if (n >= findMarks.length) n = 0;
  findAt = n;
  for (var i = 0; i < findMarks.length; i++) {
    for (var j = 0; j < findMarks[i].length; j++) {
      findMarks[i][j].className = (i === n) ? "find cur" : "find";
    }
  }
  var el = findMarks[n][0];
  try { el.scrollIntoView({ behavior: "smooth", block: "center" }); }
  catch (e) { el.scrollIntoView(); }
  var c = document.getElementById("findCount");
  if (c) c.textContent = (n + 1) + " / " + findMarks.length;
}

/* ===== 통합 검색 =====
   성령사연(2026·2025) · 월명동 · 말씀을 한 번에 찾는다.
   각 카테고리의 원본 파일을 그때그때 받아서 찾으므로, 사연을 더 넣어도 여기는 손댈 것이 없다.
   월명동만은 사진이 통째로 들어 있어 문서가 10MB 라, 글자만 뽑아 둔
   stones/stones-search.json 을 쓴다. (월명동 내용을 고치면 이 파일도 다시 만들어야 한다) */
var SEARCH_CACHE = {};

// 띄어쓰기·줄바꿈을 무시하고 찾기 위해, 공백을 뺀 문자열과 원문 위치를 함께 만든다
function squash(t) {
  var s = "", map = [], i, ch;
  for (i = 0; i < t.length; i++) {
    ch = t.charAt(i);
    if (ch === " " || ch === "\n" || ch === "\t" || ch === "\r") continue;
    s += ch; map.push(i);
  }
  return { s: s, map: map };
}

// 한 항목의 본문을 통째 글자로 만든다
function itemText(item, kind) {
  if (kind === "stones") return item.text || "";
  var out = [], ps = item.paragraphs || [], i, it, lines;
  for (i = 0; i < ps.length; i++) {
    it = ps[i];
    if (!it || it.hr) continue;
    if (it.h) { out.push(it.h); continue; }
    lines = it.p ? it.p : it;
    if (lines && lines.join) out.push(lines.join(" "));
  }
  if (item.quote) out.push(item.quote);
  return out.join("\n");
}

function itemTitle(item, kind) {
  if (kind === "stones") return item.no + ". " + item.title;
  return item.title || (item.no + "편");
}

function fetchSource(src, done) {
  // 지금 페이지에 이미 올라와 있는 자료면 다시 받지 않는다
  if (src.local) {
    var have = src.local();
    if (have) { done(have); return; }
  }
  if (SEARCH_CACHE[src.url]) { done(SEARCH_CACHE[src.url]); return; }
  var xhr = new XMLHttpRequest();
  xhr.open("GET", src.url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var list = [];
    try { list = JSON.parse(xhr.responseText) || []; } catch (e) { list = []; }
    SEARCH_CACHE[src.url] = list;
    done(list);
  };
  xhr.onerror = function () { done([]); };
  try { xhr.send(null); } catch (e) { done([]); }
}

function runSearch() {
  var kw = $("q").value.replace(/^\s+|\s+$/g, "");
  var box = $("results");
  box.innerHTML = "";
  if (!kw) return;

  var needle = squash(kw).s;
  if (!needle) return;

  var pending = SEARCH_SOURCES.length, total = 0, blocks = [];
  var note = document.createElement("div");
  note.className = "empty";
  note.textContent = "찾는 중…";
  box.appendChild(note);

  SEARCH_SOURCES.forEach(function (src, si) {
    fetchSource(src, function (list) {
      var hits = [];
      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var text = itemText(item, src.kind);
        var title = itemTitle(item, src.kind);
        var sq = squash(text);
        var at = sq.s.indexOf(needle);
        var inTitle = squash(title).s.indexOf(needle) >= 0;
        if (at < 0 && !inTitle) continue;
        var snip = "";
        if (at >= 0) {
          var pos = sq.map[at];
          var from = Math.max(0, pos - 22);
          snip = (from > 0 ? "…" : "") +
            text.substr(from, 78).replace(/\s+/g, " ") + "…";
        }
        hits.push({ item: item, idx: i, title: title, snip: snip });
      }
      blocks[si] = { src: src, hits: hits };
      total += hits.length;
      if (--pending === 0) paintResults(blocks, total);
    });
  });
}

function paintResults(blocks, total) {
  var box = $("results");
  box.innerHTML = "";
  if (!total) {
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "검색 결과가 없습니다.";
    box.appendChild(e);
    return;
  }
  var sum = document.createElement("div");
  sum.className = "searchsum";
  sum.textContent = "모두 " + total + "곳에서 찾았습니다.";
  box.appendChild(sum);

  blocks.forEach(function (blk) {
    if (!blk || !blk.hits.length) return;
    var head = document.createElement("div");
    head.className = "searchcat";
    head.textContent = blk.src.label + " (" + blk.hits.length + ")";
    box.appendChild(head);

    blk.hits.forEach(function (h) {
      var btn = document.createElement("button");
      btn.className = "hit";
      var b = document.createElement("b");
      b.textContent = h.title;
      btn.appendChild(b);
      if (h.snip) {
        var s = document.createElement("span");
        s.className = "snip";
        s.textContent = h.snip;
        btn.appendChild(s);
      }
      btn.onclick = function () { gotoHit(blk.src, h); };
      box.appendChild(btn);
    });
  });
}

function buildList() {
  var box = $("listresults");
  box.innerHTML = "";
  for (var i = 0; i < SAYEON.length; i++) {
    var btn = document.createElement("button");
    btn.className = "hit";
    btn.textContent = fullTitle(SAYEON[i], i);
    (function (t) { btn.onclick = function () { idx = t; closeAll(); render(); }; })(i);
    box.appendChild(btn);
  }
}

$("lhMinus").onclick = function () { cfg.lh = Math.max(1.2, cfg.lh - 0.15); applyCfg(); };

$("rateMinus").onclick = function () { cfg.rate = Math.max(0.5, Math.round((cfg.rate - 0.05) * 100) / 100); applyCfg(); };

/* ===== 스와이프로 이전/다음 이동 ===== */
(function () {
  var startX = 0, startY = 0, tracking = false;
  var THRESHOLD = 60;

  function anyModalOpen() {
    return $("settings").className.indexOf("open") >= 0 ||
      $("search").className.indexOf("open") >= 0 ||
      $("listmodal").className.indexOf("open") >= 0;
  }

  $("wrap").addEventListener("touchstart", function (e) {
    if (anyModalOpen() || !e.touches.length) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  $("wrap").addEventListener("touchend", function (e) {
    if (!tracking || !e.changedTouches.length) return;
    tracking = false;
    var sel = window.getSelection();
    if (sel && !sel.isCollapsed) return; // 텍스트를 드래그해서 고르는 중이면 페이지 넘김을 막는다
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    if (dx < 0) { go(1); } else { go(-1); }
  }, { passive: true });
})();

if (synth && typeof synth.onvoiceschanged !== "undefined") {
  synth.onvoiceschanged = function () { pickVoice(); buildVoiceOpts(); };
}
// 안드로이드에서는 목록이 늦게 채워지고 onvoiceschanged 가 안 오는 기기도 있어 몇 번 더 확인한다
[400, 1200, 3000].forEach(function (ms) { setTimeout(buildVoiceOpts, ms); });

function showLoadError(msg) {
  $("total").textContent = "";
  $("ctitle").textContent = "불러오지 못했습니다";
  var body = $("body");
  body.innerHTML = "";
  var d = document.createElement("div");
  d.className = "empty";
  var lines = [
    "사연 파일(sayeon.json)을 읽지 못했습니다.",
    msg,
    "index.html 과 sayeon.json 이 같은 폴더에 있어야 하고,",
    "웹 주소(http/https)로 열어야 동작합니다."
  ];
  for (var i = 0; i < lines.length; i++) {
    if (i > 0) d.appendChild(document.createElement("br"));
    d.appendChild(document.createTextNode(lines[i]));
  }
  body.appendChild(d);
  $("prev").disabled = true;
  $("next").disabled = true;
  $("speak").disabled = true;
  $("readCountBtn").disabled = true;
  $("openlist").disabled = true;
  $("navlist").disabled = true;
  $("opensearch").disabled = true;
}

function switchYear(year) {
  if (year === currentYear || !YEAR_URLS[year]) return;
  stopSpeak();
  currentYear = year;
  DATA_URL = YEAR_URLS[year];
  $("yearBtn2026").className = "tab" + (year === "2026" ? " on" : "");
  $("yearBtn2025").className = "tab" + (year === "2025" ? " on" : "");
  $("pageHead").textContent = year + "년 성령 사연";
  document.title = year + "년 성령 사연";
  SAYEON = [];
  loadData();
}
$("yearBtn2026").onclick = function () { switchYear("2026"); };
$("yearBtn2025").onclick = function () { switchYear("2025"); };

function loadData() {
  $("total").textContent = "불러오는 중…";
  var xhr = new XMLHttpRequest();
  xhr.open("GET", DATA_URL + "?v=" + (new Date()).getTime(), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var ok = (xhr.status === 200 || xhr.status === 0);
    if (!ok || !xhr.responseText) { showLoadError("(응답 코드 " + xhr.status + ")"); return; }
    try {
      SAYEON = JSON.parse(xhr.responseText);
    } catch (e) {
      showLoadError("(내용 형식 오류)");
      return;
    }
    if (!SAYEON.length) { showLoadError("(내용이 비어 있음)"); return; }
    idx = SAYEON.length - 1;
    if (pendingJumpNo !== null) { jumpToNo(pendingJumpNo); pendingJumpNo = null; }
    else jumpToHashItem();
    buildList();
    render();
  };
  xhr.onerror = function () { showLoadError("(연결 실패)"); };
  try { xhr.send(null); } catch (e) { showLoadError("(파일을 직접 열면 브라우저가 막습니다)"); }
}

/* ===== 잠금화면 ===== */

  if ($("pw").value === PASSCODE) {
    $("lock").className = "lock hidden";

    $("pw").value = "";
    $("pw").focus();
  }
}
$("pwok").onclick = tryUnlock;
$("pw").onkeydown = function (e) { if (e.keyCode === 13) tryUnlock(); };

applyCfg();

try { unlocked = localStorage.getItem("sayeon_unlocked") === "1"; } catch (e) {}
if (unlocked) {
  $("lock").className = "lock hidden";
  loadData();
} else {
  $("pw").focus();
}
