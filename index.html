<!DOCTYPE html>
<!-- 성령 사연 뷰어 — 사연 154편을 카드로 넘겨 보며 읽고 듣고, 글꼴·여백·테마를 설정할 수 있는 단일 HTML 문서 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 성령 사연</title>
<style>
  :root {
    --bg: #1b2018;
    --text: #e9ece4;
    --green: #93c4a5;
    --gold: #e6d5a0;
    --panel: rgba(140,150,130,.14);
    --size: 16px;
    --lh: 1.95;
    --pad: 18px;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
    padding-bottom: 60px;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 22px var(--pad) 40px; }
  .dim { opacity: .6; }

  h1.head { font-size: 30px; font-weight: 700; margin: 0 0 16px; letter-spacing: -.01em; }

  .topbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .topbtn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); color: var(--text); border: 0;
    border-radius: 999px; padding: 10px 18px;
    font-size: 15px; font-family: inherit; cursor: pointer; min-height: 44px;
  }

  .total { opacity: .6; font-size: 15px; margin: 16px 0 10px; }
  hr.sep { border: 0; border-top: 1px solid; opacity: .18; margin: 0 0 22px; }

  .card-head {
    background: var(--green); color: #14180f;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 14px 16px; border-radius: 4px;
  }
  .card-head .t { font-size: 21px; font-weight: 600; }
  .speakbtn {
    background: rgba(20,24,15,.14); color: #14180f; border: 0;
    border-radius: 999px; padding: 8px 14px; font-size: 15px;
    font-family: inherit; cursor: pointer; white-space: nowrap; min-height: 40px;
  }
  .speakbtn.on { background: #14180f; color: var(--green); }
  .card-body { padding: 20px 2px 24px; }
  .sub { opacity: .6; font-style: italic; font-size: 15px; margin-bottom: 14px; line-height: 1.7; }
  .linkbtn {
    display: inline-block; background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 11px 16px; margin-bottom: 18px;
    font-size: 15px; text-decoration: none;
  }

  .para { font-size: var(--size); line-height: var(--lh); margin: 0 0 1.5em; white-space: pre-wrap; }
  .phead {
    font-size: var(--size); font-weight: 700; color: var(--green);
    margin: 0 0 1em; line-height: var(--lh);
  }
  .hrline { border: 0; border-top: 1px solid; opacity: .2; margin: 6px 0 22px; }
  .para.reading { background: rgba(147,196,165,.28); border-radius: 4px; }
  .empty { opacity: .6; font-size: 15px; line-height: 2; text-align: center; padding: 30px 0; }

  .quote {
    background: var(--panel); border-radius: 8px;
    padding: 20px 18px; margin: 26px 0 6px;
    color: var(--text); font-weight: 700; text-align: center;
    font-size: var(--size); line-height: var(--lh);
  }

  .nav { display: flex; gap: 12px; margin-top: 26px; }
  .navbtn {
    flex: 1; min-height: 78px; background: var(--panel); border: 0;
    border-radius: 8px; padding: 12px 14px; color: var(--text);
    font-family: inherit; cursor: pointer;
  }
  .navbtn .k { display: block; opacity: .6; font-size: 14px; margin-bottom: 4px; }
  .navbtn .v { display: block; font-size: 17px; word-break: keep-all; }
  .navbtn.left { text-align: left; }
  .navbtn.right { text-align: right; }
  .navbtn.mid { flex: 0 0 84px; text-align: center; font-size: 15px; }
  .navbtn:disabled { opacity: .3; cursor: default; }

  footer { opacity: .6; font-size: 14px; text-align: center; margin-top: 30px; }
  .warn { color: #d8b45f; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

  /* 공통 모달 */
  .modal {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    background: var(--bg); z-index: 30; display: none;
    padding: 18px 16px 40px; overflow-y: auto; color: var(--text);
  }
  .modal.open { display: block; }
  .modal .inner { max-width: 780px; margin: 0 auto; }
  .modal .top { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
  .modal .top h2 { font-size: 20px; margin: 0; flex: 1; }
  .closebtn {
    background: var(--green); color: #14180f; border: 0; border-radius: 8px;
    padding: 0 16px; font-size: 16px; cursor: pointer; min-height: 46px; font-family: inherit;
  }

  /* 설정 */
  .set { margin-bottom: 22px; }
  .set > .name { font-size: 15px; opacity: .7; margin-bottom: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .opt {
    background: var(--panel); color: var(--text); border: 0; border-radius: 8px;
    padding: 10px 14px; font-size: 15px; font-family: inherit; cursor: pointer; min-height: 44px;
  }
  .opt.sel { background: var(--green); color: #14180f; font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .rnd {
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--panel); color: var(--text); font-size: 20px; cursor: pointer;
  }
  .val { color: var(--text); font-weight: 700; font-size: 16px; min-width: 62px; text-align: center; }
  .colorrow { display: flex; align-items: center; gap: 12px; }
  .colorrow input[type=color] {
    width: 62px; height: 44px; border: 0; background: var(--panel);
    border-radius: 8px; padding: 4px; cursor: pointer;
  }
  .colorrow .hex { font-size: 15px; opacity: .7; }

  /* 검색 */
  #q {
    flex: 1; background: var(--panel); color: var(--text); border: 0;
    border-radius: 8px; padding: 12px 14px; font-size: 16px;
    font-family: inherit; min-height: 46px;
  }
  .hit {
    display: block; width: 100%; text-align: left; background: var(--panel);
    border: 0; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
    color: var(--text); font-family: inherit; font-size: 15px; cursor: pointer;
  }
  .hit b { color: var(--green); }
  .hit .snip { display: block; opacity: .6; font-size: 14px; margin-top: 4px; line-height: 1.6; }

  /* 잠금화면 */
  .lock {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .lock.hidden { display: none; }
  .lockbox { width: 100%; max-width: 300px; text-align: center; }
  .locktitle { font-size: 18px; margin-bottom: 18px; }
  .lockbox input {
    width: 100%; background: var(--panel); color: var(--text); border: 0;
    border-radius: 8px; padding: 14px; font-size: 22px; text-align: center;
    letter-spacing: .4em; font-family: inherit; margin-bottom: 12px;
  }
  .lockbtn {
    width: 100%; background: var(--green); color: #14180f; border: 0;
    border-radius: 8px; padding: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; min-height: 46px;
  }
  .lockwarn { color: #d8837f; font-size: 14px; margin-top: 12px; display: none; }
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lockbox">
    <div class="locktitle">비밀번호를 입력하세요</div>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button class="lockbtn" id="pwok">확인</button>
    <div class="lockwarn" id="pwwarn">비밀번호가 틀렸습니다.</div>
  </div>
</div>

<div class="wrap">
  <h1 class="head">2026년 성령 사연</h1>
  <div class="topbar">
    <button class="topbtn" id="openlist">📋 목록</button>
    <button class="topbtn" id="opensettings">⚙ 설정</button>
    <button class="topbtn" id="opensearch">🔍 검색</button>
  </div>

  <div class="total" id="total"></div>
  <hr class="sep">

  <div class="card">
    <div class="card-head">
      <div class="t"><span id="ctitle"></span></div>
      <button class="speakbtn" id="speak">🔊 읽어주기</button>
    </div>
    <div class="card-body">
      <div class="sub" id="csub"></div>
      <a class="linkbtn" id="clink" target="_blank" rel="noopener" style="display:none"></a>
      <div id="body"></div>
    </div>
  </div>

  <div class="nav">
    <button class="navbtn left" id="prev"><span class="k">이전</span><span class="v" id="prevT"></span></button>
    <button class="navbtn mid" id="navlist">목록</button>
    <button class="navbtn right" id="next"><span class="k">다음</span><span class="v" id="nextT"></span></button>
  </div>

  <footer>성령의 사연 자료실</footer>
  <div class="warn" id="warn">이 브라우저에서는 읽어주기를 지원하지 않습니다.</div>
</div>

<audio id="player"></audio>

<!-- 목록 -->
<div class="modal" id="listmodal">
  <div class="inner">
    <div class="top">
      <h2>목록</h2>
      <button class="closebtn" id="closelist">닫기</button>
    </div>
    <div id="listresults"></div>
  </div>
</div>

<!-- 설정 -->
<div class="modal" id="settings">
  <div class="inner">
    <div class="top">
      <h2>설정</h2>
      <button class="closebtn" id="closeset">닫기</button>
    </div>

    <div class="set">
      <div class="name">읽기</div>
      <div class="opts" id="autoOpts">
        <button class="opt">다음페이지 자동읽기</button>
        <button class="opt">현재페이지만 읽기</button>
      </div>
    </div>

    <div class="set">
      <div class="name">글자 크기</div>
      <div class="stepper">
        <button class="rnd" id="fsMinus">−</button>
        <span class="val" id="fsVal">16px</span>
        <button class="rnd" id="fsPlus">+</button>
      </div>
    </div>

    <div class="set">
      <div class="name">글자체</div>
      <div class="opts" id="fontOpts"></div>
    </div>

    <div class="set">
      <div class="name">줄 간격</div>
      <div class="stepper">
        <button class="rnd" id="lhMinus">−</button>
        <span class="val" id="lhVal">1.95</span>
        <button class="rnd" id="lhPlus">+</button>
      </div>
    </div>

    <div class="set">
      <div class="name">좌우 여백</div>
      <div class="stepper">
        <button class="rnd" id="padMinus">−</button>
        <span class="val" id="padVal">18px</span>
        <button class="rnd" id="padPlus">+</button>
      </div>
    </div>

    <div class="set">
      <div class="name">테마</div>
      <div class="opts" id="themeOpts"></div>
    </div>

    <div class="set">
      <div class="name">글자색</div>
      <div class="colorrow">
        <input type="color" id="cText" value="#e9ece4">
        <span class="hex" id="cTextHex">#e9ece4</span>
      </div>
    </div>

    <div class="set">
      <div class="name">배경색</div>
      <div class="colorrow">
        <input type="color" id="cBg" value="#1b2018">
        <span class="hex" id="cBgHex">#1b2018</span>
      </div>
    </div>

    <div class="opts">
      <button class="opt" id="resetAll">기본값으로</button>
    </div>
  </div>
</div>

<!-- 검색 -->
<div class="modal" id="search">
  <div class="inner">
    <div class="top">
      <input id="q" type="search" placeholder="사연 내용 검색">
      <button class="closebtn" id="closeq">닫기</button>
    </div>
    <div id="results"></div>
  </div>
</div>

<script>
/* ===== 사연 데이터 =====
   내용은 같은 폴더의 sayeon.json 파일에 들어 있습니다.
   편을 추가하려면 sayeon.json 만 고치면 됩니다. 이 파일은 건드릴 필요 없습니다.
   형식:
   {
     "no": 155,
     "title": "성령 사연 155",
     "subtitle": "(성령님 말씀)",
     "paragraphs": [
       ["한 문단의 첫 줄", "둘째 줄"],
       { "h": "<소제목>" },
       { "hr": true },
       ["다음 문단"]
     ],
     "quote": "강조 박스에 넣을 문장 (없으면 생략)",
     "link": { "label": "영상 보기", "url": "https://..." }
   }
*/
var SAYEON = [];
var DATA_URL = "sayeon.json";

/* ===== 설정 ===== */
var FONTS = [
  { k: "고딕", v: '"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' },
  { k: "명조", v: '"Nanum Myeongjo", "Batang", "AppleMyungjo", serif' },
  { k: "돋움", v: '"Dotum", "Apple SD Gothic Neo", sans-serif' },
  { k: "굴림", v: '"Gulim", "Apple SD Gothic Neo", sans-serif' }
];
var THEMES = [
  { k: "어두운 초록", bg: "#1b2018", text: "#e9ece4" },
  { k: "검정", bg: "#000000", text: "#e6e6e6" },
  { k: "남색", bg: "#0b1a3a", text: "#eaf1ff" },
  { k: "세피아", bg: "#f3e9d2", text: "#3a2f1b" },
  { k: "흰색", bg: "#ffffff", text: "#1a1a1a" }
];
var DEF = { size: 16, lh: 1.95, pad: 18, font: 0, bg: "#1b2018", text: "#e9ece4", autoNext: true };
var cfg = { size: DEF.size, lh: DEF.lh, pad: DEF.pad, font: DEF.font, bg: DEF.bg, text: DEF.text, autoNext: DEF.autoNext };

function $(id) { return document.getElementById(id); }
function setVar(n, v) { document.documentElement.style.setProperty(n, v); }

function applyCfg() {
  setVar("--size", cfg.size + "px");
  setVar("--lh", String(cfg.lh));
  setVar("--pad", cfg.pad + "px");
  setVar("--font", FONTS[cfg.font].v);
  setVar("--bg", cfg.bg);
  setVar("--text", cfg.text);
  $("fsVal").textContent = cfg.size + "px";
  $("lhVal").textContent = cfg.lh.toFixed(2);
  $("padVal").textContent = cfg.pad + "px";
  $("cText").value = cfg.text;
  $("cBg").value = cfg.bg;
  $("cTextHex").textContent = cfg.text;
  $("cBgHex").textContent = cfg.bg;
  markSel("fontOpts", cfg.font);
  markSel("themeOpts", themeIndex());
  markSel("autoOpts", cfg.autoNext ? 0 : 1);
}

function themeIndex() {
  for (var i = 0; i < THEMES.length; i++) {
    if (THEMES[i].bg === cfg.bg && THEMES[i].text === cfg.text) return i;
  }
  return -1;
}

function markSel(boxId, sel) {
  var bs = $(boxId).getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].className = (i === sel) ? "opt sel" : "opt";
  }
}

function buildOpts() {
  var i, b;
  for (i = 0; i < FONTS.length; i++) {
    b = document.createElement("button");
    b.className = "opt";
    b.textContent = FONTS[i].k;
    b.style.fontFamily = FONTS[i].v;
    (function (n) { b.onclick = function () { cfg.font = n; applyCfg(); }; })(i);
    $("fontOpts").appendChild(b);
  }
  for (i = 0; i < THEMES.length; i++) {
    b = document.createElement("button");
    b.className = "opt";
    b.textContent = THEMES[i].k;
    (function (n) {
      b.onclick = function () { cfg.bg = THEMES[n].bg; cfg.text = THEMES[n].text; applyCfg(); };
    })(i);
    $("themeOpts").appendChild(b);
  }
}

/* ===== 뷰어 ===== */
var TOTAL = 154;
var idx = 0;

function numOf(s, i) { return (s && s.no) ? s.no : (i + 1); }
function shortTitle(s, i) { return s.short ? s.short : (numOf(s, i) + "편"); }
function fullTitle(s, i) { return s.title || (numOf(s, i) + "편"); }

function render(keepSpeaking) {
  if (!keepSpeaking) stopSpeak();
  var s = SAYEON[idx];
  $("total").textContent = "총 " + TOTAL + "개 항목 (현재 " + SAYEON.length + "개 수록)";
  $("ctitle").textContent = s.title || "";
  var sub = $("csub");
  sub.innerHTML = "";
  if (s.subtitle) {
    var subs = (typeof s.subtitle === "string") ? [s.subtitle] : s.subtitle;
    for (var si = 0; si < subs.length; si++) {
      if (si > 0) sub.appendChild(document.createElement("br"));
      sub.appendChild(document.createTextNode(subs[si]));
    }
  }

  var lk = $("clink");
  if (s.link) {
    lk.href = s.link.url;
    lk.textContent = s.link.label || "영상 보기";
    lk.style.display = "inline-block";
  } else {
    lk.style.display = "none";
  }

  var body = $("body");
  body.innerHTML = "";

  if (!s.paragraphs || s.paragraphs.length === 0) {
    var d = document.createElement("div");
    d.className = "empty";
    d.textContent = "아직 내용이 입력되지 않았습니다.";
    body.appendChild(d);
  } else {
    for (var pi = 0; pi < s.paragraphs.length; pi++) {
      var item = s.paragraphs[pi];
      if (item && item.hr) {
        body.appendChild(document.createElement("hr")).className = "hrline";
        continue;
      }
      if (item && item.h) {
        var hd = document.createElement("div");
        hd.className = "phead";
        hd.setAttribute("data-pi", pi);
        hd.appendChild(document.createTextNode(item.h));
        body.appendChild(hd);
        continue;
      }
      var lines = item;
      var p = document.createElement("p");
      p.className = "para";
      p.setAttribute("data-pi", pi);
      for (var li = 0; li < lines.length; li++) {
        if (li > 0) p.appendChild(document.createElement("br"));
        p.appendChild(document.createTextNode(lines[li]));
      }
      body.appendChild(p);
    }
  }

  if (s.quote) {
    var qb = document.createElement("div");
    qb.className = "quote";
    qb.textContent = '"' + s.quote + '"';
    body.appendChild(qb);
  }

  var pv = $("prev"), nx = $("next");
  pv.disabled = (idx === 0);
  nx.disabled = (idx === SAYEON.length - 1);
  $("prevT").textContent = pv.disabled ? "" : shortTitle(SAYEON[idx - 1], idx - 1);
  $("nextT").textContent = nx.disabled ? "" : shortTitle(SAYEON[idx + 1], idx + 1);

  window.scrollTo(0, 0);
}

function go(delta) {
  var n = idx + delta;
  if (n < 0 || n >= SAYEON.length) return;
  idx = n;
  render();
}

/* ===== 읽어주기 ===== */
var synth = window.speechSynthesis;
var RATE = 1.2;            // 읽어주기 속도 (1 = 보통)
var queue = [], qi = 0, speaking = false;

if (!synth) { $("speak").disabled = true; $("warn").style.display = "block"; }

function pickVoice() {
  if (!synth || !synth.getVoices) return null;
  var vs = synth.getVoices(), i;
  for (i = 0; i < vs.length; i++) { if (vs[i].lang === "ko-KR") return vs[i]; }
  for (i = 0; i < vs.length; i++) { if (vs[i].lang && vs[i].lang.indexOf("ko") === 0) return vs[i]; }
  return null;
}

function highlight(pi) {
  var ps = document.querySelectorAll(".para");
  for (var i = 0; i < ps.length; i++) {
    var on = (Number(ps[i].getAttribute("data-pi")) === pi);
    ps[i].className = on ? "para reading" : "para";
    if (on && ps[i].scrollIntoView) {
      try { ps[i].scrollIntoView({ behavior: "smooth", block: "center" }); }
      catch (e) { ps[i].scrollIntoView(); }
    }
  }
}

var player = $("player");

function advanceOrStop() {
  if (speaking && cfg.autoNext && idx < SAYEON.length - 1) {
    idx++;
    render(true);
    startSpeak();
  } else {
    stopSpeak();
  }
}

player.onended = advanceOrStop;
player.onerror = advanceOrStop;

function speakNext() {
  if (qi >= queue.length) { advanceOrStop(); return; }
  var item = queue[qi];
  var u = new SpeechSynthesisUtterance(item.text);
  u.lang = "ko-KR";
  var v = pickVoice();
  if (v) u.voice = v;
  u.rate = RATE;
  u.onstart = function () { highlight(item.pi); };
  u.onend = function () { qi++; if (speaking) speakNext(); };
  u.onerror = function () { qi++; if (speaking) speakNext(); };
  synth.speak(u);
}

function startSpeak() {
  var s = SAYEON[idx];
  speaking = true;
  $("speak").textContent = "■ 정지";
  $("speak").className = "speakbtn on";

  if (s.audio) {
    if (synth) synth.cancel();
    player.src = s.audio;
    player.currentTime = 0;
    player.play();
    return;
  }

  if (!s.paragraphs || !s.paragraphs.length) { speaking = false; return; }
  queue = [];
  for (var i = 0; i < s.paragraphs.length; i++) {
    var it = s.paragraphs[i];
    if (it && it.hr) continue;
    queue.push({ pi: i, text: (it && it.h) ? it.h : it.join(" ") });
  }
  if (s.quote) queue.push({ pi: -1, text: s.quote });
  qi = 0;
  synth.cancel();
  speakNext();
}

function stopSpeak() {
  speaking = false;
  if (synth) synth.cancel();
  player.pause();
  queue = []; qi = 0;
  $("speak").textContent = "🔊 읽어주기";
  $("speak").className = "speakbtn";
  var ps = document.querySelectorAll(".para");
  for (var i = 0; i < ps.length; i++) { ps[i].className = "para"; }
}

/* ===== 검색 ===== */
function flatText(s) {
  var out = [];
  if (s.paragraphs) {
    for (var i = 0; i < s.paragraphs.length; i++) {
      var it = s.paragraphs[i];
      if (!it || it.hr) continue;
      out.push(it.h ? it.h : it.join(" "));
    }
  }
  if (s.quote) out.push(s.quote);
  return out.join(" ");
}

function runSearch() {
  var kw = $("q").value.replace(/^\s+|\s+$/g, "");
  var box = $("results");
  box.innerHTML = "";
  if (!kw) return;
  var found = 0;
  for (var i = 0; i < SAYEON.length; i++) {
    var s = SAYEON[i], text = flatText(s);
    var at = text.indexOf(kw);
    if (at < 0 && (s.title || "").indexOf(kw) < 0) continue;
    found++;
    var btn = document.createElement("button");
    btn.className = "hit";
    var b = document.createElement("b");
    b.textContent = fullTitle(s, i);
    btn.appendChild(b);
    if (at >= 0) {
      var from = Math.max(0, at - 20);
      var snip = document.createElement("span");
      snip.className = "snip";
      snip.textContent = (from > 0 ? "…" : "") + text.substr(from, 70) + "…";
      btn.appendChild(snip);
    }
    (function (t) { btn.onclick = function () { idx = t; closeAll(); render(); }; })(i);
    box.appendChild(btn);
  }
  if (found === 0) {
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "검색 결과가 없습니다.";
    box.appendChild(e);
  }
}

function buildList() {
  var box = $("listresults");
  box.innerHTML = "";
  for (var i = 0; i < SAYEON.length; i++) {
    var btn = document.createElement("button");
    btn.className = "hit";
    btn.textContent = fullTitle(SAYEON[i], i);
    (function (t) { btn.onclick = function () { idx = t; closeAll(); render(); }; })(i);
    box.appendChild(btn);
  }
}

function openModal(id) { $(id).className = "modal open"; }
function closeAll() {
  $("search").className = "modal";
  $("settings").className = "modal";
  $("listmodal").className = "modal";
}

/* ===== 이벤트 ===== */
$("prev").onclick = function () { go(-1); };
$("next").onclick = function () { go(1); };
$("speak").onclick = function () { if (speaking) { stopSpeak(); } else { startSpeak(); } };

$("opensettings").onclick = function () { openModal("settings"); };
$("closeset").onclick = closeAll;
$("opensearch").onclick = function () { openModal("search"); $("q").focus(); };
$("closeq").onclick = closeAll;
$("q").oninput = runSearch;

$("openlist").onclick = function () { openModal("listmodal"); };
$("navlist").onclick = function () { openModal("listmodal"); };
$("closelist").onclick = closeAll;

$("fsPlus").onclick = function () { cfg.size = Math.min(48, cfg.size + 2); applyCfg(); };
$("fsMinus").onclick = function () { cfg.size = Math.max(12, cfg.size - 2); applyCfg(); };
$("lhPlus").onclick = function () { cfg.lh = Math.min(3.0, cfg.lh + 0.15); applyCfg(); };
$("lhMinus").onclick = function () { cfg.lh = Math.max(1.2, cfg.lh - 0.15); applyCfg(); };
$("padPlus").onclick = function () { cfg.pad = Math.min(80, cfg.pad + 6); applyCfg(); };
$("padMinus").onclick = function () { cfg.pad = Math.max(0, cfg.pad - 6); applyCfg(); };
$("cText").oninput = function () { cfg.text = $("cText").value; applyCfg(); };
$("cBg").oninput = function () { cfg.bg = $("cBg").value; applyCfg(); };
$("resetAll").onclick = function () {
  cfg = { size: DEF.size, lh: DEF.lh, pad: DEF.pad, font: DEF.font, bg: DEF.bg, text: DEF.text, autoNext: DEF.autoNext };
  applyCfg();
};

(function () {
  var bs = $("autoOpts").getElementsByTagName("button");
  bs[0].onclick = function () { cfg.autoNext = true; applyCfg(); };
  bs[1].onclick = function () { cfg.autoNext = false; applyCfg(); };
})();

document.onkeydown = function (e) {
  if (e.keyCode === 37) go(-1);
  if (e.keyCode === 39) go(1);
  if (e.keyCode === 27) closeAll();
};

if (synth && typeof synth.onvoiceschanged !== "undefined") { synth.onvoiceschanged = pickVoice; }
window.onbeforeunload = stopSpeak;

function showLoadError(msg) {
  $("total").textContent = "";
  $("ctitle").textContent = "불러오지 못했습니다";
  var body = $("body");
  body.innerHTML = "";
  var d = document.createElement("div");
  d.className = "empty";
  var lines = [
    "사연 파일(sayeon.json)을 읽지 못했습니다.",
    msg,
    "index.html 과 sayeon.json 이 같은 폴더에 있어야 하고,",
    "웹 주소(http/https)로 열어야 동작합니다."
  ];
  for (var i = 0; i < lines.length; i++) {
    if (i > 0) d.appendChild(document.createElement("br"));
    d.appendChild(document.createTextNode(lines[i]));
  }
  body.appendChild(d);
  $("prev").disabled = true;
  $("next").disabled = true;
  $("speak").disabled = true;
  $("openlist").disabled = true;
  $("navlist").disabled = true;
  $("opensearch").disabled = true;
}

function loadData() {
  $("total").textContent = "불러오는 중…";
  var xhr = new XMLHttpRequest();
  xhr.open("GET", DATA_URL + "?v=" + (new Date()).getTime(), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var ok = (xhr.status === 200 || xhr.status === 0);
    if (!ok || !xhr.responseText) { showLoadError("(응답 코드 " + xhr.status + ")"); return; }
    try {
      SAYEON = JSON.parse(xhr.responseText);
    } catch (e) {
      showLoadError("(내용 형식 오류)");
      return;
    }
    if (!SAYEON.length) { showLoadError("(내용이 비어 있음)"); return; }
    SAYEON.sort(function (a, b) { return (b.no || 0) - (a.no || 0); });
    buildList();
    render();
  };
  xhr.onerror = function () { showLoadError("(연결 실패)"); };
  try { xhr.send(null); } catch (e) { showLoadError("(파일을 직접 열면 브라우저가 막습니다)"); }
}

/* ===== 잠금화면 ===== */
var PASSCODE = "7125";

function tryUnlock() {
  if ($("pw").value === PASSCODE) {
    $("lock").className = "lock hidden";
    try { localStorage.setItem("sayeon_unlocked", "1"); } catch (e) {}
    loadData();
  } else {
    $("pwwarn").style.display = "block";
    $("pw").value = "";
    $("pw").focus();
  }
}
$("pwok").onclick = tryUnlock;
$("pw").onkeydown = function (e) { if (e.keyCode === 13) tryUnlock(); };

buildOpts();
applyCfg();

var unlocked = false;
try { unlocked = localStorage.getItem("sayeon_unlocked") === "1"; } catch (e) {}
if (unlocked) {
  $("lock").className = "lock hidden";
  loadData();
} else {
  $("pw").focus();
}
</script>
