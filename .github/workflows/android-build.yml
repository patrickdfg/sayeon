name: 안드로이드 앱 만들기

# android/ 를 고치면 APK 를 만든다. 서명 암호(ANDROID_KEY_PASS)가 있으면 서명한 APK 를
# app/sayeon.apk 로 올려 https://patrickdfg.github.io/sayeon/app/sayeon.apk 에서 받게 하고,
# 없으면 시험용 APK 를 이 실행의 결과물(Artifacts)로만 남긴다. 설명은 AGENTS.md '안드로이드 앱'.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 도구 받기
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: 서명 열쇠 풀기
        if: env.ANDROID_KEY_PASS != ''
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/sayeon.keystore.enc -out "$RUNNER_TEMP/sayeon.keystore" \
            -pass env:ANDROID_KEY_PASS
          echo "KEYSTORE_FILE=$RUNNER_TEMP/sayeon.keystore" >> "$GITHUB_ENV"
          echo "KEY_PASS=$ANDROID_KEY_PASS" >> "$GITHUB_ENV"

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            echo "::warning::ANDROID_KEY_PASS 가 없어 시험용(debug) APK 만 만듭니다. 이 APK 는 배포하지 않습니다."
            ./gradlew --no-daemon assembleDebug
          fi

      - name: 만든 APK 확인
        run: |
          APK=$(ls android/app/build/outputs/apk/*/*.apk | head -n1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "package:|application-label:" 
          test "$(unzip -p "$APK" AndroidManifest.xml | wc -c)" -gt 0

      - name: 결과물로 남기기
        uses: actions/upload-artifact@v4
        with:
          name: sayeon-apk
          path: ${{ env.APK }}

      - name: 사이트에 올리기
        if: env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app
          cp "$APK" app/sayeon.apk
          git config user.name "sayeon-publisher[bot]"
          git config user.email "sayeon-publisher[bot]@users.noreply.github.com"
          git add app/sayeon.apk
          if git diff --cached --quiet; then
            echo "올릴 변경이 없습니다."
            exit 0
          fi
          git commit -m "안드로이드 앱(APK) 새로 만들기"
          git pull --rebase origin main
          git push origin main
          curl --fail-with-body --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
