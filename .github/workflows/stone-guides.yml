name: 월명동 가이드 녹음 가져오기
on:
  push:
    branches: [main]
    paths: ['stones/guide-catalog.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: stones-guide-import
  cancel-in-progress: false
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: 같은 작품의 녹음만 가져오기
        env:
          SAYEON_PASS: ${{ secrets.SAYEON_PASS }}
        run: python tools/import_stone_guides.py
      - name: 저장 및 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "sayeon-publisher[bot]"
          git config user.email "sayeon-publisher[bot]@users.noreply.github.com"
          git add stones/index.html stones/audio/*-guide.mp3 stones/guide-import-report.json UPDATE_HISTORY.md
          git commit -m "Connect matching Wolmyeongdong guide recordings"
          git pull --rebase origin main
          git push origin main
          gh api --method POST repos/${GITHUB_REPOSITORY}/pages/builds
