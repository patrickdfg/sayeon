name: 성령사연 남은 편 음성 만들기

# 아직 음성이 없는 편을 현수 목소리(Edge TTS)로 만들어 붙인다.
# Actions 탭에서 직접 돌리거나, work-upload/tts/request.json 을 올리면 돈다.
# 한 편 끝날 때마다 sayeon.json 에 바로 연결되므로, 중간에 멈춰도
# 이미 만든 편은 남고 다시 돌리면 남은 편부터 이어서 만든다.

on:
  # 음성 서버가 막혀 못 만든 편을 하루 한 번 저절로 다시 시도한다(한국 시간 06시 17분).
  # 만들 편이 없으면 아무것도 하지 않고 끝난다. 막혀 있으면 조용히 넘어가고 다음 날 다시 한다.
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '이번에 만들 편 수 (0 이면 남은 편 전부)'
        required: false
        default: '0'
  push:
    paths:
      - 'work-upload/tts/request.json'

permissions:
  contents: write
  pages: write

env:
  SAYEON_PASS: ${{ secrets.SAYEON_PASS }}

# 원고 자동 게시와 같은 줄에 세워 둔다. 둘이 동시에 main 을 밀지 않게.
concurrency:
  group: work-upload-main
  cancel-in-progress: false

jobs:
  tts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 현수 TTS 설치
        run: python -m pip install --disable-pip-version-check "edge-tts>=7.2.8,<8" imageio-ffmpeg==0.6.0 mutagen==1.47.0 cryptography==46.0.3

      - name: 몇 편 만들지 정하기
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$COUNT" ] && [ -f work-upload/tts/request.json ]; then
            COUNT=$(python -c "import io,json;print(json.load(io.open('work-upload/tts/request.json',encoding='utf-8')).get('count',0))")
          fi
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import sys, os
          sys.path.insert(0, 'tools')
          import crypt
          data = crypt.read_json(os.path.join(crypt.REPO, 'sayeon.json'))
          left = [e['no'] for e in data if not e.get('audio')]
          print('음성 없는 편 %d 개: %s' % (len(left), left))
          # 손으로 돌릴 때는 예전처럼 tts 가 없는 편 전부(--all). 매일 자동으로 도는 것은
          # 육성(audio)도 현수(tts)도 없는 편만 만든다 — 육성이 있는 옛 편에 현수 음성을 덧붙이지 않도록.
          todo_all = [e['no'] for e in data if not e.get('tts')]
          fresh = [e['no'] for e in data if not e.get('tts') and not e.get('audio')]
          todo = fresh if os.environ.get('EVENT') == 'schedule' else todo_all
          print('현수 음성을 만들 편 %d 개: %s' % (len(todo), todo))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('todo=%d\n' % len(todo))
              out.write('numbers=%s\n' % ' '.join(str(n) for n in fresh))
          PY

      - name: 현수 목소리로 음성 만들기
        id: make
        if: steps.plan.outputs.todo != '0'
        continue-on-error: true
        run: |
          for try in 1 2 3; do
            if [ "${{ github.event_name }}" = "schedule" ]; then
              ARGS="${{ steps.plan.outputs.numbers }}"
            else
              ARGS="--all --limit ${{ steps.plan.outputs.count }}"
            fi
            if python tools/make_tts.py $ARGS; then
              exit 0
            fi
            echo "::warning::중간에 멈췄습니다. 만든 편은 건너뛰고 다시 시도합니다 ($try/3)"
            sleep 30
          done
          echo "::warning::세 번 시도해도 끝내지 못했습니다. 만들어 둔 편까지만 저장합니다."
          exit 1

      - name: 결과를 main 에 저장
        if: always() && steps.plan.outputs.todo != '0'
        run: |
          rm -f work-upload/tts/request.json
          git config user.name "sayeon-publisher[bot]"
          git config user.email "sayeon-publisher[bot]@users.noreply.github.com"
          git add -A sayeon.json.enc audio work-upload
          if git diff --cached --quiet; then
            echo "새로 만든 음성이 없습니다."
            exit 0
          fi
          python -c "import sys;sys.path.insert(0,'tools');import crypt,os;crypt.read_json(os.path.join(crypt.REPO,'sayeon.json'))"
          python -m json.tool audio/sync.json > /dev/null
          test -z "$(find audio -type f -size +99M -print -quit)"
          LEFT=$(python -c "import sys,os;sys.path.insert(0,'tools');import crypt;print(sum(1 for e in crypt.read_json(os.path.join(crypt.REPO,'sayeon.json')) if not e.get('audio')))")
          git commit -m "성령사연 현수 음성 생성 (남은 편 ${LEFT})"
          git pull --rebase origin main
          git push origin main

      - name: GitHub Pages 다시 배포
        if: always() && steps.plan.outputs.todo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: 남은 편이 있으면 알린다
        if: always()
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, 'tools')
          import crypt
          data = crypt.read_json(os.path.join(crypt.REPO, 'sayeon.json'))
          left = [e['no'] for e in data if not e.get('audio')]
          print('아직 음성 없는 편 %d 개: %s' % (len(left), left))
          PY
