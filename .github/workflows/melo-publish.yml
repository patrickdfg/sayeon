name: 성령사연 Melo 음성 게시

# 현수(Edge) 음성 서버가 막혔을 때, 한 편을 MeloTTS(여자 목소리)로 읽어 바로 게시한다.
# 이미 컴퓨터 음성(tts)이 있는 편은 건드리지 않는다. 설명은 tools/publish_melo.py 머리말.

on:
  workflow_dispatch:
    inputs:
      story:
        description: 성령사연 번호 (여러 편은 공백으로 — 예 178 179)
        type: string
        required: true
      replace:
        description: 이미 Melo 음성이 있는 편을 다시 만들어 바꾸기
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

env:
  SAYEON_PASS: ${{ secrets.SAYEON_PASS }}

concurrency:
  group: work-upload-main
  cancel-in-progress: false

jobs:
  melo:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: MeloTTS 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install 'numpy<2' 'setuptools<81' cryptography edge-tts imageio-ffmpeg==0.6.0 mutagen==1.47.0
          python -m pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'git+https://github.com/myshell-ai/MeloTTS.git@209145371cff8fc3bd60d7be902ea69cbdb7965a'
          python -m unidic download
          python -m nltk.downloader averaged_perceptron_tagger averaged_perceptron_tagger_eng cmudict punkt punkt_tab

      - name: 음성 만들기와 연결
        env:
          STORY: ${{ inputs.story }}
          REPLACE: ${{ inputs.replace }}
        run: |
          case "$STORY" in *[!0-9\ ]*|"") echo "::error::편 번호는 숫자와 공백만 넣어 주세요."; exit 1;; esac
          if [ "$REPLACE" = "true" ]; then FLAG="--replace"; else FLAG=""; fi
          python tools/publish_melo.py $FLAG $STORY

      - name: 결과 검사
        env:
          STORY: ${{ inputs.story }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools')
          import crypt
          data = crypt.read_json('sayeon.json')
          sync = json.load(open('audio/sync.json', encoding='utf-8'))
          for no in [int(n) for n in os.environ['STORY'].split()]:
              entry = next(e for e in data if e['no'] == no)
              tts = entry.get('tts')
              assert tts and os.path.getsize(tts) > 10000, (no, tts)
              times = sync[os.path.basename(tts)]
              assert len(times) == len(entry['paragraphs']), (no, len(times), len(entry['paragraphs']))
              assert times == sorted(times)
              print('확인 OK — %d편 문단 %d, 연결 %s' % (no, len(times), tts))
          PY

      - name: 결과를 main 에 저장
        env:
          STORY: ${{ inputs.story }}
        run: |
          git config user.name "sayeon-publisher[bot]"
          git config user.email "sayeon-publisher[bot]@users.noreply.github.com"
          git add -A audio sayeon.json.enc
          git commit -m "성령사연 ${STORY}편 Melo 음성 게시"
          git pull --rebase origin main
          git push origin main

      - name: GitHub Pages 다시 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
