name: 성령사연 Azure 현수 음성 게시

# edge-tts(비공식)가 막혔을 때, Azure Speech 공식 API 의 현수 목소리로 한 편 이상을 읽어 바로 게시한다.
# 저장소 비밀값 AZURE_SPEECH_KEY, AZURE_SPEECH_REGION 이 있어야 한다(무료 F0). 설명은 tools/publish_azure.py 머리말.

on:
  workflow_dispatch:
    inputs:
      story:
        description: 성령사연 번호 (여러 편은 공백으로 — 예 178 179)
        type: string
        required: true
      replace:
        description: 이미 컴퓨터 음성(Melo·현수)이 있는 편을 현수(Azure)로 바꾸기
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

env:
  SAYEON_PASS: ${{ secrets.SAYEON_PASS }}

concurrency:
  group: work-upload-main
  cancel-in-progress: false

jobs:
  azure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 설치
        run: python -m pip install --disable-pip-version-check "edge-tts>=7.2.8,<8" imageio-ffmpeg==0.6.0 mutagen==1.47.0 cryptography==46.0.3

      - name: 음성 만들기와 연결
        env:
          STORY: ${{ inputs.story }}
          REPLACE: ${{ inputs.replace }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          case "$STORY" in *[!0-9\ ]*|"") echo "::error::편 번호는 숫자와 공백만 넣어 주세요."; exit 1;; esac
          if [ "$REPLACE" = "true" ]; then FLAG="--replace"; else FLAG=""; fi
          python tools/publish_azure.py $FLAG $STORY

      - name: 결과 검사
        env:
          STORY: ${{ inputs.story }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools')
          import crypt
          data = crypt.read_json('sayeon.json')
          sync = json.load(open('audio/sync.json', encoding='utf-8'))
          for no in [int(n) for n in os.environ['STORY'].split()]:
              entry = next(e for e in data if e['no'] == no)
              tts = entry.get('tts')
              assert tts and os.path.getsize(tts) > 10000, (no, tts)
              times = sync[os.path.basename(tts)]
              assert len(times) == len(entry['paragraphs']), (no, len(times), len(entry['paragraphs']))
              assert times == sorted(times)
              print('확인 OK — %d편 문단 %d, 연결 %s' % (no, len(times), tts))
          PY

      - name: 결과를 main 에 저장
        env:
          STORY: ${{ inputs.story }}
        run: |
          git config user.name "sayeon-publisher[bot]"
          git config user.email "sayeon-publisher[bot]@users.noreply.github.com"
          git add -A audio sayeon.json.enc
          git commit -m "성령사연 ${STORY}편 Azure 현수 음성 게시"
          git pull --rebase origin main
          git push origin main

      - name: GitHub Pages 다시 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
