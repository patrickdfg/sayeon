name: 새 사연 알림

# 자동 게시(work-upload.yml)는 끝에서 스스로 알림을 보낸다.
# 이 일꾼은 그 밖의 경우를 맡는다:
#  - 컴퓨터에서 sayeon.json.enc 를 직접 고쳐 올렸을 때
#  - Actions 화면에서 손으로 돌릴 때 (시험 알림을 고를 수 있다)
# 같은 편은 두 번 보내지 않으므로 겹쳐 돌아도 괜찮다.

on:
  push:
    branches: [main]
    paths:
      - 'sayeon.json.enc'
  workflow_dispatch:
    inputs:
      test:
        description: '시험 알림만 보내기'
        type: boolean
        default: true

env:
  SAYEON_PASS: ${{ secrets.SAYEON_PASS }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}

concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 준비
        run: python -m pip install --disable-pip-version-check pywebpush==2.5.0   # cryptography 47 이상을 함께 설치한다

      - name: 알림 보내기
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python tools/send_push.py --test
          else
            python tools/send_push.py
          fi
