name: Work 원고 자동 게시

on:
  push:
    branches: [main]
    paths:
      - 'work-upload/*.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

env:
  SAYEON_PASS: ${{ secrets.SAYEON_PASS }}
  # 현수(edge-tts)가 막혔을 때 쓰는 공식 길. 비밀값이 없으면 그 단계는 건너뛴다.
  AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
  AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

concurrency:
  group: work-upload-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 현수 TTS 설치
        run: python -m pip install --disable-pip-version-check "edge-tts>=7.2.8,<8" imageio-ffmpeg==0.6.0 mutagen==1.47.0 cryptography==46.0.3

      - name: 원고·음성·문단 동기화 생성
        id: process
        run: python tools/process_work_upload.py

      # edge-tts(비공식 길)는 마이크로소프트가 403 으로 막을 때가 있다.
      # 그러면 같은 현수 목소리를 Azure 공식 API 로 다시 만든다(무료 F0).
      - name: 현수 음성 다시 시도 (Azure 공식)
        id: azure
        if: steps.process.outputs.tts_failed == '1' && env.AZURE_SPEECH_KEY != ''
        continue-on-error: true
        run: python tools/publish_azure.py ${{ steps.process.outputs.tts_failed_no }}

      - name: 결과 검사
        run: |
          python -m unittest tools/test_work_pipeline.py
          python -c "import sys;sys.path.insert(0,'tools');import crypt,os;crypt.read_json(os.path.join(crypt.REPO,'sayeon.json'))"
          python -m json.tool audio/sync.json > /dev/null
          test -z "$(find audio -type f -size +99M -print -quit)"

      - name: 결과를 main에 저장
        run: |
          git config user.name "sayeon-publisher[bot]"
          git config user.email "sayeon-publisher[bot]@users.noreply.github.com"
          git add sayeon.json.enc audio work-upload
          git commit -m "Work 원고 자동 게시"
          git pull --rebase origin main
          git push origin main

      - name: GitHub Pages 다시 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

      # 설정에서 '새 사연 알림 → 받기'를 누른 기기로 알린다 (tools/send_push.py).
      # 사이트에 새 원고가 올라간 것을 확인하고 보내며, 같은 편은 두 번 보내지 않는다.
      # 비밀값이 없으면 건너뛴다.
      - name: 새 사연 알림 보내기
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check pywebpush==2.5.0
          python tools/send_push.py

      # 음성 서버가 막혀 현수 음성을 못 만든 경우: 글은 이미 게시했고, 실행만 실패로 표시해 앱이 알리게 한다.
      # 음성은 Actions 의 '성령사연 남은 편 음성 만들기' 를 돌리면 남은 편부터 이어서 만든다.
      - name: 음성이 만들어졌는지 확인
        if: steps.process.outputs.tts_failed == '1' && steps.azure.outcome != 'success'
        run: |
          echo "::error::글은 게시했지만 현수 음성을 만들지 못했습니다(음성 서버 거절). 나중에 '성령사연 남은 편 음성 만들기'를 돌려 주세요."
          exit 1
