:root{
  --page:#f3e6d3;
  --page-deep:#e9d5b9;
  --card:#fbf1e3;
  --card-glow:#ffe7c2;
  --bark:#4e2e24;
  --bark-soft:#7a5646;
  --acorn:#8a4b22;
  --leaf:#7d8a3a;
  --gold:#d9a936;
  --line:#e2cdb0;
  --text:#3d2a22;
  --muted:#7b6457;
  --heading:#4e2e24;
  --card-line:#e2cdb0;
  --tab-on-bg:#4e2e24;
  --tab-on-text:#fbf1e3;
  --font:"NanumBarunGothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page);
  background-image:radial-gradient(120% 60% at 50% 0%, var(--page) 40%, var(--page-deep) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%}
.wrap{max-width:480px;margin:0 auto;padding:28px 18px 56px}

/* header */
.masthead{padding:8px 4px 22px}
.squirrel{font-size:40px;line-height:1;display:block;margin-bottom:6px}
.masthead h1{
  font-family:var(--font);font-weight:700;
  font-size:clamp(20px,7.4vw,34px);line-height:1.2;margin:0;letter-spacing:-.02em;white-space:nowrap;
}
.masthead p{margin:6px 0 0;color:var(--muted);font-size:15px}


/* menu cards */
.menu{display:grid;gap:16px;list-style:none;margin:0;padding:0}
.tile,.banner{
  position:relative;display:block;width:100%;aspect-ratio:900/476;border-radius:14px;overflow:hidden;
  container-type:inline-size;text-decoration:none;color:var(--bark);
  background:rgba(255,255,255,.72);
  box-shadow:0 8px 20px -12px rgba(78,46,36,.5);
  -webkit-tap-highlight-color:transparent;transition:transform .15s ease;
}
.tile:active{transform:scale(.985)}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.tile span,.banner h2{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;
  font-family:var(--font);font-weight:700;text-align:center;white-space:nowrap;
  font-size:14.6cqw;line-height:1;letter-spacing:-.04em;padding:.06em 0 0;
  color:var(--bark);
}

/* sub pages */
.page{display:none}
.page.on{display:block;animation:enter .28s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.on{animation:none}.tile{transition:none}}

.topbar{position:sticky;top:0;z-index:5;margin:-28px -18px 18px;padding:12px 14px;
  background:var(--page);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.back{appearance:none;border:0;background:none;color:var(--text);font:inherit;font-size:15px;
  display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;cursor:pointer;text-decoration:none}
.back:focus-visible{outline:2px solid var(--gold)}
.topbar b{font-weight:700;font-size:15px;margin-left:auto;margin-right:6px;color:var(--muted)}

.banner{margin-bottom:10px;aspect-ratio:442/103}
.banner h2{font-size:7.37cqw}  /* 글자 높이 ≈ 배너 높이의 30% */
.lead{text-align:center;color:var(--muted);font-size:18px;line-height:1.5;margin:0 0 20px;white-space:nowrap}

.sheet{background:var(--card);color:var(--bark);border-radius:14px;padding:18px;margin-bottom:14px}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:700}
.sheet p{margin:0 0 6px;font-family:var(--font);font-size:16px}
.about{text-align:center;padding:26px 20px}
.about h3{font-size:clamp(18px,calc((100vw - 76px) / 11.8),24px);letter-spacing:-.02em;white-space:nowrap;margin:0 0 18px}
.about p{font-family:var(--font);font-size:clamp(12.5px,calc((100vw - 78px) / 21.5),17px);line-height:1.85;margin:0 0 1.3em;white-space:nowrap}
.about p:last-child{margin-bottom:0}
.about b{font-weight:700}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.facts dt{white-space:nowrap;font-weight:700;color:var(--bark-soft);font-size:14px;padding-top:2px}
.facts dd{margin:0;font-size:16px;word-break:keep-all}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 18px 4px;margin:0 -18px 14px;scrollbar-width:none;scroll-padding:0 18px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:transparent;color:var(--text);
  font:inherit;font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--tab-on-bg);border-color:var(--tab-on-bg);color:var(--tab-on-text)}
.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.sched{list-style:none;margin:0;padding:0}
.sched li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--card-line)}
.sched li:last-child{border-bottom:0}
.sched time{font-weight:700;color:var(--acorn);font-size:15px}
.sched strong{display:block;font-size:16px;word-break:keep-all}
.sched em{font-style:normal;color:var(--bark-soft);font-size:14px;word-break:keep-all}

.sec{margin:0;padding:0 0 8px 12px;position:relative;font-size:18px;font-weight:700;color:var(--bark);border-bottom:2px solid rgba(78,46,36,.25)}
.sec::before{content:"";position:absolute;left:0;top:3px;bottom:12px;width:4px;border-radius:2px;background:var(--acorn)}
.sec-gap{margin-top:18px}
.sched time{line-height:1.45}
.booths{display:grid;gap:8px}
.booths.in-row{margin-top:10px}
.booth{background:#fff8ee;border-radius:8px;padding:10px 12px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bh em{font-style:normal;color:var(--bark-soft);font-size:14px;white-space:nowrap}
.bp{list-style:none;margin:8px 0 0;padding:8px 0 0 14px;border-top:1px dashed var(--card-line)}
.sched .bp li{display:block;position:relative;padding:3px 0 3px 14px;border:0;font-size:16px;line-height:1.5;word-break:keep-all}
.bp li::before{content:"";position:absolute;left:2px;top:.8em;width:5px;height:5px;border-radius:50%;background:var(--acorn)}
.sched .bp-loc li{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bp li em{font-style:normal;color:var(--bark-soft);font-size:14px;white-space:nowrap}
.prog{border-left:0}
.prog .when{font-size:14px;color:var(--acorn);font-weight:700;margin-bottom:4px}

.fac{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.fac .fac-tbd{color:var(--bark-soft)}
.fac-list{list-style:none;margin:4px 0 0;padding:0}
.sheet .fac-grp{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-size:13px;color:var(--bark-soft);word-break:keep-all}
.sheet .fac-grp:first-of-type{margin-top:6px}
.fac-list + .fac-grp{padding-top:12px;border-top:1px solid var(--card-line)}
.pill{flex:none;white-space:nowrap;display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.5}
.pill-share{background:#dfe6c3;color:#4b5620}
.pill-sale{background:#f3d2ad;color:#6b3514}
.fac-list li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px dashed var(--card-line)}
.fac-list li:first-child{border-top:0;padding-top:2px}
.fac-list strong{display:block;font-size:15px;word-break:keep-all}
.fac-list small{display:block;margin-top:2px;font-size:13px;color:var(--bark-soft);word-break:keep-all}
.fac-list em{font-style:normal;font-size:13px;font-weight:700;color:var(--acorn);white-space:nowrap}
.fac .ic{font-size:26px;line-height:1.2}

.notice summary{cursor:pointer;list-style:none;font-weight:700;font-size:16px;display:flex;gap:10px;align-items:baseline}
.notice summary::-webkit-details-marker{display:none}
.notice summary .d{margin-left:auto;font-weight:400;font-size:13px;color:var(--bark-soft);white-space:nowrap}
.notice[open] summary{margin-bottom:8px}
.pin{font-size:12px;background:var(--bark);color:#fbf1e3;border-radius:6px;padding:1px 7px;font-weight:700}

.draft{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 0}
.prog-sec{margin:0 4px 10px;border-bottom:0;padding-bottom:0;font-size:17px;color:var(--heading)}
.prog-sec.sec-gap{margin-top:26px}
.plist{list-style:none;margin:6px 0 0;padding:0}
.plist li{padding:6px 0;border-top:1px dashed var(--card-line)}
.plist li:first-child{border-top:0}
.plist strong{display:block;font-size:16px}
.plist em{display:block;font-style:normal;color:var(--bark-soft);font-size:14px;word-break:keep-all}
.plist-sub{display:block;margin:2px 0;font-size:13px;color:var(--bark-soft);word-break:keep-all}
.notice-link{display:block;position:relative;padding-right:40px;text-decoration:none;color:var(--bark);font-weight:700;font-size:16px;-webkit-tap-highlight-color:transparent}
.notice-link::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:26px;line-height:1;color:var(--acorn)}
.notice-link:active{opacity:.7}
.notice-link:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.notice-detail h2{margin:0 0 10px;font-size:20px;line-height:1.4;word-break:keep-all}
.notice-detail h2:last-child{margin-bottom:0}
.notice-detail p{margin:0;word-break:keep-all}
.notice-detail .pending{color:var(--bark-soft)}
.invite img{display:block;width:100%;height:auto;border-radius:10px}
.invite-empty{text-align:center;padding:40px 12px;border:1.5px dashed var(--card-line);border-radius:10px}
.invite-empty p{margin:0;color:var(--bark-soft)}
.dl-btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--bark);color:#fbf1e3;font:inherit;font-weight:700;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}
.dl-btn:active{opacity:.85}
.dl-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.invite .dl-hint{margin:22px 0 0;text-align:center;font-size:13px;color:var(--bark-soft);word-break:keep-all}
.dl-btn[disabled]{background:var(--card-line);color:var(--bark-soft);cursor:default}
.work-title{margin:0 4px 12px;font-size:22px;line-height:1.3}
.embed{position:relative;padding:10px;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 8px 20px -14px rgba(78,46,36,.5);touch-action:pan-y}
.embed iframe{display:block;width:100%;max-width:100%;height:calc(100vh - 200px);height:calc(100dvh - 200px);min-height:460px;border:0;border-radius:6px;background:#fff;overflow-x:hidden;touch-action:pan-y}
.open-src{margin-top:14px}
.embed .ld{position:absolute;left:0;right:0;top:38%;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2;
  color:var(--bark-soft);font-size:14px;transition:opacity .25s ease;pointer-events:none}
.embed .ld svg{width:44px;height:44px;transform:rotate(-90deg)}
.embed .ld .trk{fill:none;stroke:var(--card-line);stroke-width:3.2}
.embed .ld .bar{fill:none;stroke:var(--acorn);stroke-width:3.2;stroke-linecap:round}
.embed .ld.done{opacity:0}
.embed.loading iframe{opacity:0}
.embed iframe{transition:opacity .25s ease}
@media (prefers-reduced-motion:reduce){.embed .ld,.embed iframe{transition:none}}
.inapp{position:relative;max-width:480px;margin:0 auto;padding:14px 18px;background:var(--card);color:var(--bark);border-bottom:1px solid var(--card-line)}
.inapp p{margin:0;font-size:14px;line-height:1.55;word-break:keep-all}
.inapp .inapp-msg{padding:0 36px;text-align:center}
.inapp-actions{display:flex;justify-content:center;gap:8px;margin-top:10px}
.inapp-open,.inapp-copy{flex:1;padding:10px 8px;border-radius:10px;font:inherit;font-size:14px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.inapp-open{background:var(--bark);color:#fbf1e3;border:0}
.inapp-copy{background:transparent;color:var(--bark);border:1.5px solid var(--card-line)}
.inapp-close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;background:none;color:var(--bark-soft);font-size:22px;line-height:1;cursor:pointer}
.inapp a:focus-visible,.inapp button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* 10/10 감사 축제 3개 행사 */
.f3{list-style:none;margin:0;padding:0}
.f3-item{padding:14px 0;border-bottom:1px dashed var(--card-line)}
.f3-item:last-child{border-bottom:0;padding-bottom:2px}
.f3-head{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.f3-no{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--acorn);color:#fbf1e3;font-size:14px;font-weight:700;line-height:1}
.f3-head strong{display:block;font-size:17px;line-height:26px}
.sheet .f3-meta{display:flex;justify-content:space-between;align-items:baseline;gap:2px 10px;margin:2px 0 0;font-size:14px}
.f3-meta time{font-weight:700;color:var(--acorn)}
.f3-meta em{font-style:normal;color:var(--bark-soft);white-space:nowrap;text-align:right}
.f3-item .booths{margin:10px 0 0 36px}
.bp-flat{margin-top:0!important;padding-top:0!important;border-top:0!important}
.sheet .f3-at{justify-content:flex-end;margin:14px 0 0 36px}
.f3 .bp li{display:block;position:relative;padding:3px 0 3px 14px;font-size:16px;line-height:1.5;word-break:keep-all}
.f3 .bp-loc li{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog p,.prog h3{word-break:keep-all}
/* 프로그램별 보기(메인) 카드 사진 */
.prog.has-media{padding-top:0;overflow:hidden}
.prog.has-media > .cover{display:block;width:calc(100% + 36px);max-width:none;height:auto;margin:0 -18px 14px -18px;aspect-ratio:9/5;object-fit:cover;background:#f1e0c8}
a.prog.has-media > .cover{width:calc(100% + 36px);margin-right:-18px}
a.prog.has-media::after{top:calc(50% + 50px)}
.prog.has-media > .cover-empty{display:flex;align-items:center;justify-content:center;font-size:34px;aspect-ratio:16/5}
.cover-empty{opacity:.55}
/* links to detail pages */
a.prog{display:block;text-decoration:none;color:var(--bark);position:relative;padding-right:40px;-webkit-tap-highlight-color:transparent}
a.prog::after,.sched .go::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:26px;line-height:1;color:var(--acorn)}
a.prog:active,.sched .go:active{opacity:.7}
a.prog:focus-visible,.sched .go:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.more{display:block;margin-top:6px;font-size:14px;font-weight:700;color:var(--acorn)}
.sched .go{display:block;position:relative;padding-right:28px;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.sched .go::after{right:2px;font-size:24px}
.detail-body p{word-break:keep-all}
.tbd{text-align:center;padding:36px 18px}
.tbd-ic{display:block;font-size:34px;line-height:1;margin-bottom:10px}
.tbd p{margin:0;font-size:16px;color:var(--bark-soft)}
.poster{display:block;width:100%;height:auto;border-radius:10px;margin-top:16px}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -18px 0;padding:0 18px 4px;scroll-padding:0 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gallery::-webkit-scrollbar{display:none}
.gallery:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gallery figure{flex:0 0 86%;margin:0;scroll-snap-align:start}
.gallery img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--card-line)}
.gallery-count{text-align:center;margin:10px 0 0;font-size:14px;color:var(--bark-soft)}
.detail-body .pending{color:var(--bark-soft);line-height:1.7;margin:0}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}
footer a{color:inherit}
/* 들어가기 표시: 마지막 줄 오른쪽 끝 · 겹화살표 · 원래 크기의 30% */
a.prog::after,.sched .go::after,.notice-link::after{content:none}
a.prog,.notice-link{padding-right:18px}
.sched .go{padding-right:0}
a.prog > .more,.notice-link,.sched .go > em{display:flex;align-items:last baseline}
a.prog > .more::after,.notice-link::before,.sched .go > em::after{content:"››";margin-left:auto;padding-left:10px;flex:none;
  font-size:8px;font-weight:700;letter-spacing:-1px;color:var(--acorn);position:static;transform:none}
.notice-link::before{order:9}
.notice-link > span{margin-right:5px}
.sched .go > em::after{font-size:7px}
/* 기획안 반영 추가 스타일 */
.sched small.note{display:block;margin-top:2px;font-size:12.5px;color:var(--acorn);font-style:normal;word-break:keep-all}
.sheet .f3-sub{margin:0 0 2px;font-size:13px;color:var(--bark-soft);word-break:keep-all}
.sheet .f3-note{margin:4px 0 0;font-size:13px;color:var(--acorn);font-weight:700}
.f3-more{display:flex;align-items:last baseline;margin-top:6px;font-size:14px;font-weight:700;color:var(--acorn);text-decoration:none}
.f3-more::after{content:"››";margin-left:auto;padding-left:10px;font-size:8px;letter-spacing:-1px}
.bp-desc li b{display:block;font-weight:700}
.bp-desc li span{display:block;font-size:13.5px;color:var(--bark-soft);line-height:1.45}
.prog .desc{margin:6px 0 0;font-size:13.5px;color:var(--bark-soft);word-break:keep-all}
.prog.has-media > .cover-contain{object-fit:contain;background:#fff;padding:10px 0}
.prog.has-media > .cover-top{object-position:center top}
.mc-day{margin:0 0 2px!important;font-size:13px;font-weight:700;color:var(--acorn)}
.detail-body .mc-title{margin:0 0 6px;line-height:1.4;word-break:keep-all}
.mc-extra{margin:10px 0 0!important;padding:10px 0 0 14px!important;border-top:1px dashed var(--card-line)!important}
.plist .plink{display:block;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
.plist .plink:active{opacity:.7}
.plist .plink .more{display:flex;align-items:last baseline;margin-top:4px;font-size:13px}
.plist .plink .more::after{content:"››";margin-left:auto;padding-left:10px;font-size:8px;font-weight:700;letter-spacing:-1px}
.detail-body .f3-at{margin:16px 0 6px}
.detail-body .f3-at:first-of-type{margin-top:10px}
.poem-text{margin:0 0 12px!important;line-height:1.75;word-break:keep-all;text-wrap:pretty}
.detail-body .poem-text:last-child{margin-bottom:0!important}
.poem-closing{color:var(--acorn);font-weight:700}
.sp-list{display:grid;gap:10px;margin-top:10px}
.sp-item{background:#f5e6cf;border-radius:10px;padding:12px 14px}
.sp-item h4{margin:0;font-size:16px;line-height:1.4;word-break:keep-all}
.sheet .sp-item p{margin:6px 0 0;font-size:14px;color:var(--bark-soft);line-height:1.6;word-break:keep-all}
.sp-sub{list-style:none;counter-reset:sp;margin:10px 0 0;padding:0}
.sp-sub li{counter-increment:sp;position:relative;padding:4px 0 4px 26px;font-size:14.5px;line-height:1.5;word-break:keep-all}
.sp-sub li::before{content:counter(sp);position:absolute;left:0;top:6px;width:19px;height:19px;border-radius:50%;
  background:#f1e0c8;color:var(--acorn);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sp-extra{list-style:none;margin:10px 0 0;padding:9px 0 0;border-top:1px dashed var(--card-line)}
.sp-extra li{position:relative;padding:3px 0 3px 13px;font-size:14px;color:var(--bark-soft);word-break:keep-all}
.sp-extra li::before{content:"";position:absolute;left:3px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--acorn)}
.sheet .sp-item .sp-note{margin:6px 0 0;font-size:13px;font-weight:400;color:var(--bark-soft);line-height:1.55}
.nb{white-space:nowrap}
.detail-body .booth-loc{margin:18px 0 8px;font-size:14px;font-weight:700;color:var(--acorn)}
.detail-body .booth-loc:first-of-type{margin-top:12px}
.sp-list.numbered .sp-item{display:grid;grid-template-columns:24px 1fr;column-gap:10px;align-items:start}
.sp-list.numbered .sp-item > *:not(.bn){grid-column:2}
.bn{grid-row:1/span 2;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  background:var(--acorn);color:#fbf1e3;font-size:12.5px;font-weight:700;line-height:1;margin-top:1px}
.sheet .days-plain{margin:0 0 10px;font-size:clamp(10.2px,3.2vw,12.5px);word-spacing:-.8px;letter-spacing:-.01em;line-height:1.5}
.facts-title{margin:0 0 10px;font-size:16px}
.cue{list-style:none;margin:6px 0 0;padding:0;counter-reset:cue}
.cue li{counter-increment:cue;position:relative;padding:9px 0 9px 32px;border-top:1px dashed var(--card-line);word-break:keep-all}
.cue li:first-child{border-top:0}
.cue li::before{content:counter(cue);position:absolute;left:0;top:10px;width:22px;height:22px;border-radius:50%;
  background:#f1e0c8;color:var(--acorn);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cue b{display:block;font-size:15px}
.cue span{display:block;margin-top:2px;font-size:13px;color:var(--bark-soft)}
/* 자세히 보기: 연한 알약형 배경 */
a.prog > .more,.plist .plink .more,.f3-more{display:inline-flex;align-items:baseline;gap:7px;width:auto;
  background:#f1e0c8;border-radius:999px;padding:4px 11px;margin-top:8px;font-size:12.5px}
a.prog > .more::after,.plist .plink .more::after,.f3-more::after{margin-left:0;padding-left:0;font-size:7px}
/* 체험 부스 그룹 제목 */
.grp{margin:0 4px 12px}
.grp-next{margin-top:34px;padding-top:26px;border-top:2px solid var(--card-line)}
.grp-title{margin:0;font-size:21px;line-height:1.3;color:var(--heading)}
.sheet .grp-sub,.grp-sub{margin:4px 0 0;font-size:14px;color:var(--muted)}
.days-plain{font-size:clamp(10.2px,3.2vw,12.5px);word-spacing:-.8px;color:var(--acorn);font-weight:700;line-height:1.5;white-space:nowrap;letter-spacing:-.01em}
.days-plain .d-label{display:block;color:var(--bark-soft);font-size:12.5px;letter-spacing:0}
.grp .grp-time{margin:2px 0 0;font-size:14px;font-weight:700;color:var(--acorn)}
/* 일자별 보기: 부스·전시 블럭 구분색 */
.day-booth{background:#f9ead5}
.day-exh{background:#f7e2c5}
.day-booth .sec,.day-exh .sec{border-bottom-color:rgba(78,46,36,.2)}
.day-booth .sched li,.day-exh .sched li{border-bottom-color:rgba(78,46,36,.2)}
.b-time{margin:0 0 2px!important;font-size:12.5px;color:var(--acorn);font-weight:700}
.b-time .d-label{display:block;color:var(--bark-soft);font-size:12.5px}
.facts .sub{font-size:13px;color:var(--bark-soft);font-weight:400}
.sched small.note-chip{display:inline-block;margin-top:5px;padding:3px 10px;border-radius:999px;background:#fbf6ee;border:1px solid rgba(78,46,36,.18);color:var(--bark);font-weight:700;font-size:12px;line-height:1.5}
/* 가을 배경 + 유리 카드 UI */
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,250,242,.35),rgba(255,247,236,.75))}
.wrap{background:transparent}
.topbar{background:transparent;border-bottom:0;backdrop-filter:saturate(1.2) blur(6px)}
.topbar .back{background:rgba(255,255,255,.78);border-radius:999px;padding:7px 14px;box-shadow:0 6px 16px -10px rgba(78,46,36,.6)}
.tile{backdrop-filter:blur(8px);aspect-ratio:auto;display:flex;align-items:center;padding:20px 18px;border-radius:22px;
  box-shadow:0 14px 30px -22px rgba(78,46,36,.85)}
.tile span{position:static;transform:none;font-size:20px;text-align:left;white-space:normal;color:var(--bark)}
.tile::after{content:"››";margin-left:auto;font-size:9px;font-weight:700;letter-spacing:-1px;color:var(--acorn)}
.banner{border-radius:22px;backdrop-filter:blur(8px);box-shadow:0 16px 34px -26px rgba(78,46,36,.9)}
.sheet{background:rgba(255,253,249,.85);backdrop-filter:blur(8px);border-radius:22px;box-shadow:0 16px 34px -26px rgba(78,46,36,.9)}
.tabs button{background:rgba(255,255,255,.72);border-color:transparent;backdrop-filter:blur(6px)}
.tabs button[aria-selected="true"]{background:var(--tab-on-bg);border-color:var(--tab-on-bg);color:var(--tab-on-text)}
.day-booth{background:rgba(249,234,213,.86)}
.day-exh{background:rgba(247,226,197,.86)}
.prog{background:rgba(255,255,255,.85)}
a.prog > .more,.plist .plink .more,.f3-more{background:#f6d9a6}
.inapp{background:rgba(255,255,255,.85);backdrop-filter:blur(8px)}

.dm-fix{}


.lead-sm{font-size:clamp(12px,3.6vw,14px)}
/* 미리보기: 더 맑은 톤 + 유리 재질 강화 + 그라데이션 아이콘 */
.sheet{background:rgba(255,253,250,.62);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 18px 38px -28px rgba(78,46,36,.75)}
.day-booth{background:rgba(253,246,236,.6)}
.day-exh{background:rgba(250,240,227,.6)}
.tile{background:rgba(255,255,255,.55)!important;border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(16px) saturate(1.15)}
.banner{background:rgba(255,255,255,.5)!important;border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(16px)}
.tabs button{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6)}
.prog{background:rgba(255,253,250,.68)}
.booth,.sp-item,.tbd{background:rgba(255,255,255,.55)}
.topbar .back{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(10px)}
.tile .ti{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;margin-right:12px;flex:none}
.tile .ti svg{width:38px;height:38px}
/* 유리 패널 재질 */
.sheet,.tile,.banner,.prog{position:relative;isolation:isolate;border-radius:26px;
  background:rgba(255,255,255,.24);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid rgba(255,255,255,.34);
  box-shadow:0 26px 50px -30px rgba(78,46,36,.6),
             inset 0 1px 0 rgba(255,255,255,.72),
             inset 0 -1px 0 rgba(255,255,255,.16),
             inset 0 -18px 30px -24px rgba(255,255,255,.55);
  overflow:hidden}
.sheet > *,.tile > *,.banner > *,.prog > *{position:relative;z-index:1}
.sheet::before,.tile::before,.banner::before,.prog::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 18% 6%,rgba(255,255,255,.7),rgba(255,255,255,0) 48%)}
.tabs button{background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.32);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.topbar .back{background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.32);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.booth,.sp-item,.tbd{background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.28);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.day-booth{background:rgba(255,252,247,.28)}
.day-exh{background:rgba(253,247,239,.32)}
/* 다크모드: 유리 카드가 배경에 묻히지 않도록 밝기 확보 */


/* 선택된 탭: 유리 재질 */
.tabs button[aria-selected="true"]{background:rgba(96,58,40,.38);border:1px solid rgba(255,255,255,.38);
  color:#fff;text-shadow:0 1px 6px rgba(60,32,18,.35);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -14px rgba(60,32,18,.8)}

:root{color-scheme:only light}
/* 목록형 카드: 화살표 복원 + 광택은 ::after로 */
.sheet.notice-link::before{content:"››";position:static;inset:auto;background:none;margin-left:auto;padding-left:10px;flex:none;
  font-size:8px;font-weight:700;letter-spacing:-1px;color:var(--acorn);order:9}
.sheet.notice-link::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:inherit;
  background:radial-gradient(120% 90% at 18% 6%,rgba(255,255,255,.7),rgba(255,255,255,0) 48%)}

/* ───── 돌보석 소개 페이지 전용 ───── */
.intro-lead{margin:0 4px 22px;text-align:center;color:var(--muted);font-size:15px;word-break:keep-all}
.cat{margin:0 4px 10px;font-size:17px;font-weight:700;color:var(--heading);display:flex;align-items:baseline;gap:8px}
.cat small{font-size:13px;font-weight:400;color:var(--muted)}
.cat-gap{margin-top:28px}
.stone-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.stone{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 16px 12px 12px;
  text-decoration:none;color:var(--bark);-webkit-tap-highlight-color:transparent;margin:0}
a.stone:active{opacity:.75}
a.stone:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.thumb{width:64px;height:64px;border-radius:16px;overflow:hidden;background:rgba(241,224,200,.75);
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:30px;height:30px;opacity:.7}
.stone strong{display:block;font-size:17px;line-height:1.35;word-break:keep-all}
.stone .sum{display:block;margin-top:2px;font-size:13.5px;color:var(--bark-soft);line-height:1.45;word-break:keep-all}
.stone .go-ic,.num-list .go-ic{font-size:8px;font-weight:700;letter-spacing:-1px;color:var(--acorn)}

.cover-box{margin:0 0 14px;padding:0}
.cover-box img{display:block;width:100%;height:auto;background:rgba(241,224,200,.6)}
.cover-none{aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--bark-soft);font-size:14px}
.cover-none svg{width:46px;height:46px;opacity:.55}
.stone-body h3{margin:0 0 10px;font-size:18px;color:var(--bark)}
.stone-body .qt{color:#a9761f;font-weight:700}
.stone-body.solo{margin:0}
.stone-body.solo .quote{margin:0 0 10px!important;padding:18px}
.stone-body .quote{display:block;margin:14px 0!important;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);text-align:center;font-weight:700;color:var(--acorn);line-height:1.75!important}
.stone-body .quote.spirit{color:#a9761f}
.stone-body .ask{margin:1.1em 0!important;text-align:center;font-size:17px;font-weight:700;color:var(--acorn);line-height:1.6}
.stone-body p{margin:0 0 .9em;line-height:1.8;word-break:keep-all;text-wrap:pretty}
.stone-body p:last-child{margin-bottom:0}
.stone-body .pending{color:var(--bark-soft);text-align:center;padding:6px 0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pager a{display:block;padding:12px 14px;font-size:14px;text-decoration:none;color:var(--bark);margin:0;
  -webkit-tap-highlight-color:transparent}
.pager a:active{opacity:.75}
.pager a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.pager small{display:block;font-size:12px;color:var(--acorn);font-weight:700}
.pager b{display:block;margin-top:2px;word-break:keep-all}
.pager .nx{text-align:right;grid-column:2}
.page:not(#home) > .banner:first-child{margin-top:8px}

/* 번호 목록 */
.num-list{list-style:none;margin:0;padding:6px 0;counter-reset:none}
.num-list li{border-top:1px solid rgba(78,46,36,.12)}
.num-list li:first-child{border-top:0}
.num-list a{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:13px 18px 13px 16px;
  text-decoration:none;color:var(--bark);-webkit-tap-highlight-color:transparent}
.num-list a:active{background:rgba(255,255,255,.35)}
.num-list a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:12px}
.no{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  background:linear-gradient(135deg,#c98a4b,#8a4b22);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 12px -8px rgba(78,46,36,.8)}
.nm strong{display:block;font-size:16.5px;line-height:1.35;word-break:keep-all}
.nm small{display:block;margin-top:1px;font-size:13px;color:var(--bark-soft);word-break:keep-all}
/* 세부 머리: 번호 + 이름 */
.banner.stone-head{aspect-ratio:auto;padding:22px 16px 20px;text-align:center}
.stone-head .sub-name{display:block;margin-top:2px}
.banner.stone-head h2{position:static;transform:none;font-size:clamp(22px,7vw,30px);line-height:1.25;white-space:normal;word-break:keep-all;padding:0}
.head-no{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 10px;margin-bottom:10px;border-radius:999px;
  font-size:15px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#c98a4b,#8a4b22);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.head-alias{margin:6px 0 0;font-size:14px;color:var(--bark-soft)}

/* iOS 사파리: 아래쪽 주소창에 글이 가리지 않도록 여백 */
.wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px))}
/* 언어 탭 아래 뒤로가기 줄이 겹치지 않도록 */
.page .topbar{position:static;margin:0 0 14px;padding:0;background:transparent;border-bottom:0;
  -webkit-backdrop-filter:none;backdrop-filter:none}
.page .topbar .back{display:inline-flex}

/* 언어 선택 탭 */
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.lang{appearance:none;border:1px solid rgba(255,255,255,.65);padding:14px 2px;border-radius:15px;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:700;white-space:nowrap;letter-spacing:-.02em;color:var(--bark);background:rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  -webkit-tap-highlight-color:transparent}
.lang.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#c98a4b,#8a4b22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -12px rgba(78,46,36,.9)}
.lang:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lang-note{margin:-2px 4px 12px;font-size:13px;color:var(--bark-soft);text-align:center;word-break:keep-all}

/* 음성 안내 플레이어 */
.player{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;padding:14px 18px 14px 14px}
.pl-btn{appearance:none;border:0;padding:0;width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#c98a4b,#8a4b22);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -10px rgba(78,46,36,.9);
  -webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.pl-btn:active{transform:scale(.94)}
.pl-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pl-btn svg{width:24px;height:24px;fill:#fff}
.pl-btn .i-play{margin-left:3px}
.pl-btn .i-pause,.player.playing .pl-btn .i-play{display:none}
.player.playing .pl-btn .i-pause{display:block}
.player.loading .pl-btn{animation:plpulse 1s ease-in-out infinite}
@keyframes plpulse{50%{opacity:.6}}
.pl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.pl-top b{font-size:14.5px;line-height:1.4;word-break:keep-all;color:var(--bark)}
.pl-time{flex:0 0 auto;font-size:13px;color:var(--bark-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-bar{--p:0%;-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;touch-action:none}
.pl-bar::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--acorn) var(--p),rgba(78,46,36,.15) var(--p))}
.pl-bar::-moz-range-track{height:6px;border-radius:999px;background:rgba(78,46,36,.15)}
.pl-bar::-moz-range-progress{height:6px;border-radius:999px;background:var(--acorn)}
.pl-bar::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(78,46,36,.45)}
.pl-bar::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(78,46,36,.45)}
.pl-bar:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:999px}
.player.off .pl-btn{background:rgba(78,46,36,.18);box-shadow:none;cursor:default}
.player.off .pl-bar{cursor:default}
.player.off .pl-bar::-webkit-slider-thumb{visibility:hidden}
.player.off .pl-bar::-moz-range-thumb{visibility:hidden}

/* ── 2026 키비주얼 색상 (배경·포인트 색) ── */
:root{--ac1:#f59aa8;--ac2:#d4536b;--acx:#c44660}
body{background:
  radial-gradient(60% 40% at 12% 78%, rgba(240,108,142,.20), transparent 70%),
  radial-gradient(55% 38% at 88% 70%, rgba(47,184,168,.22), transparent 70%),
  radial-gradient(50% 30% at 50% 95%, rgba(245,185,66,.20), transparent 70%),
  linear-gradient(180deg, #57b6ee 0%, #9bdcf6 34%, #cfeef0 62%, #f2e8d6 100%);
  background-attachment:fixed}
.no,.head-no,.pl-btn,.lang.on{background:linear-gradient(135deg,var(--ac1),var(--ac2))}
.dot:active{background:linear-gradient(135deg,var(--ac1),var(--ac2))}
.num-list a:active .no{background:var(--ac2)}
.no,.head-no{color:#fff}
.num-list .go-ic,.stone-body .quote,.stone-body .ask,.sec-head span,.lang{color:var(--acx)}
.stone-body .quote.spirit{color:#a9761f}
.pl-btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 16px -10px rgba(150,35,79,.9)}
.lang.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px -12px rgba(150,35,79,.9)}
